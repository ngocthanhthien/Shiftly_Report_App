  else if(key==='poClosures' && value && typeof value==='object'){ poClosures = value; idbPut('meta', {k:'poClosures', value: poClosures}); }
  else if(key==='tabConfig' && value && typeof value==='object'){ TAB_CONFIG = migrateTabConfig(value); idbPut('meta', {k:'tabConfig', value: TAB_CONFIG}); applyTabConfig(); }
  else if(key==='egressControl' && value && typeof value==='object'){
    EGRESS_CONFIG = normalizeEgressConfig(value);
    idbPut('meta', {k:'egressControl', value: EGRESS_CONFIG});
    updateCloudPill();
    refreshEgressLiveUI();
  }
}
let pulling = false;
async function pullFromCloud(){
  if(pulling) return;
  if(!cloudConfigured() || !navigator.onLine) return;
  pulling = true;
  try{
  let changed = false;
  lastPullCount = 0;
  let hasMore = true;
  while(hasMore){
  const cpRes = await cloudFetch('sync_get_checkpoints', {p_since: Number(syncCursors.checkpoints||'0')});
  if(cpRes && Array.isArray(cpRes.rows)){
    lastPullCount += cpRes.rows.length;
    // Ảnh (base64) không còn nằm trong cpRes.rows nữa (audit egress
    // 2026-09-21, xem schema.sql) — mỗi dòng chỉ mang `imagesFp` (fingerprint
    // rẻ). Gom lại đúng những key có fingerprint KHÁC ảnh đang có sẵn cục bộ
    // (hoặc chưa từng thấy dòng này) rồi tải ảnh cho ĐÚNG các key đó bằng 1
    // lệnh duy nhất — trước đây mọi dòng đều kèm sẵn ảnh dù chỉ 1 con số
    // khác vừa đổi, khiến mọi thiết bị khác tải lại ảnh cũ y hệt vô ích.
    const needImages = [];
    for(const row of cpRes.rows){
      const local = await idbGet('shifts', row.key);
      if(row.deleted){
        if(local && row.updatedAt >= local.updatedAt){ await idbDelete('shifts', row.key); changed = true; }
        continue;
      }
      if(!local || row.updatedAt > local.updatedAt){
        const fp = row.imagesFp || '';
        const keepLocalImages = !!local && local._imagesSyncedFp === fp;
        await idbPut('shifts', {
          key:row.key, date:row.date, shift:row.shift, section:row.section, po:row.po, itemCode:row.itemCode||'', recipe:row.recipe,
          client:row.client, technician:row.technician, fields:row.fields||{}, fieldNotes:row.fieldNotes||{},
          images: keepLocalImages ? (local.images||[]) : [], updatedAt:row.updatedAt, _syncedAt: row.updatedAt, _imagesSyncedFp: fp,
        });
        if(!keepLocalImages && fp) needImages.push(row.key);
        changed = true;
      }
    }
    let imagesOk = true;
    if(needImages.length){
      // Máy chủ trả tối đa ~40 ảnh/lần gọi (giới hạn thao tác R2 mỗi request) — phần chưa phục vụ nằm trong `pending`, gọi lại
      // cho tới khi hết. Mọi lỗi giữa chừng -> KHÔNG tiến cursor, lần poll sau thử lại nguyên trang (không bỏ sót ảnh).
      let todo = needImages.slice(), rounds = 0;
      while(todo.length && rounds++ < 200){
        const batch = todo.slice(0, 20), rest = todo.slice(20);
        const imgRes = await cloudFetch('sync_get_checkpoint_images', {p_keys: batch});
        if(!(imgRes && imgRes.items)){ imagesOk = false; break; }
        for(const key of batch){
          const images = imgRes.items[key];
          if(!Array.isArray(images)) continue;
          const cp = await idbGet('shifts', key);
          if(cp){ cp.images = images; await idbPut('shifts', cp); }
        }
        todo = (Array.isArray(imgRes.pending) ? imgRes.pending : []).concat(rest);
      }
      if(todo.length) imagesOk = false;
    }
    if(imagesOk && cpRes.cursor!=null){ syncCursors.checkpoints = String(cpRes.cursor); await idbPut('meta', {k:'syncCursors', value: syncCursors}); }
    hasMore = imagesOk && !!cpRes.hasMore;
  } else {
    hasMore = false;
  }
  if(!cpRes) break;
  }
  // p_since: cursor riêng cho meta (giống hệt nguyên lý seq của checkpoints)
  // — không có gì đổi thì server trả về {} gần như ngay lập tức thay vì
  // nguyên khối SCHEMA/PO-Recipe-Client-list mỗi lần poll (xem audit egress
  // 2026-09-19).
  const metaRes = await cloudFetch('sync_get_meta', {p_since: syncCursors.meta || null});
  if(metaRes && metaRes.items){
    for(const key of Object.keys(metaRes.items)){
      const incoming = metaRes.items[key];
      if(!incoming || incoming.value==null) continue;
      if(!metaAppliedAt[key] || incoming.updatedAt > metaAppliedAt[key]){
        metaAppliedAt[key] = incoming.updatedAt;
        applyRemoteMeta(key, incoming.value);
        changed = true;
      }
    }
    await idbPut('meta', {k:'metaAppliedAt', value: metaAppliedAt});
    if(metaRes.cursor!=null){ syncCursors.meta = metaRes.cursor; await idbPut('meta', {k:'syncCursors', value: syncCursors}); }
  }
  if(changed){ await refreshCache(); } // Refresh views when selected, preserving unsaved inputs.
  }finally{ pulling = false; }
}
async function flushOutbox(){
  if(flushing) return;
  if(!cloudConfigured()){ setCloudStatus('unconfigured'); return; }
  if(!navigator.onLine){ setCloudStatus('offline'); return; }
  flushing = true;
  setCloudStatus('syncing');
  lastCloudError = null;
  try{
    const items = await idbGetAll('outbox');
    const doneIds = [];

    const cpItems = items.filter(i=>i.kind==='checkpoint');
    const byKey = {};
    cpItems.forEach(i=>{ const cp=i.payload; if(!byKey[cp.key] || cp.updatedAt>byKey[cp.key].updatedAt) byKey[cp.key]=cp; });
    (await collectDirtyCheckpointRows()).forEach(cp=>{ if(!byKey[cp.key] || cp.updatedAt>byKey[cp.key].updatedAt) byKey[cp.key]=cp; });
    const allRows = Object.values(byKey);
    // Nhóm theo TỔNG DUNG LƯỢNG ước tính (không phải đếm cố định số dòng) —
    // 1 dòng có ảnh mới đổi (xem stripLocalMarkers) có thể nặng gấp hàng
    // trăm lần 1 dòng chỉ sửa số liệu; đếm cố định dễ khiến 1 lần gọi vượt
    // quá khả năng chịu tải của Wi-Fi xưởng (Tablet) trong khi phần lớn các
    // lần đẩy thực tế (chỉ sửa số liệu, ảnh đã lược bỏ) nhẹ hơn nhiều và có
    // thể gộp nhiều dòng hơn hẳn 5 dòng/lần.
    for(const rows of chunkRowsBySize(allRows, 1500000)){
    if(rows.length){
      const res = await cloudFetch('sync_put_checkpoints', {p_rows: rows});
      if(res){
        for(const cp of rows){
          const local = await idbGet('shifts', cp.key);
          const ack=(res.results||[]).find(r=>r.key===cp.key);
          if(local && local.updatedAt===cp.updatedAt && ack && (ack.applied || ack.reason==='stale')){
            // Only mark the whole row "synced" if images were either sent
            // this round, or were already fully in sync beforehand (the
            // "unchanged, lược bỏ để tiết kiệm băng thông" case). A
            // Protection-deferred NEW image (stripLocalMarkers, `images` not
            // in cp AND not actually in sync) must keep this row dirty so
            // collectDirtyCheckpointRows() naturally retries it later — see
            // stripLocalMarkers() comment.
            const imagesFullySynced = ('images' in cp) || local._imagesSyncedFp === imagesFingerprint(local);
            if(imagesFullySynced) local._syncedAt = cp.updatedAt;
            // Chỉ cập nhật dấu vân tay ảnh nếu lần push NÀY thật sự có gửi
            // `images` — nếu bị lược bỏ (ảnh không đổi), vân tay cũ vẫn còn
            // đúng, không cần tính lại.
            if('images' in cp) local._imagesSyncedFp = imagesFingerprint(local);
            await idbPut('shifts', local);
          }
        }
        const accepted = new Set((res.results||[]).filter(r=>r.applied || r.reason==='stale').map(r=>r.key));
        cpItems.filter(i=>accepted.has(i.payload.key) && rows.some(r=>r.key===i.payload.key)).forEach(i=>doneIds.push(i.id));
        if(accepted.size!==rows.length) lastCloudError='Máy chủ chưa xác nhận đầy đủ dữ liệu';
      }
      if(!res) break;
    }
    }

    const delItems = items.filter(i=>i.kind==='checkpointDelete');
    if(delItems.length){
      const byKeyD = {};
      delItems.forEach(i=>{ const d=i.payload; if(!byKeyD[d.key] || d.updatedAt>byKeyD[d.key].updatedAt) byKeyD[d.key]=d; });
      // 1 lệnh gọi cho TẤT CẢ key cần xoá (mỗi key giữ đúng updatedAt riêng)
      // thay vì lặp gọi từng key một — tránh N+1 round-trip khi xoá nhiều ca
      // cùng lúc (xem audit egress 2026-09-19).
      const deletes = Object.values(byKeyD).map(d=>({key:d.key, updatedAt:d.updatedAt}));
      // Máy chủ xử lý tối đa 20 dòng/lần gọi — chia lô, và chỉ đánh dấu xong đúng những dòng thuộc lô đã gửi thành công.
      for(let n=0; n<deletes.length; n+=20){
        const part = deletes.slice(n, n+20);
        const res = await cloudFetch('sync_delete_checkpoints', {p_deletes: part});
        if(!res) break;
        const sent = new Set(part.map(d=>d.key));
        delItems.filter(i=>sent.has(i.payload.key)).forEach(i=>doneIds.push(i.id));
      }
    }

    const metaItems = items.filter(i=>i.kind==='meta');
    if(metaItems.length){
      const byKeyM = {};
      metaItems.forEach(i=>{ const m=i.payload; if(!byKeyM[m.key] || m.updatedAt>byKeyM[m.key].updatedAt) byKeyM[m.key]=m; });
      const payload = {};
      Object.values(byKeyM).forEach(m=>{ payload[m.key] = {value:m.value, updatedAt:m.updatedAt}; });
      const res = await cloudFetch('sync_put_meta', {p_items: payload});
      if(res) metaItems.forEach(i=>doneIds.push(i.id));
    }

    const logItems = items.filter(i=>i.kind==='log');
    if(logItems.length){
      for(let n=0; n<logItems.length; n+=20){
        const part = logItems.slice(n, n+20);
        const res = await cloudFetch('sync_post_logs', {p_entries: part.map(i=>i.payload)});
        if(!res) break;
        part.forEach(i=>doneIds.push(i.id));
      }
    }

    for(const id of doneIds) await idbDelete('outbox', id);
    if(doneIds.length){ await refreshCache(); pingRealtimeChanged(); }
    await pullFromCloud();
    const remaining = await idbGetAll('outbox');
    if(lastCloudError){ setCloudStatus('error'); }
    else{
      cloudLastSyncAt = new Date().toISOString();
      await idbPut('meta', {k:'cloudLastSyncAt', value: cloudLastSyncAt});
      setCloudStatus(remaining.length ? 'error' : 'idle');
    }
  }catch(e){
    console.error(e);
    setCloudStatus('error');
  }
  flushing = false;
  syncDelay = cloudStatus==='error' ? Math.min(syncDelay*2, 300000) : lastPullCount ? baseSyncDelay() : Math.min(syncDelay*1.5, 120000);
  armSync();
}
function manualSync(){
  if(!cloudConfigured()){ toast('Chưa cấu hình đồng bộ'); return; }
  toast('Đang đồng bộ…');
  flushOutbox().then(()=>{
    if(cloudStatus==='error') toast(lastCloudError || 'Đồng bộ chưa xong — sẽ tự thử lại');
    else toast(lastPullCount>0 ? `Đã đồng bộ xong — nhận ${lastPullCount} thay đổi mới` : 'Đã đồng bộ xong — không có gì mới');
  });
}
// Escape hatch for a stuck/mismatched cursor: forget how far we've already
// pulled and re-fetch everything from the server from scratch. Safe to run
// any time — idbPut() upserts by key, so re-applying data already present
// locally is a harmless no-op.
function resyncFromScratch(){
  if(!cloudConfigured()){ toast('Chưa cấu hình đồng bộ'); return; }
  // The one genuinely large re-pull action in this app (forgets the cursor,
  // re-fetches everything) — restrict it under 🔴 Protection, same spirit as
  // "unnecessary data refresh"/"export-download large data" in the spec.
  // Record entry itself (persistAll/manualSync/wakeSync) is untouched.
  if(egressState().level==='protection'){
    toast('Đang ở mức 🔴 Protection (giới hạn traffic hằng ngày) — tạm không tải lại toàn bộ. Dữ liệu vẫn nhập/lưu bình thường; thử lại sau hoặc nhờ Admin mở thêm quota ở Cài đặt.');
    return;
  }
  toast('Đang đồng bộ lại toàn bộ từ đầu…');
  syncCursors.checkpoints = '0';
  syncCursors.meta = null;
  metaAppliedAt = {};
  idbPut('meta', {k:'syncCursors', value: syncCursors});
  idbPut('meta', {k:'metaAppliedAt', value: metaAppliedAt});
  flushOutbox().then(()=>{
    if(cloudStatus==='error') toast(lastCloudError || 'Đồng bộ chưa xong — sẽ tự thử lại');
    else toast(`Đã tải lại toàn bộ — nhận ${lastPullCount} điểm kiểm tra từ server`);
  });
}
// Mobile Chrome/Android throttle or fully suspend setInterval while the tab
// is backgrounded or the screen is locked (to save battery), so the 20s
// timer alone is unreliable on phones/tablets — it may simply not fire for
// long stretches. Layer on every event that reliably DOES fire the moment
// someone actually looks at the app again, so it catches up immediately
// instead of waiting on the background timer.
let syncTimer = null;
let syncDelay = 20000;
let lastWake = 0;
function armSync(){
  clearTimeout(syncTimer);
  if(document.visibilityState==='hidden' || !navigator.onLine) return;
  syncTimer=setTimeout(()=>{ flushOutbox().finally(armSync); },syncDelay);
}
// Tablet (tab Nhập liệu — chủ yếu GHI) không cần poll dồn dập: ghi của
// chính máy đã tự đẩy ngay qua persistAll(), và Realtime Broadcast đã lo
// phần "có ai vừa đổi gì" gần như tức thời khi kết nối được. PC (các tab
// quản lý/xem còn lại) muốn thấy dữ liệu mới nhanh hơn khi đang mở xem —
// vô hại khi không có realtime lẫn không tốn thêm gì đáng kể (chỉ vài GET
// nhỏ mỗi lần, xem cloudFetch).
// Audit egress 2026-09-21: khi Realtime Broadcast đã XÁC NHẬN kết nối
// (realtimeConnected — xem startRealtime), polling chỉ còn là lưới an toàn
// dự phòng (Realtime đã lo phần "gần như tức thời") — nới nhịp lên hẳn để
// bớt số lần gọi liên tục 24/7 trên mỗi thiết bị đang mở app. Chưa kết nối
// được (CDN chặn, mạng kém, hoặc chưa từng thử) thì vẫn giữ nhịp cũ.
function baseSyncDelay(){
  const active = qs('.tab[aria-selected="true"]');
  const isInput = active && active.dataset.tab==='input';
  const base = realtimeConnected ? (isInput ? 60000 : 30000) : (isInput ? 20000 : 8000);
  // Data & Egress Control: only the PERIODIC polling fallback backs off —
  // wakeSync()/manualSync()/persistAll() all trigger flushOutbox() directly
  // and bypass this delay entirely, so a QC entry's own save still syncs
  // immediately regardless of level (spec: "must NOT affect QC data entry").
  const level = egressState().level;
  if(level==='protection') return Math.max(base*4, 180000);
  if(level==='saving') return base*2;
  return base;
}
function wakeSync(){
  if(document.visibilityState==='hidden'){ clearTimeout(syncTimer); return; }
  if(Date.now()-lastWake<1500) return;
  lastWake=Date.now(); syncDelay=baseSyncDelay();
  if(cloudConfigured()) scheduleFlush(0);
  armSync();
}
window.addEventListener('online',wakeSync);
window.addEventListener('focus',wakeSync);
window.addEventListener('pageshow',wakeSync);
document.addEventListener('visibilitychange',wakeSync);
armSync();

/* ===================== REALTIME "WAKE UP" SIGNAL (optional, best-effort) =====================
   Chỉ báo "vừa có thay đổi" — KHÔNG mang dữ liệu: mỗi lần 1 thiết bị ghi thành công, máy chủ (Durable Object `Hub` trong
   cloudflare/src/worker.js) phát chữ "changed" tới mọi WebSocket đang mở; máy nhận chạy lại đúng pullFromCloud() đã có
   (debounce 400ms). Nếu WebSocket không kết nối được (mạng công ty chặn...), hàm này lặng lẽ không làm gì — vòng polling ở
   trên là lưới an toàn đã được kiểm thử và không cần Realtime để hoạt động. */
let realtimeSocket = null;
let realtimeRetryTimer = null;
let realtimePingTimer = null;
let realtimeFailures = 0;
let realtimePullTimer = null;
// Audit egress 2026-09-21: cờ này (không phải chỉ "có socket hay không") mới thật sự nói lên Realtime có đang SỐNG hay
// không — dùng để nới nhịp polling ở baseSyncDelay() khi đã chắc chắn không cần polling dồn dập nữa.
let realtimeConnected = false;
function scheduleRealtimePull(){
  clearTimeout(realtimePullTimer);
  // Gộp 1 loạt tín hiệu liên tiếp (VD 1 lần lưu chạm nhiều dòng) thành 1 lần kéo.
  realtimePullTimer = setTimeout(()=>{ if(!pulling) pullFromCloud().catch(e=>console.error(e)); }, 400);
}
async function startRealtime(){
  if(realtimeSocket || !cloudConfigured() || typeof WebSocket==='undefined') return;
  const token = await currentAccessToken();
  if(!token || realtimeSocket) return;
  try{
    const ws = new WebSocket(cloudCfg.url.replace(/^http/i,'ws') + '/realtime?token=' + encodeURIComponent(token));
    realtimeSocket = ws;
    ws.onopen = ()=>{
      realtimeConnected = true; realtimeFailures = 0;
      // Vừa xác nhận kết nối — áp dụng nhịp poll mới (baseSyncDelay()) ngay thay vì đợi armSync() kế tiếp.
      syncDelay = baseSyncDelay();
      clearInterval(realtimePingTimer);
      realtimePingTimer = setInterval(()=>{ try{ if(ws.readyState===1) ws.send('ping'); }catch(e){} }, 50000);
    };
    ws.onmessage = e=>{ if(e.data==='changed') scheduleRealtimePull(); };
    ws.onerror = ()=>{ try{ ws.close(); }catch(e){} };
    ws.onclose = ()=>{
      if(realtimeSocket!==ws) return; // đã chủ động stopRealtime()
      realtimeSocket = null; realtimeConnected = false;
      clearInterval(realtimePingTimer);
      syncDelay = baseSyncDelay();
      if(currentMember){
        realtimeFailures++;
        clearTimeout(realtimeRetryTimer);
        realtimeRetryTimer = setTimeout(startRealtime, Math.min(60000, 2000 * Math.pow(2, Math.min(realtimeFailures, 5))));
      }
    };
  }catch(e){ console.error('Realtime connect failed (falling back to polling only):', e); realtimeSocket = null; realtimeConnected = false; }
}
function stopRealtime(){
  clearTimeout(realtimeRetryTimer); clearInterval(realtimePingTimer);
  const ws = realtimeSocket;
  realtimeSocket = null; realtimeConnected = false;
  if(ws){ try{ ws.close(); }catch(e){} }
}
// Máy chủ tự phát tín hiệu sau mỗi lần ghi thành công, nên client không cần tự gửi nữa (giữ hàm để mọi nơi gọi cũ không đổi).

/* ===================== ACCESS CONTROL (Cloudflare Worker auth) =====================
   Khi đã cấu hình đồng bộ (địa chỉ Worker — mặc định đã đặt sẵn), TOÀN BỘ app nằm sau màn hình đăng nhập thật. Hai dạng
   tài khoản, cách đăng nhập/mật khẩu giữ nguyên như bản cũ:
     - Admin: email + mật khẩu.
     - Nhân viên/Giám sát: tên đăng nhập + mật khẩu.

   tạm quá lần whoami thành công gần nhất. Nếu chưa cấu hình đồng bộ, không có gì ở đây chạy: app dùng offline y như trước. */
let currentMember = null; // {userId, displayName, username, role} once signed in + verified, else null
const AUTH_KEY = 'shiftly-cf-auth';
let authSession = null;   // {accessToken, refreshToken, expiresAt, user}
function loadAuthSession(){
  try{ authSession = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); }catch(e){ authSession = null; }
}
function saveAuthSession(sess){
  authSession = sess || null;
  try{ if(sess) localStorage.setItem(AUTH_KEY, JSON.stringify(sess)); else localStorage.removeItem(AUTH_KEY); }catch(e){}
}
async function authPost(path, body){
  const res = await fetch(cloudCfg.url + path, {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body||{}), signal: AbortSignal.timeout(20000),
  });

let tokenRefreshing = null;
async function currentAccessToken(){

        if(r.status===200) saveAuthSession(r.data);
        else if(r.status===401){ saveAuthSession(null); if(currentMember) onAccessRevoked('Phiên đăng nhập đã hết hạn — vui lòng đăng nhập lại.'); }
      }catch(e){ /* mất mạng: giữ phiên, thử lại lần sau */ }
      finally{ tokenRefreshing = null; }
    })();
  }
  await tokenRefreshing;
  return authSession ? authSession.accessToken : null;
}

// Nút "🚪 Đăng xuất" ở góc topbar (khác nút cùng tên trong tab Cài đặt: nút
// này CÒN xoá bộ nhớ cache trình duyệt của trang). Chỉ xoá đúng CacheStorage
// (Cache API) + huỷ đăng ký mọi Service Worker của origin này — đây là toàn
// bộ phần "cache trang web" mà JS thật sự có quyền xoá được (trình duyệt
// không cấp API nào để trang tự xoá bộ nhớ đệm HTTP đĩa của chính nó, kể cả
// Ctrl+Shift+R vẫn là hành động NGƯỜI DÙNG, không phải JS). CỐ Ý KHÔNG đụng
// tới IndexedDB (toàn bộ dữ liệu QC thật) hay localStorage khác — đăng xuất
// không được phép xoá dữ liệu đã nhập, chỉ xoá cache. Tải lại trang sau khi
// xong để chắc chắn lần mở kế tiếp lấy đúng bản mới nhất từ server.
async function clearBrowserCaches(){
  try{
    if(window.caches && caches.keys){
      const keys = await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
  }catch(e){ console.error('clear caches failed', e); }
  try{
    if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations){
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
  }catch(e){ console.error('unregister service workers failed', e); }
}
async function logoutAndClearCache(){
  await signOutCloud();
  await clearBrowserCaches();
  location.reload();
}
// Runs after a successful sign-in AND on every app boot when a
// persisted session already exists — always re-verifies against the server
// (sync_whoami) rather than trusting anything cached, since an Admin may
// have disabled the account or changed its role since the last visit.
async function verifyAndEnter(){
  let res = await cloudFetch('sync_whoami', {});
  // cloudFetch trả null cả khi mất mạng lẫn khi bị từ chối — bị từ chối thì onAccessRevoked() đã xoá phiên; còn phiên nghĩa là
  // chỉ đang offline: vào app bằng thông tin đã lưu ở lần đăng nhập gần nhất (offline-first), lần đồng bộ có mạng kế tiếp sẽ
  // tự kiểm lại quyền thật với máy chủ.
  if(!res && authSession && authSession.user) res = authSession.user;
  if(!res || res.error){ await onAccessRevoked(); return false; }
  currentMember = {userId:res.userId, displayName:res.displayName, username:res.username, role:res.role};
  updateMemberPill();
  showApp();
  renderAll();
  startRealtime();
  flushOutbox();

}
// Called on boot (once cloud is configured) and right after saving a new
// server address in Cài đặt — decides whether to show the app or the login gate.
async function checkAccessGate(){
  if(!cloudConfigured()){ showApp(); renderAll(); return; }
  loadAuthSession();
  if(authSession){ await verifyAndEnter(); }
  else showLoginGate();
}
async function loginRequest(identifier, password, wrongMsg){
  if(!cloudConfigured()) return 'Chưa cấu hình đồng bộ';
  let r;
  try{ r = await authPost('/auth/login', {identifier: (identifier||'').trim(), password: password||''}); }
  catch(e){ return 'Không kết nối được máy chủ — kiểm tra mạng rồi thử lại'; }
  if(r.status===429) return 'Đăng nhập sai quá nhiều lần — vui lòng thử lại sau ít phút';
  if(r.status!==200) return wrongMsg;
  saveAuthSession(r.data);
  const ok = await verifyAndEnter();
  return ok ? null : 'Tài khoản chưa được cấp quyền truy cập app này';
}

/* ===================== SPEC / VALUE HELPERS ===================== */
// 4-band spec model (matches the QC_Inspection_Pro / FG_Release_Inspection
// family of apps): hardMin/hardMax = LSL/USL (spec limits, hard pass/fail),
// tMin/tMax = LCL/UCL (control/target limits, inner "ideal" band).
function specText(f, recipeVal){
  if(f.type!=='number') return '';
  const ef = effectiveSpec(f, recipeVal);
  const parts = [];
  if(ef.hardMin!=null || ef.hardMax!=null){
    if(ef.hardMin!=null && ef.hardMax!=null) parts.push(`LSL–USL: ${ef.hardMin} – ${ef.hardMax}`);
    else if(ef.hardMax!=null) parts.push(`USL: ≤ ${ef.hardMax}`);
    else parts.push(`LSL: ≥ ${ef.hardMin}`);
  }
  if(ef.tMin!=null || ef.tMax!=null){
    if(ef.tMin!=null && ef.tMax!=null) parts.push(`LCL–UCL: ${ef.tMin} – ${ef.tMax}`);
    else if(ef.tMax!=null) parts.push(`UCL: ≤ ${ef.tMax}`);
    else parts.push(`LCL: ≥ ${ef.tMin}`);
  }
  if(recipeVal && f.recipeOverrides && f.recipeOverrides[recipeVal]) parts.push(`(riêng Recipe ${recipeVal})`);
  return parts.length ? 'Chuẩn: ' + parts.join(' · ') : '';
}
function evalStatus(f, v, recipeVal){
  if(f.type!=='number' || v==null || v==='') return null;
  const ef = effectiveSpec(f, recipeVal);
  const hasAny = ef.hardMin!=null||ef.hardMax!=null||ef.tMin!=null||ef.tMax!=null;
  if(!hasAny) return null;
  if(ef.hardMin!=null && v<ef.hardMin) return 'fail';
  if(ef.hardMax!=null && v>ef.hardMax) return 'fail';
  if(ef.tMin!=null && v<ef.tMin) return 'cond';
  if(ef.tMax!=null && v>ef.tMax) return 'cond';
  return 'pass';
}
// Simple 2-state helper kept for call sites that just need red/green (fail vs ok).
function inSpec(f, v, recipeVal){
  const s = evalStatus(f, v, recipeVal);
  if(s==null) return null;
  return s !== 'fail';
}

/* ===================== TAB LAYOUT & PER-ROLE VISIBILITY =====================
   Admin-configurable: reorder the tab bar, and hide individual tabs for the
   'user' and/or 'supervisor' role (Admin always sees every tab, regardless
   of this config — Admin can't lock themselves out). Stored as a single
   meta key ('tabConfig'), synced like PO_LIST/CLIENT_LIST/etc. — see
   applyRemoteMeta() and the "🗂️ Sắp xếp & Ẩn/hiện Tab" card in Cài đặt. */
const TAB_ORDER_DEFAULT = ['input','report','table','itemcodelist','clientlist','specs','datalog','polist','settings','guide'];
const TAB_LABELS = {input:'Nhập liệu', table:'Dữ liệu', polist:'Danh sách PO', clientlist:'Danh sách Client', itemcodelist:'Danh sách Items Code', datalog:'Data Log', report:'Báo cáo', specs:'Specs', settings:'Cài đặt', guide:'Hướng dẫn'};
// Mặc định: Nhân viên (user) chỉ thấy Nhập liệu/Báo cáo/Dữ liệu/Items Code/
// Hướng dẫn; ẩn các tab còn lại. Giám sát ẩn Nhập liệu.
// Admin luôn thấy đủ mọi tab (xem applyTabConfig) nên không thể tự khoá mình.
const TAB_CONFIG_VERSION = 4;
function defaultTabConfig(){
  return { v: TAB_CONFIG_VERSION, order: TAB_ORDER_DEFAULT.slice(), hidden: { user: ['clientlist','specs','datalog','polist','settings'], supervisor: ['input'] } };
}
let TAB_CONFIG = defaultTabConfig();
// Cấu hình tab lưu từ bản cũ hơn (khác version) bị bỏ, dùng lại mặc định mới —
// áp dụng cho cả bản lưu trong máy lẫn bản đồng bộ về.
function migrateTabConfig(cfg){
  return (!cfg || cfg.v!==TAB_CONFIG_VERSION) ? defaultTabConfig() : normalizeTabConfig(cfg);
}
function normalizeTabConfig(cfg){
  const order = Array.isArray(cfg && cfg.order) ? cfg.order.filter(id=>TAB_ORDER_DEFAULT.includes(id)) : [];
  TAB_ORDER_DEFAULT.forEach(id=>{ if(!order.includes(id)) order.push(id); }); // tab nào thiếu trong cấu hình cũ (VD thêm mới sau này) vẫn không bị mất, đưa xuống cuối
  const hidden = {};
  ['user','supervisor'].forEach(role=>{
    hidden[role] = Array.isArray(cfg && cfg.hidden && cfg.hidden[role]) ? cfg.hidden[role].filter(id=>TAB_ORDER_DEFAULT.includes(id)) : [];
  });
  return { v: TAB_CONFIG_VERSION, order, hidden };
}
// Sắp xếp lại DOM theo TAB_CONFIG.order, ẩn/hiện theo vai trò hiện tại (bỏ
// qua hoàn toàn với Admin — luôn thấy đủ), và tự chuyển sang tab đầu tiên
// còn hiện nếu tab đang chọn vừa bị ẩn (VD Supervisor vừa đăng nhập, tab
// mặc định "Nhập liệu" bị ẩn với vai trò này).
function applyTabConfig(){
  const tabsRow = qs('.tabs');
  if(!tabsRow) return;
  const btns = {};
  qsa('.tab', tabsRow).forEach(b=>{ btns[b.dataset.tab] = b; });
  TAB_CONFIG.order.forEach(id=>{ if(btns[id]) tabsRow.appendChild(btns[id]); });
  const role = currentMember ? currentMember.role : null;
  const hiddenIds = (role && role!=='admin' && TAB_CONFIG.hidden[role]) ? TAB_CONFIG.hidden[role] : [];
  Object.keys(btns).forEach(id=>{ btns[id].style.display = hiddenIds.includes(id) ? 'none' : ''; });
  const activeBtn = qs('.tab[aria-selected="true"]', tabsRow);
  if(activeBtn && hiddenIds.includes(activeBtn.dataset.tab)){
    const firstVisible = TAB_CONFIG.order.find(id=>!hiddenIds.includes(id) && btns[id]);
    if(firstVisible) showTab(firstVisible);
  }
}

function getPrevCheckpoint(section, po, excludeKey){
  const matches = allCheckpoints.filter(r=>r.section===section && r.po===po && r.key!==excludeKey);
  if(matches.length===0) return null;
  matches.sort((a,b)=>(a.date+a.shift).localeCompare(b.date+b.shift));
  return matches[matches.length-1];
}
function getPrevMetaCheckpoint(date, shift){
  const matches = allCheckpoints.filter(r=>r.section==='META' && (r.date+r.shift) < (date+String(shift)));
  if(matches.length===0) return null;
  matches.sort((a,b)=>(a.date+a.shift).localeCompare(b.date+b.shift));
  return matches[matches.length-1];
}

      listCard.appendChild(row);
    });
  }
  root.appendChild(listCard);

  // ---- Thêm / Sửa điểm kiểm tra ----
  const editingCp = renderInputForm._editKey ? allCheckpoints.find(r=>r.key===renderInputForm._editKey) : null;
  const isOpen = renderInputForm._addOpen || !!editingCp;

  if(!isOpen){
    const addBtn = el('button',{class:'btn teal'},['➕ Thêm điểm kiểm tra']);
    addBtn.addEventListener('click', ()=>{ renderInputForm._addOpen = true; renderInputForm._draft = null; renderInputForm(); });
    root.appendChild(addBtn);
    root.appendChild(metaCard);
    return;
  }

  const formCard = el('div',{class:'card'},[
    el('div',{class:'card-h'},[editingCp ? 'Sửa điểm kiểm tra' : 'Thêm điểm kiểm tra mới', el('div',{class:'rule'})]),
  ]);
  const closeBtn = el('button',{class:'btn ghost sm', style:'margin-bottom:12px;'},['✕ Đóng']);
  closeBtn.addEventListener('click', ()=>{ resetUiState(); renderInputForm(); });
  formCard.appendChild(closeBtn);

  // Thứ tự nhập liệu MỚI (theo yêu cầu): QC => Công đoạn => Item Code =>
  // Item Name/Recipe (tự động) => PO => Checkpoint (chỉ tiêu) => Issue/
  // Action => Lưu. `captureDraft` được khai báo (function declaration, nên
  // được hoist) và DÙNG NGAY ở QC bên dưới dù bản thân nó (và fieldEls/
  // noteEls/draftScope nó đóng closure) chỉ thực sự khởi tạo xong sau khi đã
  // qua các gate Công đoạn/PO — an toàn vì captureDraft() luôn kiểm tra
  // fieldsRendered trước, y hệt cơ chế đã có sẵn cho itemCodeAC/poAC.
  function captureDraft(){
    if(!fieldsRendered) return;
    const draftFields = {}, draftNotes = {};
    Object.keys(fieldEls).forEach(fid=>{ draftFields[fid] = fieldEls[fid].getValue(); });
    Object.keys(noteEls).forEach(fid=>{ draftNotes[fid] = noteEls[fid].value; });
    const draftIssuePairs = issueRowEls.map(r=>({issue:r.issueInp.value, action:r.actionInp.value}));
    renderInputForm._draft = { scope: draftScope, fields: draftFields, fieldNotes: draftNotes, issuePairs: draftIssuePairs };
  }

  // ---- QC (bắt buộc, KHÔNG tự chọn sẵn) ----
  const qcVal0 = editingCp ? (editingCp.technician||'') : (renderInputForm._newQc||'');
  const qcSel = el('select',{class:'inp'},[]);
  qcSel.appendChild(el('option',{value:''},['— Chọn QC —']));
  TECHNICIANS.forEach(t=>{ const o=el('option',{value:t},[t]); if(t===qcVal0) o.setAttribute('selected','selected'); qcSel.appendChild(o); });
  formCard.appendChild(el('label',{class:'fld'},[el('span',{class:'lab'},['Tên QC *']), qcSel]));
  qcSel.addEventListener('change', ()=>{
    captureDraft();
    if(editingCp) editingCp.technician = qcSel.value; else renderInputForm._newQc = qcSel.value;
    renderInputForm();
  });

  // ---- Công đoạn (Process) — chỉ ROA/EXT/EVA/FD/FP khi tạo MỚI (mục 5).
  // Đang sửa 1 điểm kiểm tra cũ thì Công đoạn giữ nguyên (không đổi được),
  // kể cả với META lịch sử — vẫn hiển thị/sửa/xuất bình thường, chỉ không
  // còn chọn được khi TẠO MỚI nữa. FOAMING và REWORK đã bị xoá hẳn khỏi
  // SCHEMA (không còn công đoạn hợp lệ nào 2 tên này nữa, kể cả khi sửa dữ
  // liệu cũ) — xem comment ở stageIds()/INPUT_PROCESS_OPTIONS phía trên. ----
  let secId;
  if(editingCp){
    secId = editingCp.section;
    // Công đoạn của checkpoint lịch sử này đã bị xoá hẳn khỏi SCHEMA (VD:
    // "Tạo bọt (Foaming)") — không còn field nào để dựng lưới chỉ tiêu, nên
    // dừng ở đây với thông báo rõ ràng thay vì crash (sectionById trả về
    // undefined). Dữ liệu vẫn còn nguyên trong IndexedDB/Supabase, chỉ
    // không sửa được qua màn hình này nữa.
    if(!sectionById(secId)){
      formCard.appendChild(el('p',{class:'sub', style:'margin:0;color:var(--fail);'},[`⚠️ Công đoạn "${secId}" của điểm kiểm tra này không còn được hỗ trợ trong app (đã bị xoá khỏi Specs) — không thể sửa qua màn hình này. Dữ liệu vẫn còn nguyên, xem ở tab Dữ liệu.`]));
      root.appendChild(formCard);
      root.appendChild(metaCard);
      return;
    }
    formCard.appendChild(el('div',{class:'kv', style:'border:none;'},[el('span',{class:'k'},['Công đoạn']), el('span',{class:'v'},[sectionById(secId).name])]));
  } else {
    secId = renderInputForm._newSection || '';
    const secSel = el('select',{class:'inp'},[]);
    secSel.appendChild(el('option',{value:''},['— Chọn Công đoạn —']));
    INPUT_PROCESS_OPTIONS.forEach(id=>{
      const s = sectionById(id);
      if(!s) return; // an toàn nếu section này lỡ bị xoá khỏi SCHEMA
      const o = el('option',{value:id},[s.name]);
      if(id===secId) o.setAttribute('selected','selected');
      secSel.appendChild(o);
    });
    formCard.appendChild(el('label',{class:'fld', style:'margin-top:10px;'},[el('span',{class:'lab'},['Công đoạn *']), secSel]));
    secSel.addEventListener('change', ()=>{ captureDraft(); renderInputForm._newSection=secSel.value; renderInputForm(); });
    if(!secId){
      formCard.appendChild(el('p',{class:'sub', style:'margin:10px 0 0;'},['Chọn Công đoạn để tiếp tục.']));
      root.appendChild(formCard);
      root.appendChild(metaCard);
      return;
    }
  }

  // PO = SHUTDOWN không gắn với 1 sản phẩm/Item Code cụ thể nào (ca dừng
  // máy, không sản xuất) — biết trước giá trị PO (dù ô PO nằm SAU Item Code
  // trong form) để bỏ bắt buộc Item Code khi PO là SHUTDOWN. Với checkpoint
  // đang Sửa, PO đã biết ngay (editingCp.po); với checkpoint mới, PO là
  // state đã gõ trước đó (renderInputForm._newPO), nếu có.
  const poForItemCodeGate = (editingCp ? editingCp.po : (renderInputForm._newPO||'')).trim();
  const isShutdownEarly = /^shutdown$/i.test(poForItemCodeGate);
  // ---- Item Code (gõ tay 8 số HOẶC tìm/chọn từ danh sách có sẵn — Item
  // Code Master, giống hệt kiểu tìm PO) -> Item Name + Recipe (TỰ ĐỘNG, chỉ
  // đọc). KHÔNG bắt buộc khi PO là SHUTDOWN (không có sản phẩm để gắn Item
  // Code) — nếu vẫn gõ vào, vẫn được tra cứu/kiểm tra bình thường. ----
  const itemCodeVal0 = editingCp ? (editingCp.itemCode||'') : (renderInputForm._newItemCode||'');
  // commit() bên trong renderAutocomplete tự fire cả lúc blur LẪN lúc bấm
  // chọn 1 gợi ý — cùng đi qua captureDraft()+re-render, same safety net as
  // the fix for the "typing wiped on PO/Recipe/Client change" bug (see
  // HANDOFF.md). Tra cứu Item Name/Recipe cũng tự chạy lại ngay khi re-render
  // này xảy ra (xem `lookup` bên dưới) — không cần rerender riêng theo từng
  // ký tự gõ.
  const itemCodeAC = renderAutocomplete(itemCodeVal0, allKnownItemCodes(), 'VD: 11000011', (v)=>{
    captureDraft();
    if(editingCp) editingCp.itemCode = v.trim(); else renderInputForm._newItemCode = v.trim();
    renderInputForm();
  });
  formCard.appendChild(el('label',{class:'fld', style:'margin-top:10px;'},[el('span',{class:'lab'},[isShutdownEarly ? 'Item Code (không bắt buộc — PO là SHUTDOWN)' : 'Item Code *']), itemCodeAC.node]));

  const lookup = lookupItemByCode(itemCodeVal0);
  const readonlyStyle = 'background:#F1F5F9;color:var(--muted);cursor:not-allowed;';
  const itemNameDisp = el('input',{class:'inp', type:'text', readonly:'readonly', style:readonlyStyle, value: (lookup.status==='ok'||lookup.status==='missing_recipe') ? lookup.name : ''},[]);
  const recipeDisp = el('input',{class:'inp', type:'text', readonly:'readonly', style:readonlyStyle, value: lookup.status==='ok' ? lookup.recipe : ''},[]);
  formCard.appendChild(el('div',{class:'grid g2', style:'margin-top:10px;'},[
    el('label',{class:'fld'},[el('span',{class:'lab'},['Item Name (tự động)']), itemNameDisp]),
    el('label',{class:'fld'},[el('span',{class:'lab'},['Recipe (tự động)']), recipeDisp]),
  ]));
  if(itemCodeVal0){
    if(lookup.status==='not_found') formCard.appendChild(el('p',{class:'sub', style:'margin:6px 0 0;color:var(--fail);'},['⚠️ Không tìm thấy Item Code này trong Item Code Master (tab Danh sách Items Code).']));
    else if(lookup.status==='ambiguous') formCard.appendChild(el('p',{class:'sub', style:'margin:6px 0 0;color:var(--fail);'},['⚠️ Item Code này có nhiều bản ghi khác nhau (Tên/Recipe không khớp nhau) trong Item Code Master — cần làm sạch dữ liệu trước khi lưu.']));
    else if(lookup.status==='missing_recipe') formCard.appendChild(el('p',{class:'sub', style:'margin:6px 0 0;color:var(--fail);'},['⚠️ Item Code Master chưa có Recipe cho mã này.']));
  }

  // ---- PO ----
  let poAC;
  if(editingCp){
    poAC = renderAutocomplete(editingCp.po, allPOsEverUsed(), 'VD: 712600111 hoặc SHUTDOWN');
    formCard.appendChild(el('label',{class:'fld', style:'margin-top:10px;'},[el('span',{class:'lab'},['Mã PO *']), poAC.node]));
  } else {
    const poVal0 = renderInputForm._newPO || '';
    poAC = renderAutocomplete(poVal0, allKnownPOs(), 'VD: 712600111 hoặc SHUTDOWN', (v)=>{
      captureDraft();
      renderInputForm._newPO=v;
      // 1 PO = 1 Item Code: nếu PO này đã từng được lưu với 1 Item Code ở
      // checkpoint khác (bất kỳ Công đoạn nào), ưu tiên auto-fill đúng Item
      // Code đó — Item Name/Recipe sẽ tự cập nhật theo Item Code Master ở
      // lần render kế tiếp (logic tra cứu sẵn có, không đổi gì thêm). Bỏ qua
      // hẳn khi PO là SHUTDOWN — Item Code không bắt buộc/không có ý nghĩa
      // gắn với 1 lần dừng máy, không nên tự điền theo checkpoint SHUTDOWN
      // khác (nhiều checkpoint SHUTDOWN khác nhau không liên quan gì nhau).
      if(!/^shutdown$/i.test(v.trim())){
        const existingCode = findItemCodeForPO(v, null);
        if(existingCode && existingCode !== renderInputForm._newItemCode){
          renderInputForm._newItemCode = existingCode;
          toast(`PO này đã dùng Item Code ${existingCode} trước đó — đã tự điền.`);
        }
      }
      renderInputForm();
    });
    formCard.appendChild(el('label',{class:'fld', style:'margin-top:10px;'},[el('span',{class:'lab'},['Mã PO *']), poAC.node]));
    if(!poVal0){
      formCard.appendChild(el('p',{class:'sub', style:'margin:10px 0 0;'},['Nhập/chọn mã PO để tiếp tục nhập chỉ tiêu.']));
      root.appendChild(formCard);
      root.appendChild(metaCard);
      return;
    }
    // Chặn mở phần chỉ tiêu phía dưới ngay từ lúc gõ PO (không đợi tới lúc
    // bấm Lưu) nếu PO chưa đúng định dạng — cùng quy tắc với validate cứng
    // ở nút Lưu (SHUTDOWN hoặc đúng 9 chữ số), chỉ khác là cảnh báo SỚM hơn.
    const poNorm0 = /^shutdown$/i.test(poVal0.trim()) ? 'SHUTDOWN' : poVal0.trim();
    if(poNorm0!=='SHUTDOWN' && !/^\d{9}$/.test(poNorm0)){
      formCard.appendChild(el('p',{class:'sub', style:'margin:10px 0 0;color:var(--fail);'},['⚠️ Mã PO phải gồm đúng 9 chữ số, hoặc là SHUTDOWN — nhập đúng để tiếp tục nhập chỉ tiêu.']));
      root.appendChild(formCard);
      root.appendChild(metaCard);
      return;
    }
  }

  const poVal = poAC.getValue();
  const cp = editingCp || getOrInitCheckpoint(dateVal, shiftVal, secId, poVal);
  const sec = sectionById(secId);
  const prevCp = getPrevCheckpoint(secId, poVal, cp.key);
  const recipeAuto = lookup.status==='ok' ? lookup.recipe : '';
  const {issueId: legacyIssueId, actionId: legacyActionId} = findIssueActionFieldIds(sec);

  // Changing Process/PO/QC/Item Code re-renders this whole form (see the
  // change handlers above/below), and for a NEW checkpoint `cp` is a fresh
  // blank object every render (nothing persisted yet) — so without this,
  // any values already typed into the field inputs would be silently wiped
  // the moment the user touched one of those controls. `_draft` carries
  // those live values (kể cả các cặp Issue/Action) across such a re-render;
  // `draftScope` ties it to "this same section" (add flow) or "this same
  // checkpoint" (edit flow) so it can never leak into an unrelated form.
  const draftScope = editingCp ? ('edit:'+editingCp.key) : ('new:'+secId);
  if(renderInputForm._draft && renderInputForm._draft.scope===draftScope){
    Object.assign(cp.fields, renderInputForm._draft.fields);
    cp.fieldNotes = cp.fieldNotes || {};
    Object.assign(cp.fieldNotes, renderInputForm._draft.fieldNotes);
  }

  // ---- Client (tuỳ chọn — không nằm trong 11 yêu cầu mới nhưng vẫn là
  // tính năng hiện có, giữ nguyên không xoá) ----
  const clientVal0 = editingCp ? (cp.client||'') : (renderInputForm._newClient||'');
  const clientSel = el('select',{class:'inp'},[]);
  clientSel.appendChild(el('option',{value:''},['— Không chọn Client —']));
  CLIENT_LIST.forEach(c=>{ const o=el('option',{value:c.name},[c.name]); if(c.name===clientVal0) o.setAttribute('selected','selected'); clientSel.appendChild(o); });
  formCard.appendChild(el('label',{class:'fld', style:'margin-top:10px;'},[el('span',{class:'lab'},['Client (tuỳ chọn)']), clientSel]));
  clientSel.addEventListener('change', ()=>{
    captureDraft();
    if(editingCp) cp.client = clientSel.value; else renderInputForm._newClient = clientSel.value;
    renderInputForm();
  });
  const clientBannerSlot = el('div',{},[]);
  formCard.appendChild(clientBannerSlot);
  (function renderClientBanner(){
    const c = clientByName(clientVal0);
    if(c && (c.note || c.highlight)){
      const hl = CLIENT_HIGHLIGHTS.find(h=>h.value===c.highlight) || CLIENT_HIGHLIGHTS[0];
      const banner = el('div',{class:'card', style:`background:${hl.color!=='transparent'?hl.color:'#F8FAFC'};margin-top:10px;padding:10px 14px;`},[
        el('div',{style:'font-weight:700;font-size:12.5px;'},[c.name + (c.highlight?' — '+hl.label:'')]),
        c.note ? el('div',{style:'font-size:12px;margin-top:2px;'},[c.note]) : null,
      ]);
      clientBannerSlot.appendChild(banner);
    }
  })();

  // ---- Checkpoint: lưới chỉ tiêu (giữ nguyên logic cũ) — loại field
  // "<Section>_ISSUE"/"..._ACTION" ra khỏi lưới thường vì đã có UI riêng
  // (Issue/Abnormal + Action theo cặp, ngay dưới đây). ----
  const copiedFieldIds = new Set();
  const fieldEls = {};
  const noteEls = {};
  fieldsRendered = true;
  const inputFields = sec.fields.filter(f=>f.id!==legacyIssueId && f.id!==legacyActionId);
  const chunks = [];
  inputFields.forEach(f=>{
    const grp = groupOf(f);
    const last = chunks[chunks.length-1];
    if(last && last.group===grp) last.fields.push(f);
    else chunks.push({group:grp, fields:[f]});
  });
  chunks.forEach(chunk=>{
    const hasBool = chunk.fields.some(f=>f.type==='boolean');
    const hdrRow = el('div',{class:'grouphdr', style:'display:flex;align-items:center;gap:8px;'},[
      el('span',{style:'flex:1;'},[chunk.group]),
    ]);
    if(hasBool){
      const markBtn = el('button',{class:'btn ghost sm', type:'button', style:'padding:4px 10px;min-height:26px;font-size:11px;'},['✅ Đạt tất cả']);
      markBtn.addEventListener('click', ()=>{
        let n=0;
        chunk.fields.forEach(f=>{ if(f.type==='boolean' && fieldEls[f.id]){ fieldEls[f.id].setValue(true); n++; } });
        toast(`Đã đánh Đạt cho ${n} chỉ tiêu trong nhóm`);
      });
      hdrRow.appendChild(markBtn);
    }
    formCard.appendChild(hdrRow);
    const grid = el('div',{class:'fieldgrid'},[]);
    formCard.appendChild(grid);
    chunk.fields.forEach(f=>{
      const val = cp.fields[f.id];
      const prevVal = prevCp ? prevCp.fields[f.id] : undefined;
      const wrap = renderField(f, val, prevVal, (fid)=>copiedFieldIds.add(fid), recipeAuto);
      fieldEls[f.id] = wrap;
      if(f.type==='textarea') wrap.node.classList.add('full');
      if(f.allowNote && f.type!=='textarea'){
        const noteInp = el('input',{class:'inp', type:'text', placeholder:'Ghi chú bất thường (nếu có)'},[]);
        noteInp.value = (cp.fieldNotes && cp.fieldNotes[f.id]) || '';
        noteEls[f.id] = noteInp;
        grid.appendChild(el('div',{class:'fieldrow full'},[wrap.node, noteInp]));
      } else {
        grid.appendChild(wrap.node);
      }
    });
  });

  // ---- Issue/Abnormal + Action (theo cặp) ----
  let issuePairs = (renderInputForm._draft && renderInputForm._draft.scope===draftScope && renderInputForm._draft.issuePairs)
    ? renderInputForm._draft.issuePairs.map(p=>({issue:p.issue||'', action:p.action||''}))
    : getIssueActionPairs(cp, sec);
  if(issuePairs.length===0) issuePairs = [{issue:'', action:''}];

  formCard.appendChild(el('div',{class:'grouphdr'},['Issue / Abnormal & Action']));
  const issueRowsWrap = el('div',{},[]);
  formCard.appendChild(issueRowsWrap);
  const issueRowEls = [];
  function renderIssueRows(){
    issueRowsWrap.innerHTML = '';
    issueRowEls.length = 0;
    issuePairs.forEach((pair, idx)=>{
      const issueInp = el('textarea',{class:'inp', rows:'2', placeholder:'Issue/ Abnormal'},[]);
      issueInp.value = pair.issue||'';
      const actionInp = el('textarea',{class:'inp', rows:'2', placeholder:'Action'},[]);
      actionInp.value = pair.action||'';
      const rmBtn = el('button',{class:'btn ghost sm', type:'button'},['🗑️']);
      rmBtn.addEventListener('click', ()=>{
        captureDraft();
        renderInputForm._draft.issuePairs.splice(idx,1);
        renderInputForm();
      });
      const row = el('div',{class:'fieldrow full', style:'align-items:flex-start;'},[
        el('div',{style:'flex:1;min-width:0;'},[issueInp]),
        el('div',{style:'flex:1;min-width:0;'},[actionInp]),
        issuePairs.length>1 ? rmBtn : null,
      ]);
      issueRowsWrap.appendChild(row);
      issueRowEls.push({issueInp, actionInp});
    });
  }
  renderIssueRows();
  const addIssueBtn = el('button',{class:'btn ghost sm', type:'button', style:'margin-top:6px;'},['+ Thêm Issue/Action']);
  addIssueBtn.addEventListener('click', ()=>{
    captureDraft();
    renderInputForm._draft.issuePairs.push({issue:'', action:''});
    renderInputForm();
  });
  formCard.appendChild(addIssueBtn);
  formCard.appendChild(renderImageAttach(cp));

  const saveBtn = el('button',{class:'btn teal', style:'margin-top:14px;'},['💾 Lưu điểm kiểm tra']);
  saveBtn.addEventListener('click', async ()=>{
    // ---- Validate BẮT BUỘC — sai thì KHÔNG lưu, không hỏi "vẫn lưu?" ----
    if(!qcSel.value){ toast('Vui lòng chọn QC.'); return; }
    if(!secId){ toast('Vui lòng chọn Công đoạn.'); return; }
    const poRaw = poAC.getValue().trim();
    const poVal = /^shutdown$/i.test(poRaw) ? 'SHUTDOWN' : poRaw;
    if(!poVal){ toast('Vui lòng nhập mã PO.'); return; }
    // Định dạng PO (9 chữ số hoặc SHUTDOWN) chỉ bắt buộc khi TẠO MỚI — không
    // áp dụng lên checkpoint lịch sử đang Sửa, để không chặn sửa dữ liệu cũ
    // đã lưu trước khi quy tắc này tồn tại (yêu cầu nghiệp vụ rõ ràng).
    if(!editingCp && poVal!=='SHUTDOWN' && !/^\d{9}$/.test(poVal)){ toast('Mã PO phải gồm đúng 9 chữ số, hoặc là SHUTDOWN.'); return; }
    const itemCodeVal = itemCodeAC.getValue();
    // PO = SHUTDOWN: Item Code KHÔNG bắt buộc (không gắn với 1 sản phẩm cụ
    // thể nào — ca dừng máy, không sản xuất). Nếu để trống, bỏ qua hẳn bước
    // tra cứu/Recipe. Nếu người dùng vẫn gõ vào, vẫn kiểm tra đúng như bình
    // thường (không âm thầm chấp nhận 1 mã sai định dạng/không tồn tại).
    let lookupResult = {status:'not_found'};
    if(poVal!=='SHUTDOWN' || itemCodeVal){
      if(!/^\d{8}$/.test(itemCodeVal)){ toast('Item Code phải gồm đúng 8 chữ số.'); return; }
      lookupResult = lookupItemByCode(itemCodeVal);
      if(lookupResult.status==='not_found'){ toast('Item Code không tồn tại trong Item Code Master.'); return; }
      if(lookupResult.status==='ambiguous'){ toast('Item Code này có nhiều bản ghi khác nhau trong Item Code Master — cần làm sạch dữ liệu trước khi lưu.'); return; }
      if(lookupResult.status==='missing_recipe'){ toast('Item Code Master chưa có Recipe cho mã này.'); return; }
    }
    // 1 PO = 1 Item Code: chặn Lưu nếu PO này đã từng dùng 1 Item Code khác
    // ở 1 checkpoint khác (áp dụng cho cả thêm mới lẫn sửa). KHÔNG áp dụng
    // cho SHUTDOWN — đây không phải 1 PO sản xuất thật, nhiều checkpoint
    // SHUTDOWN khác nhau (khác ngày/ca) không liên quan gì tới nhau.
    if(poVal!=='SHUTDOWN'){
      const conflictItemCode = findItemCodeForPO(poVal, cp.key);
      if(conflictItemCode && conflictItemCode !== itemCodeVal){
        toast(`PO ${poVal} đã được lưu với Item Code ${conflictItemCode} trước đó — không thể dùng Item Code khác cho cùng PO.`);
        return;
      }
    }
    for(let i=0;i<issueRowEls.length;i++){
      const issueTxt = issueRowEls[i].issueInp.value.trim();
      const actionTxt = issueRowEls[i].actionInp.value.trim();
      if(issueTxt && !actionTxt){ toast(`Issue/Action dòng #${i+1}: cần nhập Action.`); return; }
      if(!issueTxt && actionTxt){ toast(`Issue/Action dòng #${i+1}: cần nhập Issue/Abnormal.`); return; }
    }

    const oldKey = cp.key;
    const newKeyCandidate = checkpointKey(dateVal, shiftVal, secId, poVal);
    if(editingCp && newKeyCandidate !== oldKey){
      const collision = allCheckpoints.find(r=>r.key===newKeyCandidate && r.key!==oldKey);
      if(collision){
        const okc = confirm(`Đã có 1 điểm kiểm tra khác dùng PO "${poVal}" cho ${sec.name} — Ca ${shiftVal} ngày ${fmtDateVN(dateVal)}. Lưu sẽ GHI ĐÈ dữ liệu đó. Tiếp tục?`);
        if(!okc) return;
      }
    }
    if(copiedFieldIds.size>0){
      const ok = confirm(`Bạn đã sao chép ${copiedFieldIds.size} giá trị từ lần kiểm tra trước (cùng PO ${poVal}, ${sec.name}). Xác nhận lưu?`);
      if(!ok) return;
    }
    const emptyRequired = inputFields.filter(f=> f.required && (v=>v===null||v===undefined||v==='')(fieldEls[f.id].getValue()));
    if(emptyRequired.length>0){
      const ok1 = confirm(`⚠️ BẮT BUỘC nhưng còn thiếu: ${emptyRequired.map(f=>f.label.split('\n')[0]).join(', ')}. Vẫn lưu?`);
      if(!ok1) return;
    }
    const emptyCount = inputFields.filter(f=>{
      const v = fieldEls[f.id].getValue();
      return v===null || v===undefined || v==='';
    }).length;
    if(emptyCount>0){
      const ok2 = confirm(`Còn ${emptyCount}/${inputFields.length} chỉ tiêu chưa nhập trong ${sec.name}. Vẫn lưu?`);
      if(!ok2) return;
    }
    const changes = [];
    cp.fieldNotes = cp.fieldNotes || {};
    for(const f of inputFields){
      const newVal = fieldEls[f.id].getValue();
      const oldVal = cp.fields[f.id];
      const oldNorm = oldVal===undefined?null:oldVal, newNorm = newVal===undefined?null:newVal;
      if(oldNorm !== newNorm){
        changes.push({fieldId:f.id, label:f.label.split('\n')[0], from:oldNorm, to:newNorm});
      }
      cp.fields[f.id] = newVal;
      if(noteEls[f.id]) cp.fieldNotes[f.id] = noteEls[f.id].value || '';
    }
    cp.fields[ISSUE_PAIRS_KEY] = issueRowEls.map(r=>({issue:r.issueInp.value.trim(), action:r.actionInp.value.trim()})).filter(p=>p.issue||p.action);
    syncIssueActionToLegacyFields(cp, sec);
    cp.technician = qcSel.value;
    cp.itemCode = itemCodeVal;
    cp.recipe = lookupResult.status==='ok' ? lookupResult.recipe : '';
    cp.client = clientSel.value;
    cp.date = dateVal; cp.shift = shiftVal; cp.section = secId; cp.po = poVal;
    cp.key = newKeyCandidate;
    cp.updatedAt = new Date().toISOString();
    await idbPut('shifts', cp);
    if(editingCp && newKeyCandidate !== oldKey){
      await idbDelete('shifts', oldKey);
      await queueCheckpointDelete(oldKey);
    }
    await refreshCache();
    await persistAll();
    if(changes.length>0){
      await logChange({ action: editingCp ? 'Sửa điểm kiểm tra' : 'Tạo điểm kiểm tra', date:dateVal, shift:shiftVal, po:poVal, section:sec.name, technician:cp.technician||'', changes });
    }
    toast(`Đã lưu điểm kiểm tra ${sec.name} — PO ${poVal}`);
    resetUiState();
    renderInputForm();
  });
  formCard.appendChild(saveBtn);
  root.appendChild(formCard);
  root.appendChild(metaCard);
}
// Ảnh (base64, ~150-400KB/ảnh sau nén) là phần nặng nhất của 1 checkpoint —
// và cả mảng ảnh phải re-upload nguyên khi có ảnh thay đổi (xem
// imagesFingerprint/stripLocalMarkers) — giới hạn để tránh 1 checkpoint bị
// gắn quá nhiều ảnh làm đồng bộ chậm/lỗi trên mạng Wi-Fi xưởng yếu.
const MAX_IMAGES_PER_CHECKPOINT = 8;
function compressImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      let w=img.width, h=img.height;
      if(w>maxDim || h>maxDim){
        if(w>h){ h = Math.round(h*maxDim/w); w=maxDim; } else { w = Math.round(w*maxDim/h); h=maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('image load failed')); };
    img.src = url;
  });
}
// Custom autocomplete (replaces native <datalist>, which has a long-standing
// unfixed Chromium bug and simply does not show suggestions on Android
// Chrome — confirmed on Chrome 8+ / still broken as of MDN's compatibility
// notes). Built purely with JS/DOM so it works reliably on every device.
function renderAutocomplete(value, options, placeholder, onChange){
  const wrap = el('div',{class:'ac-wrap'},[]);
  const inp = el('input',{class:'inp', type:'text', placeholder: placeholder||'', autocomplete:'off'},[]);
  inp.value = value||'';
  const list = el('div',{class:'ac-list'},[]);
  wrap.appendChild(inp);
  wrap.appendChild(list);
  function commit(){ if(onChange) onChange(inp.value.trim()); }
  function showSuggestions(){
    const q = inp.value.trim().toLowerCase();
    const matches = (q ? options.filter(o=>o.toLowerCase().includes(q)) : options).slice(0,8);
    list.innerHTML = '';
    if(matches.length===0){ list.style.display='none'; return; }
    matches.forEach(m=>{
      const item = el('div',{class:'ac-item'},[m]);
      const pick = (e)=>{ if(e && e.preventDefault) e.preventDefault(); inp.value=m; list.style.display='none'; commit(); };
      item.addEventListener('mousedown', pick);
      item.addEventListener('touchstart', pick);
      list.appendChild(item);
    });
    list.style.display = 'block';
  }
  inp.addEventListener('focus', showSuggestions);
  inp.addEventListener('input', showSuggestions);
  inp.addEventListener('blur', ()=>{ setTimeout(()=>{ list.style.display='none'; }, 150); commit(); });
  return { node: wrap, getValue: ()=> inp.value.trim(), setValue: v=>{ inp.value = v||''; } };
}
function renderImageAttach(cp){
  const wrap = el('div',{class:'imgattach full'},[]);
  const thumbRow = el('div',{class:'thumbrow'},[]);
  wrap.appendChild(thumbRow);
  function renderThumbs(){
    thumbRow.innerHTML='';
    const imgs = cp.images || [];
    imgs.forEach((im, idx)=>{
      const box = el('div',{class:'thumb'},[]);
      box.appendChild(el('img',{src: imgSrc(im)},[]));
      const rm = el('button',{class:'rm', type:'button'},['✕']);
      rm.addEventListener('click', async ()=>{
        cp.images.splice(idx,1);
        cp.updatedAt = new Date().toISOString();
        await idbPut('shifts', cp);
        await refreshCache();
        await persistAll();
        renderThumbs();
      });
      box.appendChild(rm);
      thumbRow.appendChild(box);
    });
  }
  renderThumbs();
  const attachInp = el('input',{type:'file', accept:'image/*', style:'display:none;'},[]);
  const cameraInp = el('input',{type:'file', accept:'image/*', capture:'environment', style:'display:none;'},[]);
  async function handleFiles(fileList){
    let skipped = 0;
    for(const file of Array.from(fileList)){
      cp.images = cp.images || [];
      // Mỗi ảnh thêm vào là nặng nhất trong dữ liệu 1 checkpoint, và TOÀN
      // BỘ mảng ảnh phải re-upload lại mỗi khi có thay đổi thật (xem
      // imagesFingerprint/stripLocalMarkers) — giới hạn để 1 checkpoint
      // không phình to tới mức đồng bộ chậm/lỗi trên mạng xưởng yếu.
      if(cp.images.length >= MAX_IMAGES_PER_CHECKPOINT){ skipped++; continue; }
      try{
        const dataUrl = await compressImageFile(file, 1280, 0.72);
        const ts = Date.now();
        cp.images.push({name:file.name, dataUrl, ts});
        cp.updatedAt = new Date().toISOString();
        await idbPut('shifts', cp);
        await refreshCache();
        await persistAll();
      }catch(e){ console.error(e); toast('Không đọc được ảnh'); }
    }
    renderThumbs();
    if(skipped>0) toast(`Đã đính kèm ảnh — bỏ qua ${skipped} ảnh vì đã đạt tối đa ${MAX_IMAGES_PER_CHECKPOINT} ảnh/điểm kiểm tra`);
    else toast('Đã đính kèm ảnh bất thường');
  }
  attachInp.addEventListener('change', e=>{ if(e.target.files.length) handleFiles(e.target.files); e.target.value=''; });
  cameraInp.addEventListener('change', e=>{ if(e.target.files.length) handleFiles(e.target.files); e.target.value=''; });
  const pasteZone = el('div',{class:'pastezone', tabindex:'0', contenteditable:'true'},['📋 Dán ảnh vào đây (Ctrl+V)']);
  pasteZone.addEventListener('paste', (e)=>{
    e.preventDefault();
    const items = (e.clipboardData && e.clipboardData.items) || [];
    const files = [];
    for(let i=0;i<items.length;i++){
      if(items[i].type && items[i].type.indexOf('image/')===0){
        const f = items[i].getAsFile();
        if(f) files.push(f);
      }
    }
    pasteZone.textContent = '📋 Dán ảnh vào đây (Ctrl+V)';
    if(files.length) handleFiles(files);
    else toast('Không tìm thấy ảnh trong clipboard');
  });
  wrap.appendChild(pasteZone);
  const btnRow = el('div',{class:'row', style:'margin-top:6px;'},[
    el('button',{class:'btn ghost sm', type:'button'},['📎 Đính kèm ảnh']),
    el('button',{class:'btn ghost sm', type:'button'},['📷 Chụp ảnh']),
  ]);
  const [attachBtn, cameraBtn] = qsa('button', btnRow);
  attachBtn.addEventListener('click', ()=>attachInp.click());
  cameraBtn.addEventListener('click', ()=>cameraInp.click());
  wrap.appendChild(btnRow);
  wrap.appendChild(attachInp);
  wrap.appendChild(cameraInp);
  return wrap;
}
/* ===================== ISSUE / ACTION (paired rows) =====================
   Input Form (tab Nhập liệu) nhập Issue/Abnormal + Action theo CẶP, nhiều
   dòng — lưu ở cp.fields[ISSUE_PAIRS_KEY] (mảng {issue,action}), NẰM TRONG
   `fields` (jsonb) đã có sẵn nên đi qua IndexedDB + đồng bộ máy chủ KHÔNG cần
   đổi schema.sql/cột mới nào (một field top-level mới trên checkpoint, như
   cp.issues, sẽ KHÔNG được đồng bộ — sync_get/put_checkpoints chỉ đọc đúng
   các cột đã khai báo). Để KHÔNG phá vỡ mọi hàm xuất báo cáo/Excel/QMS/Data
   Log đã có từ trước (đọc field id kết thúc "_ISSUE", và tuỳ chọn "_ACTION"
   — xem buildProcessQmsExcelXml), lúc lưu sẽ tự ghép các cặp lại và ghi
   NGƯỢC vào đúng 2 field đó (syncIssueActionToLegacyFields) — mọi nơi khác
   trong app tiếp tục đọc y như cũ, không cần sửa gì thêm. Checkpoint lịch sử
   (trước khi có tính năng này) không có ISSUE_PAIRS_KEY — getIssueActionPairs()
   tự đọc lại đúng 1 cặp từ 2 field cũ đó làm dữ liệu ban đầu. */
const ISSUE_PAIRS_KEY = '__issueActionPairs__';
function findIssueActionFieldIds(sec){
  const issueField = sec.fields.find(f=>/_ISSUE$/i.test(f.id));
  const actionField = sec.fields.find(f=>/_ACTION$/i.test(f.id) || /^action$/i.test((f.label||'').split('\n')[0].trim()));
  return { issueId: issueField?issueField.id:null, actionId: actionField?actionField.id:null };
}
function getIssueActionPairs(cp, sec){
  const stored = cp.fields && cp.fields[ISSUE_PAIRS_KEY];
  if(Array.isArray(stored)) return stored.map(p=>({issue:p.issue||'', action:p.action||''}));
  const {issueId, actionId} = findIssueActionFieldIds(sec);
  const issueTxt = issueId ? String(cp.fields[issueId]||'').trim() : '';
  const actionTxt = actionId ? String(cp.fields[actionId]||'').trim() : '';
  if(!issueTxt && !actionTxt) return [];
  return [{issue:issueTxt, action:actionTxt}];
}
function syncIssueActionToLegacyFields(cp, sec){
  const pairs = (cp.fields[ISSUE_PAIRS_KEY]||[]).filter(p=>(p.issue||'').trim() || (p.action||'').trim());
  const {issueId, actionId} = findIssueActionFieldIds(sec);
  const issueTxt = pairs.map((p,i)=> pairs.length>1 ? `${i+1}. ${(p.issue||'').trim()}` : (p.issue||'').trim()).join('\n');
  const actionTxt = pairs.map((p,i)=> pairs.length>1 ? `${i+1}. ${(p.action||'').trim()}` : (p.action||'').trim()).join('\n');
  if(issueId) cp.fields[issueId] = issueTxt;
  if(actionId) cp.fields[actionId] = actionTxt;
}

function groupOf(f){
  if(f.id.endsWith('_RECIPE')) return 'Recipe';
  if(f.id.includes('_CLEAN_')) return 'Vệ sinh (Cleaning)';
  if(f.id.endsWith('_ISSUE')) return 'Ghi chú bất thường';
  if(f.id==='INFO_ISSUE' || f.id==='HANDOVER') return 'Bàn giao ca';
  return 'Chỉ tiêu kiểm tra';
}

function formatPrevDisplay(f, v){
  if(f.type==='boolean') return v===true?'Đạt':v===false?'Lỗi':'—';
  if(f.type==='textarea'){ const s=String(v); return s.length>36 ? s.slice(0,36)+'…' : s; }
  return String(v);
}
function prevHintRow(f, prevVal, applyFn, onCopied){
  if(prevVal===undefined || prevVal===null || prevVal==='') return null;
  const row = el('div',{class:'prevhint'},[
    el('span',{},[`Ca trước: ${formatPrevDisplay(f, prevVal)}`]),
    el('button',{class:'usebtn'},['↺ Dùng']),
  ]);
  qsa('button', row)[0].addEventListener('click', ()=>{ applyFn(prevVal); onCopied(f.id); });

}
function renderField(f, val, prevVal, onCopied, recipeVal){
  onCopied = onCopied || function(){};
  const labText = f.label.split('\n')[0] + (f.required ? ' *' : '');
  if(f.type==='boolean'){
    let state = val===true ? 'pass' : (val===false ? 'fail' : 'unset');
    const label = el('div',{class:'txt'},[labText, f.label.includes('\n')?el('span',{class:'spec'},[f.label.split('\n').slice(1).join(' / ')]):null]);
    const btn = el('button',{class:'st-'+state},[boolDisp(f, state==='pass'?true:state==='fail'?false:null)]);
    const boolBox = el('div',{class:'boolfld'},[label, btn]);
    function setState(newState){
      state = newState;
      btn.className = 'st-'+state;
      btn.textContent = boolDisp(f, state==='pass'?true:state==='fail'?false:null);
    }
    btn.addEventListener('click', ()=>{
      setState(state==='unset' ? 'pass' : state==='pass' ? 'fail' : 'unset');
    });
    const outer = el('div',{},[boolBox]);
    const hint = prevHintRow(f, prevVal, v=>setState(v===true?'pass':v===false?'fail':'unset'), onCopied);
    if(hint) outer.appendChild(hint);
    return { node: outer, getValue: ()=> state==='unset' ? null : state==='pass', setValue: v=>setState(v===true?'pass':v===false?'fail':'unset') };
  }
  if(f.type==='select'){
    const s = el('select',{class:'inp'},[]);
    s.appendChild(el('option',{value:''},['— Chọn —']));
    (f.options||[]).forEach(o=>{ const opt=el('option',{value:o},[o]); if(val===o) opt.setAttribute('selected','selected'); s.appendChild(opt); });
    const outer = el('label',{class:'fld'},[el('span',{class:'lab'},[labText]), s]);
    const hint = prevHintRow(f, prevVal, v=>{ s.value = v; }, onCopied);
    if(hint) outer.appendChild(hint);
    return { node: outer, getValue: ()=> s.value || null, setValue: v=>{ s.value = v==null?'':v; } };
  }
  if(f.type==='textarea'){
    const t = el('textarea',{class:'inp', rows:'3', placeholder:'Nhập ghi chú...'},[]);
    t.value = val||'';
    const outer = el('label',{class:'fld'},[el('span',{class:'lab'},[labText]), t]);
    const hint = prevHintRow(f, prevVal, v=>{ t.value = v; }, onCopied);
    if(hint) outer.appendChild(hint);
    return { node: outer, getValue: ()=> t.value || '', setValue: v=>{ t.value = v||''; } };
  }
  if(f.type==='number'){
    const i = el('input',{class:'inp num', type:'text', inputmode:'decimal', placeholder:'—'},[]);
    i.value = val==null ? '' : val;
    let numRow;
    if(f.allowNegative){
      const toggleBtn = el('button',{class:'signtoggle', type:'button', title:'Đổi dấu âm / dương'},['±']);
      toggleBtn.addEventListener('click', ()=>{
        let v = i.value.trim();
        if(v.startsWith('-')) v = v.slice(1);
        else v = '-' + v;
        i.value = v;
        i.focus();
      });
      numRow = el('div',{class:'numrow'},[i, toggleBtn]);
    } else {
      numRow = i;
    }
    const spec = specText(f, recipeVal);
    const outer = el('label',{class:'fld'},[
      el('span',{class:'lab'},[labText]), numRow,
      spec ? el('span',{class:'spec'},[spec]) : null
    ]);
    const hint = prevHintRow(f, prevVal, v=>{ i.value = v; }, onCopied);
    if(hint) outer.appendChild(hint);
    return { node: outer, getValue: ()=> toNum(i.value), setValue: v=>{ i.value = v==null?'':v; } };
  }
  // text (PO / free text)
  const i = el('input',{class:'inp', type:'text'},[]);
  i.value = val||'';
  const outer = el('label',{class:'fld'},[el('span',{class:'lab'},[labText]), i]);
  const hint = prevHintRow(f, prevVal, v=>{ i.value = v; }, onCopied);
  if(hint) outer.appendChild(hint);
  return { node: outer, getValue: ()=> i.value || '', setValue: v=>{ i.value = v||''; } };
}
