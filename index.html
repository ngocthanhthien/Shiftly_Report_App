function buildSimpleListExcelXml(sheetName, colName, values){
  let xml = `<?xml version="1.0"?>\n<?mso-application progid="Excel.Sheet"?>\n`;
  xml += `<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">\n`;
  xml += `<Styles><Style ss:ID="hdr"><Font ss:Bold="1"/><Interior ss:Color="#EEF1F6" ss:Pattern="Solid"/></Style></Styles>\n`;
  xml += `<Worksheet ss:Name="${xmlEscape(sheetName)}"><Table>\n`;
  xml += `<Row><Cell ss:StyleID="hdr"><Data ss:Type="String">${xmlEscape(colName)}</Data></Cell></Row>\n`;
  values.forEach(v=>{ xml += `<Row><Cell><Data ss:Type="String">${xmlEscape(v)}</Data></Cell></Row>\n`; });
  xml += `</Table></Worksheet></Workbook>`;
  return xml;
}
function parseSimpleListExcelXml(text){
  try{
    const doc = new DOMParser().parseFromString(text, 'text/xml');
    if(doc.getElementsByTagName('parsererror').length) return null;
    const rowEls = Array.from(doc.getElementsByTagName('Row'));
    if(rowEls.length<1) return null;
    const values = [];
    rowEls.slice(1).forEach(rowEl=>{ // skip header row
      const dataEl = rowEl.getElementsByTagName('Data')[0];
      const v = dataEl ? (dataEl.textContent||'').trim() : '';
      if(v) values.push(v);
    });
    return values;
  }catch(e){ console.error(e); return null; }
}
function buildTableExcelXml(sheetName, headers, rows){
  let xml = `<?xml version="1.0"?>\n<?mso-application progid="Excel.Sheet"?>\n`;
  xml += `<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">\n`;
  xml += `<Styles><Style ss:ID="hdr"><Font ss:Bold="1"/><Interior ss:Color="#EEF1F6" ss:Pattern="Solid"/></Style></Styles>\n`;
  xml += `<Worksheet ss:Name="${xmlEscape(sheetName)}"><Table>\n`;
  xml += '<Row>' + headers.map(h=>`<Cell ss:StyleID="hdr"><Data ss:Type="String">${xmlEscape(h)}</Data></Cell>`).join('') + '</Row>\n';
  rows.forEach(row=>{
    xml += '<Row>' + row.map(v=>`<Cell><Data ss:Type="String">${xmlEscape(v||'')}</Data></Cell>`).join('') + '</Row>\n';
  });
  xml += `</Table></Worksheet></Workbook>`;
  return xml;
}
function parseTableExcelXml(text){
  try{
    const doc = new DOMParser().parseFromString(text, 'text/xml');
    if(doc.getElementsByTagName('parsererror').length) return null;
    const rowEls = Array.from(doc.getElementsByTagName('Row'));
    if(rowEls.length<1) return null;
    return rowEls.map(rowEl=>{
      const cellEls = Array.from(rowEl.getElementsByTagName('Cell'));
      return cellEls.map(cellEl=>{
        const dataEl = cellEl.getElementsByTagName('Data')[0];
        return dataEl ? (dataEl.textContent||'').trim() : '';
      });
    });
  }catch(e){ console.error(e); return null; }
}
/* ===================== EDITABLE LIST TABLE (shared UI) =====================
   Spreadsheet-style table shared by tabs Danh sách PO/Recipe/Client/Items
   Code: sortable column headers, a filter row (text and/or multi-select
   per column), a pinned "add new" row, and cells editable directly in
   place — replaces the old "form above + list below" UI for these tabs.

   opts = {
     columns: [{
       key, label,
       sortable, sortVal(row) -> optional, defaults to get(row),
       filter: null | 'text' | {type:'multi', options:[{value,label}]},
       filterVal(row) -> optional, defaults to get(row),
       get(row) -> current value,
       set(row, val) -> async; return false to reject/revert the edit
         (e.g. failed validation). Omit for a read-only column.
       type: 'text' | 'select' | (row)=>'text'|'select'|null — which
         editable widget to render; a function lets a column be editable
         only on some rows (e.g. a PO not yet declared in PO_LIST). The
         add-row calls type(null).
       options: [{value,label}] — for type 'select',
       render(row) -> optional custom read-only cell content (Node|string),
       addPlaceholder: placeholder for this column's add-row input,
     }],
     rows: [...] — row view-objects (kept by reference so edits persist
       without a full rebuild),
     rowStyle(row) -> optional CSS string applied to that <tr>,
     state: {filters:{}, sort:{key:null,dir:null}} — owned by the caller
       (kept as a static prop on the render fn, like the existing
       _search/_editIdx convention) so it survives re-render,
     onAdd(values) -> async, values keyed by column.key from the add-row;
       return false to keep the add-row filled in (validation failed) —
       the caller is responsible for a full re-render on success,
     renderActions(row) -> [...elements] for a trailing actions <td>, or
       falsy to render nothing there for that row,
     emptyText: shown when the filtered list is empty.
   } */
function multiSelectFilterEl(label, options, selectedSet, onChange){
  const details = el('details',{class:'msf'});
  const labelFor = ()=> label + (selectedSet.size ? ` (${selectedSet.size})` : '');
  const summary = el('summary',{},[labelFor()]);
  details.appendChild(summary);
  const menu = el('div',{class:'msf-menu'});
  options.forEach(opt=>{
    const cb = el('input',{type:'checkbox'});
    cb.checked = selectedSet.has(opt.value);
    cb.addEventListener('change', ()=>{
      if(cb.checked) selectedSet.add(opt.value); else selectedSet.delete(opt.value);
      summary.textContent = labelFor();
      onChange();
    });
    menu.appendChild(el('label',{class:'msf-opt'},[cb, el('span',{},[opt.label])]));
  });
  details.appendChild(menu);
  return details;
}
function buildEditableTable(opts){
  const {columns, rows, onAdd, renderActions, emptyText, rowStyle, state, tableClass, selectable, rowKey, onBulkDelete, bulkDeleteLabel} = opts;
  state.filters = state.filters || {};
  state.sort = state.sort || {key:null, dir:null};
  if(selectable && !(state.selected instanceof Set)) state.selected = new Set();
  const actionsCol = !!renderActions;
  const resolveType = (col, row) => typeof col.type==='function' ? col.type(row) : col.type;

  const wrap = el('div',{class:'card', style:'padding:0;overflow:hidden;'});
  const selBar = selectable ? el('div',{class:'seltoolbar', style:'display:none;'}) : null;
  if(selBar) wrap.appendChild(selBar);
  const scroll = el('div',{class:'tablescroll'});
  const table = el('table',{class:'datatable edittable'+(tableClass?' '+tableClass:'')});
  const theadHdr = el('tr',{});
  const theadFilter = el('tr',{class:'filterrow'});
  let selectAllCb = null;
  if(selectable){
    selectAllCb = el('input',{type:'checkbox', title:'Chọn tất cả (đang lọc)'});
    selectAllCb.addEventListener('change', ()=>{
      const list = sortedFiltered();
      if(selectAllCb.checked) list.forEach(r=>state.selected.add(rowKey(r)));
      else list.forEach(r=>state.selected.delete(rowKey(r)));
      renderBody();
    });
    theadHdr.appendChild(el('th',{style:'width:34px;'},[selectAllCb]));
    theadFilter.appendChild(el('th',{}));
  }
  columns.forEach(col=>{
    const th = el('th',{},[col.label]);
    if(col.sortable){
      th.classList.add('sortable');
      const arrow = el('span',{class:'sortarrow'},['⇅']);
      th.appendChild(arrow);
      col._refreshSortUi = ()=>{
        const active = state.sort.key===col.key;
        th.classList.toggle('sorted', active);
        arrow.textContent = active ? (state.sort.dir==='asc'?'▲':'▼') : '⇅';
      };
      col._refreshSortUi();
      th.addEventListener('click', ()=>{
        if(state.sort.key!==col.key) state.sort = {key:col.key, dir:'asc'};
        else if(state.sort.dir==='asc') state.sort.dir = 'desc';
        else state.sort = {key:null, dir:null};
        renderBody();
      });
    }
    theadHdr.appendChild(th);
    const fth = el('th',{});
    if(col.filter==='text'){
      const inp = el('input',{class:'cellinput', type:'text', placeholder:'Lọc...'});
      inp.value = state.filters[col.key]||'';
      inp.addEventListener('input', ()=>{ state.filters[col.key]=inp.value; renderBody(); });
      fth.appendChild(inp);
    } else if(col.filter && col.filter.type==='multi'){
      if(!(state.filters[col.key] instanceof Set)) state.filters[col.key] = new Set();
      fth.appendChild(multiSelectFilterEl('Lọc', col.filter.options, state.filters[col.key], renderBody));
    }
    theadFilter.appendChild(fth);
  });
  if(actionsCol){ theadHdr.appendChild(el('th',{},[''])); theadFilter.appendChild(el('th',{})); }
  table.appendChild(el('thead',{},[theadHdr, theadFilter]));
  const tbody = el('tbody',{});
  table.appendChild(tbody);
  scroll.appendChild(table); wrap.appendChild(scroll);

  function passesFilters(row){
    return columns.every(col=>{
      if(!col.filter) return true;
      if(col.filter==='text'){
        const q = (state.filters[col.key]||'').trim().toLowerCase();
        if(!q) return true;
        const v = String((col.filterVal?col.filterVal(row):col.get(row)) ?? '').toLowerCase();
        return v.includes(q);
      }
      if(col.filter.type==='multi'){
        const sel = state.filters[col.key];
        if(!sel || sel.size===0) return true;
        return sel.has(col.filterVal?col.filterVal(row):col.get(row));
      }
      return true;
    });
  }
  function sortedFiltered(){
    let list = rows.filter(passesFilters);
    const {key,dir} = state.sort;
    if(key){
      const col = columns.find(c=>c.key===key);
      list = list.slice().sort((a,b)=>{
        const va = col.sortVal ? col.sortVal(a) : col.get(a);
        const vb = col.sortVal ? col.sortVal(b) : col.get(b);
        let cmp;
        if(typeof va==='number' || typeof vb==='number') cmp = (Number(va)||0)-(Number(vb)||0);
        else cmp = String(va??'').localeCompare(String(vb??''), 'vi');
        return dir==='desc' ? -cmp : cmp;
      });
    }
    return list;
  }
  function editableCell(col, row){
    const type = resolveType(col, row);
    if(type==='select'){
      const sel = el('select',{class:'cellinput'});
      (col.options||[]).forEach(o=>{ const op=el('option',{value:o.value},[o.label]); if(col.get(row)===o.value) op.setAttribute('selected','selected'); sel.appendChild(op); });
      sel.addEventListener('change', async ()=>{
        const prev = col.get(row);
        const ok = await col.set(row, sel.value);
        if(ok===false) sel.value = prev;
      });
      return el('td',{},[sel]);
    }
    if(type==='text' || type==='textarea'){
      const inp = type==='textarea' ? el('textarea',{class:'cellinput', rows: col.rows||'2'}) : el('input',{class:'cellinput', type:'text'});
      inp.value = col.get(row) ?? '';
      const commit = async ()=>{
        const v = type==='textarea' ? inp.value : inp.value.trim();
        const prev = String(col.get(row) ?? '');
        if(v===prev) return;
        const ok = await col.set(row, v);
        if(ok===false) inp.value = prev;
      };
      inp.addEventListener('blur', commit);
      if(type==='text') inp.addEventListener('keydown', e=>{ if(e.key==='Enter') inp.blur(); });
      return el('td',{},[inp]);
    }
    if(type==='checkbox'){
      const cb = el('input',{type:'checkbox'});
      cb.checked = !!col.get(row);
      cb.addEventListener('change', async ()=>{
        const prev = !!col.get(row);
        const ok = await col.set(row, cb.checked);
        if(ok===false) cb.checked = prev;
      });
      return el('td',{style:'text-align:center;'},[cb]);
    }
    const content = col.render ? col.render(row) : String(col.get ? (col.get(row) ?? '—') : '—');
    return el('td',{},[content]);
  }
  function renderBody(){
    columns.forEach(col=>{ if(col._refreshSortUi) col._refreshSortUi(); });
    tbody.innerHTML = '';
    if(onAdd){
      const addTr = el('tr',{class:'addrow'});
      if(selectable) addTr.appendChild(el('td',{}));
      const inputs = {};
      columns.forEach(col=>{
        const td = el('td',{});
        const type = resolveType(col, null);
        if(type==='select'){
          const sel = el('select',{class:'cellinput'});
          (col.options||[]).forEach(o=>sel.appendChild(el('option',{value:o.value},[o.label])));
          inputs[col.key]=sel; td.appendChild(sel);
        } else if(type==='text' || type==='textarea'){
          const inp = type==='textarea' ? el('textarea',{class:'cellinput', rows: col.rows||'2', placeholder: col.addPlaceholder||''}) : el('input',{class:'cellinput', type:'text', placeholder: col.addPlaceholder||''});
          if(type==='text') inp.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
          inputs[col.key]=inp; td.appendChild(inp);
        } else if(type==='checkbox'){
          const cb = el('input',{type:'checkbox'});
          inputs[col.key]=cb; td.appendChild(cb);
        }
        addTr.appendChild(td);
      });
      const actTd = el('td',{class:'actions'});
      const addBtn = el('button',{class:'rowbtn add'},['➕ Thêm']);
      actTd.appendChild(addBtn);
      addTr.appendChild(actTd);
      async function submit(){
        const values = {};
        Object.keys(inputs).forEach(k=>{ values[k]= (inputs[k].type==='checkbox') ? inputs[k].checked : inputs[k].value; });
        await onAdd(values);
      }
      addBtn.addEventListener('click', submit);
      tbody.appendChild(addTr);
    }
    const list = sortedFiltered();
    if(list.length===0){
      const tr = el('tr',{});
      const td = el('td',{colspan:String(columns.length + (actionsCol?1:0) + (selectable?1:0)), style:'text-align:center;color:var(--muted);padding:18px;white-space:normal;'},[emptyText||'Không có dữ liệu.']);
      tr.appendChild(td); tbody.appendChild(tr);
    } else {
      list.forEach(row=>{
        const tr = el('tr',{});
        if(rowStyle){ const s = rowStyle(row); if(s) tr.setAttribute('style', s); }
        if(selectable){
          const key = rowKey(row);
          const cb = el('input',{type:'checkbox'});
          cb.checked = state.selected.has(key);
          cb.addEventListener('change', ()=>{
            if(cb.checked) state.selected.add(key); else state.selected.delete(key);
            renderBody();
          });
          tr.appendChild(el('td',{style:'text-align:center;'},[cb]));
        }
        columns.forEach(col=> tr.appendChild(editableCell(col, row)));
        if(actionsCol){
          const actTd = el('td',{class:'actions'});
          const rowDiv = el('div',{class:'row'});
          (renderActions(row)||[]).forEach(b=>rowDiv.appendChild(b));
          actTd.appendChild(rowDiv);
          tr.appendChild(actTd);
        }
        tbody.appendChild(tr);
      });
    }
    if(selectable){
      const selCount = state.selected.size;
      selectAllCb.checked = list.length>0 && list.every(r=>state.selected.has(rowKey(r)));
      selectAllCb.indeterminate = !selectAllCb.checked && list.some(r=>state.selected.has(rowKey(r)));
      selBar.innerHTML = '';
      if(selCount>0){
        selBar.style.display = 'flex';
        selBar.appendChild(el('span',{},[`Đã chọn ${selCount} dòng`]));
        const delBtn = el('button',{class:'btn danger sm', type:'button', style:'width:auto;margin-left:auto;'},[bulkDeleteLabel || `🗑️ Xoá ${selCount} mục đã chọn`]);
        delBtn.addEventListener('click', async ()=>{
          const selectedRows = rows.filter(r=>state.selected.has(rowKey(r)));
          if(selectedRows.length===0) return;
          const ok = await onBulkDelete(selectedRows);
          if(ok!==false){ state.selected.clear(); renderBody(); }
        });
        selBar.appendChild(delBtn);
      } else {
        selBar.style.display = 'none';
      }
    }
  }
  renderBody();
  return wrap;
}

/* ===================== DANH SÁCH PO TAB ===================== */
function poTableRows(){
  const allPOs = new Set(PO_LIST);
  allCheckpoints.forEach(r=>{ if(r.po) allPOs.add(r.po); });
  return [...allPOs].sort().map(po=>{
    const idx = PO_LIST.indexOf(po);
    const matches = allCheckpoints.filter(r=>r.po===po);
    const avgFill = matches.length ? Math.round(matches.reduce((a,r)=>a+fillRate(r).pct,0)/matches.length) : 0;
    const sectionsTouched = [...new Set(matches.map(r=>r.section))].map(sid=>{ const s = sectionById(sid); return s ? s.name : sid; });
    const techs = [...new Set(matches.map(r=>r.technician).filter(Boolean))];
    const dates = matches.map(r=>r.date).sort();
    return {po, idx, closed: isPOClosed(po), matches, avgFill, sectionsTouched, techs, dates};
  });
}

    const xml = buildSimpleListExcelXml('PO Template', 'PO', ['VD: 712600007', 'VD: 712600008']);
    downloadBlob(new Blob([xml],{type:'application/vnd.ms-excel'}), 'Shiftly_PO_Template.xls');
  });
  qs('#btnPoExportXls', xlsCard).addEventListener('click', ()=>{
    const xml = buildSimpleListExcelXml('Danh sách PO', 'PO', PO_LIST);
    downloadBlob(new Blob([xml],{type:'application/vnd.ms-excel'}), `Shiftly_PO_List_${todayStr()}.xls`);

  qs('#poXlsInput', xlsCard).addEventListener('change', async e=>{
    const file = e.target.files[0]; if(!file) return;
    const text = await file.text();
    const values = parseSimpleListExcelXml(text);
    if(values===null){ toast('Không đọc được file Excel này'); return; }
    const cleaned = values.filter(v=>!/^VD:/i.test(v));
    const merged = [...new Set([...PO_LIST, ...cleaned])];
    PO_LIST = merged;

    toast(`Đã nhập ${cleaned.length} mã PO từ Excel`);

  renderPOList._table = renderPOList._table || {filters:{}, sort:{key:null,dir:null}};

    state: renderPOList._table,

    emptyText: 'Chưa có PO nào — thêm ở dòng trên cùng hoặc bắt đầu nhập liệu.',
    columns: [
      {
        key:'po', label:'Mã PO', sortable:true, filter:'text',
        get: row=>row.po,
        type: row => (!row || row.idx!==-1) ? 'text' : null,
        addPlaceholder:'VD: 712600007',
        render: row => el('span',{},[row.po+' ', el('span',{class:'typetag', style:'background:#F1F5F9;color:var(--muted);'},['từ dữ liệu'])]),
        set: async (row, val) => {
          if(!val) return false;
          const dupIdx = PO_LIST.findIndex((p,i)=>p===val && i!==row.idx);
          if(dupIdx!==-1){ toast('Mã PO này đã có trong danh sách'); return false; }
          PO_LIST[row.idx] = val; row.po = val;
          await savePOList();
        },
      },
      {
        key:'status', label:'Trạng thái', sortable:true,
        filter:{type:'multi', options:[{value:'open',label:'🟢 Đang mở'},{value:'closed',label:'🔒 Đã đóng'}]},
        filterVal: row => row.closed ? 'closed' : 'open',
        sortVal: row => row.closed ? 1 : 0,
        type:'select', options:[{value:'open',label:'🟢 Đang mở'},{value:'closed',label:'🔒 Đã đóng'}],
        get: row => row.closed ? 'closed' : 'open',

          const wantClosed = val==='closed';
          if(wantClosed===row.closed) return;
          if(wantClosed){
            if(row.avgFill<100 && !confirm(`PO ${row.po} còn ${100-row.avgFill}% dữ liệu chưa điền đầy đủ. Vẫn xác thực đóng?`)) return false;
            await setPOClosed(row.po, true);
            toast(`Đã xác thực đóng PO ${row.po}`);

            if(!confirm(`Mở lại PO ${row.po} để tiếp tục chỉnh sửa?`)) return false;

            toast(`Đã mở lại PO ${row.po}`);
          }
          row.closed = wantClosed;
        },
      },
      { key:'count', label:'Số điểm kiểm tra', sortable:true, sortVal:row=>row.matches.length, render:row=>String(row.matches.length) },
      { key:'avgFill', label:'Mức điền TB', sortable:true, sortVal:row=>row.avgFill, render:row=>`${row.avgFill}%` },
      { key:'sections', label:'Công đoạn đã có dữ liệu', filter:'text', filterVal:row=>row.sectionsTouched.join(', '), render:row=>row.sectionsTouched.join(', ')||'—' },
      { key:'techs', label:'QC tham gia', filter:'text', filterVal:row=>row.techs.join(', '), render:row=>row.techs.join(', ')||'—' },
      { key:'dates', label:'Khoảng ngày', sortable:true, sortVal:row=>row.dates[0]||'', render:row=> row.dates.length ? `${fmtDateVN(row.dates[0])} → ${fmtDateVN(row.dates[row.dates.length-1])}` : '—' },
    ],
    onAdd: async (values) => {
      const po = (values.po||'').trim();
      if(!po){ toast('Cần nhập mã PO'); return false; }
      if(PO_LIST.includes(po)){ toast('Mã PO này đã có trong danh sách'); return false; }
      PO_LIST.push(po);
      await savePOList();
      toast('Đã thêm PO');
      renderPOList();
    },
    renderActions: row => {
      const btns = [];
      if(row.matches.length){
        const viewBtn = el('button',{class:'rowbtn'},['👁 Xem']);
        viewBtn.addEventListener('click', ()=>{ renderTable._filter = {po: row.po, shift:'', from:'', to:''}; renderTable._mode = 'list'; showTab('table'); });
        btns.push(viewBtn);
      }
      if(row.idx!==-1){
        const delBtn = el('button',{class:'rowbtn del'},['🗑️']);
        delBtn.addEventListener('click', async ()=>{
          if(confirm(`Xoá mã PO "${row.po}" khỏi danh sách? (Các điểm kiểm tra đã dùng mã này không bị xoá.)`)){
            PO_LIST.splice(row.idx,1);
            await savePOList();
            renderPOList();
          }
        });
        btns.push(delBtn);
      }
      return btns;
    },
  });
  root.appendChild(table);
}

        sortVal: row => CLIENT_HIGHLIGHTS.findIndex(h=>h.value===(row.item.highlight||'')),
        type:'select', options: CLIENT_HIGHLIGHTS.map(h=>({value:h.value, label:h.label})),

      if(CLIENT_LIST.some(c=>c.name===name)){ toast('Tên Client này đã tồn tại'); return false; }
      CLIENT_LIST.push({name, note: (values.note||'').trim(), highlight: values.highlight||''});
      await saveClientList();
      toast('Đã thêm Client');
      renderClientList();
    },
    renderActions: row => {
      const delBtn = el('button',{class:'rowbtn del'},['🗑️']);
      delBtn.addEventListener('click', async ()=>{
        if(confirm(`Xoá Client "${row.item.name}"?`)){
          CLIENT_LIST.splice(row.idx,1);
          await saveClientList();
          renderClientList();
        }
      });
      return [delBtn];
    },
  });
  root.appendChild(table);
}

   ITEM_CODE_LIST/DEFAULT_ITEM_CODE_LIST). Không dùng Item Code làm khoá
   duy nhất tuyệt đối — dữ liệu thật cho thấy cùng 1 mã RW có thể lặp lại
   với tên khác nhau, nên sửa/xoá luôn thao tác theo INDEX trong mảng. */
function renderItemCodeList(){
  const root = qs('#view-itemcodelist');
  root.innerHTML = '';
  root.appendChild(el('div',{class:'section-title'},['Danh sách Items Code']));
  root.appendChild(el('div',{class:'sub', style:'margin-top:-10px;'},[`Bảng liên đới Item Code, Tên sản phẩm & Recipe — ${ITEM_CODE_LIST.length} dòng (mặc định nạp sẵn từ dữ liệu thực tế). Lọc/sắp xếp theo từng cột, sửa trực tiếp trong bảng, hoặc thêm dòng mới ở hàng đầu tiên.`]));

  const xlsCard = el('div',{class:'card'},[
    el('div',{class:'card-h'},['Xuất template / Nhập / Xuất Excel', el('div',{class:'rule'})]),
    el('p',{class:'sub', style:'margin:0 0 10px;'},['Tải template mẫu → điền trong Excel (cột Loại: FGs hoặc RW / Item Code / Tên sản phẩm / Recipe) → nhập lại vào đây. File Excel dùng đúng định dạng ".xls" mà app này tự xuất ra (mở/sửa/lưu bình thường bằng Microsoft Excel) — file ".xlsx" gốc khác định dạng cần dán lại dữ liệu vào template trước.']),
    el('div',{class:'row'},[
      el('button',{class:'btn ghost sm', id:'btnItemCodeTemplate'},['📄 Tải template mẫu']),
      el('button',{class:'btn ghost sm', id:'btnItemCodeExportXls'},['📊 Xuất Excel danh sách hiện tại']),
      el('label',{class:'btn ghost sm', style:'position:relative;'},['📥 Nhập từ Excel',
        el('input',{type:'file', accept:'.xls,.xml', id:'itemCodeXlsInput', style:'position:absolute;inset:0;opacity:0;cursor:pointer;'})
      ]),
    ]),
  ]);
  root.appendChild(xlsCard);
  const ITEMCODE_XLS_HEADERS = ['Loại (FGs/RW)','Item Code','Tên sản phẩm','Recipe'];
  qs('#btnItemCodeTemplate', xlsCard).addEventListener('click', ()=>{
    const xml = buildTableExcelXml('Items Code Template', ITEMCODE_XLS_HEADERS, [
      ['FGs', 'VD: 10100001', 'VD: Freeze Dried Instant Coffee FD 4000 25kg', 'VD: 400'],
      ['RW', 'VD: 11100010', 'VD: Rework Freeze Dried Instant Coffee FD 4000 25kg', 'VD: 400'],
    ]);
    downloadBlob(new Blob([xml],{type:'application/vnd.ms-excel'}), 'Shiftly_ItemsCode_Template.xls');
  });
  qs('#btnItemCodeExportXls', xlsCard).addEventListener('click', ()=>{
    const rows = ITEM_CODE_LIST.map(i=>[i.type, i.itemCode||'', i.name||'', i.recipe||'']);
    const xml = buildTableExcelXml('Danh sách Items Code', ITEMCODE_XLS_HEADERS, rows);
    downloadBlob(new Blob([xml],{type:'application/vnd.ms-excel'}), `Shiftly_ItemsCode_List_${todayStr()}.xls`);
  });
  qs('#itemCodeXlsInput', xlsCard).addEventListener('change', async e=>{
    const file = e.target.files[0]; if(!file) return;
    const text = await file.text();
    const table = parseTableExcelXml(text);
    if(table===null){ toast('Không đọc được file Excel này — cần đúng định dạng .xls do app này xuất ra (xem "Tải template mẫu")'); return; }
    const dataRows = table.slice(1).filter(r=>(r[1]||r[2]) && !/^VD:/i.test(r[1]||''));
    // Không coi Item Code là khoá duy nhất (dữ liệu thật có mã RW trùng nhau
    // nhưng khác tên) — khớp theo cả 3 field (Loại+Mã+Tên) để lần nhập lại
    // (cùng file) không tạo trùng lặp, nhưng vẫn giữ được các dòng thật sự
    // khác nhau dù chung mã.
    let added=0, skipped=0;
    dataRows.forEach(r=>{
      const type = /^rw/i.test((r[0]||'').trim()) ? 'RW' : 'FGs';
      const itemCode = (r[1]||'').trim(), name = (r[2]||'').trim(), recipe = (r[3]||'').trim();
      const dup = ITEM_CODE_LIST.some(i=>i.type===type && i.itemCode===itemCode && i.name===name);
      if(dup){ skipped++; return; }
      ITEM_CODE_LIST.push({type, itemCode, name, recipe});
      added++;
    });
    await saveItemCodeList();
    toast(`Đã nhập ${added} dòng mới${skipped?`, bỏ qua ${skipped} dòng trùng`:''}`);
    renderItemCodeList();
  });

  renderItemCodeList._table = renderItemCodeList._table || {filters:{}, sort:{key:null,dir:null}};
  const table = buildEditableTable({
    state: renderItemCodeList._table,
    rows: ITEM_CODE_LIST.map((item,idx)=>({item, idx})),
    emptyText: 'Không có Item Code nào khớp bộ lọc.',
    columns: [
      {
        key:'type', label:'Loại', sortable:true,
        filter:{type:'multi', options:[{value:'FGs',label:'FGs (Thành phẩm)'},{value:'RW',label:'RW (Rework)'}]},
        filterVal: row=>row.item.type, sortVal: row=>row.item.type,
        type:'select', options:[{value:'FGs',label:'FGs'},{value:'RW',label:'RW'}],
        get: row=>row.item.type,
        set: async (row, val) => { row.item.type = val; await saveItemCodeList(); },
      },
      {
        key:'itemCode', label:'Item Code', sortable:true, filter:'text', type:'text',
        get: row=>row.item.itemCode||'', addPlaceholder:'VD: 10100001',
        set: async (row, val) => { row.item.itemCode = val; await saveItemCodeList(); },
      },
      {
        key:'name', label:'Tên sản phẩm', sortable:true, filter:'text', type:'text',
        get: row=>row.item.name||'', addPlaceholder:'Tên sản phẩm',
        set: async (row, val) => { row.item.name = val; await saveItemCodeList(); },
      },
      {
        key:'recipe', label:'Recipe', sortable:true, filter:'text', type:'text',
        get: row=>row.item.recipe||'', addPlaceholder:'VD: 405, L450, Semi-FGs...',
        set: async (row, val) => { row.item.recipe = val; await saveItemCodeList(); },
      },
    ],
    onAdd: async (values) => {
      const type = values.type==='RW' ? 'RW' : 'FGs';
      const itemCode = (values.itemCode||'').trim(), name = (values.name||'').trim(), recipe = (values.recipe||'').trim();
      if(!itemCode && !name){ toast('Cần nhập ít nhất Item Code hoặc Tên sản phẩm'); return false; }
      if(itemCode && ITEM_CODE_LIST.some(i=>i.type===type && i.itemCode===itemCode)){
        if(!confirm(`Mã ${itemCode} (${type}) đã tồn tại (dữ liệu thật cho phép trùng mã khác tên) — vẫn thêm dòng mới?`)) return false;
      }
      ITEM_CODE_LIST.push({type, itemCode, name, recipe});
      await saveItemCodeList();
      toast('Đã thêm Item Code');
      renderItemCodeList();
    },
    renderActions: row => {
      const delBtn = el('button',{class:'rowbtn del'},['🗑️']);
      delBtn.addEventListener('click', async ()=>{
        if(confirm(`Xoá dòng "${row.item.itemCode||row.item.name}"?`)){
          ITEM_CODE_LIST.splice(row.idx,1);
          await saveItemCodeList();
          renderItemCodeList();
        }
      });
      return [delBtn];
    },
  });
  root.appendChild(table);
}

  card.appendChild(el('div',{class:'grid g3', style:'grid-template-columns:repeat(auto-fit,minmax(160px,1fr));'},[

    el('label',{class:'fld'},[el('span',{class:'lab'},['Lọc Hành động']), actSel]),
    el('label',{class:'fld'},[el('span',{class:'lab'},['Tìm nhanh']), searchInp]),
  ]));
  const refreshBtn = el('button',{class:'btn ghost sm', style:'margin-top:12px;'},['🔄 Làm mới']);
  card.appendChild(refreshBtn);
  const tableBox = el('div',{style:'margin-top:12px;overflow-x:auto;'},[]);
  card.appendChild(tableBox);
  root.appendChild(card);

  const detailOf = l => (l.changes||[]).map(c=>`${c.label}: ${c.from===null||c.from===undefined?'—':c.from} → ${c.to===null||c.to===undefined?'—':c.to}`).join('; ');
  let allLogs = [];
  function fillSel(sel, allLabel, values){
    const cur = sel.value;
    sel.innerHTML = '';
    sel.appendChild(el('option',{value:''},[allLabel]));
    [...new Set(values.filter(Boolean))].sort().forEach(v=>sel.appendChild(el('option',{value:v},[v])));
    sel.value = cur;
  }
  function draw(){
    const u = userSel.value, m = machSel.value, a = actSel.value, q = searchInp.value.trim().toLowerCase();
    const logs = allLogs.filter(l=>(!u||l.user===u)&&(!m||l.machine===m)&&(!a||l.action===a)
      && (!q || (detailOf(l)+' '+(l.section||'')+' '+(l.po||'')).toLowerCase().includes(q)));
    totalNum.textContent = String(allLogs.length);
    tableBox.innerHTML = '';
    if(!logs.length){ tableBox.appendChild(el('div',{class:'empty'},[el('div',{class:'ic'},['🕓']), el('div',{},['Chưa có nhật ký nào khớp điều kiện.'])])); return; }
    const th = t => el('th',{style:'text-align:left;padding:8px;color:var(--teal-d);'},[t]);
    const table = el('table',{class:'specs-table', style:'width:100%;border-collapse:collapse;'},[
      el('thead',{},[el('tr',{},['Thời gian','User','Máy tính','Hành động','Chi tiết','Khu vực'].map(th))]),
      el('tbody',{},logs.map(l=>el('tr',{},[
        fmtDateTimeVN(new Date(l.ts).getTime()), l.user||'—', l.machine||'—', l.action||'Cập nhật dữ liệu',
        [detailOf(l), l.po?'PO '+l.po:''].filter(Boolean).join(' · '), l.section||'—',
      ].map(t=>el('td',{style:'padding:8px;'},[String(t)]))))),
    ]);
    tableBox.appendChild(table);
  }
  async function reload(){
    allLogs = (await getAllLogs()).sort((x,y)=>(y.ts||'').localeCompare(x.ts||'')).slice(0, LOG_MAX);
    // Nhật ký từ MỌI máy: chỉ gọi khi mở/làm mới tab (không poll), tối đa
    // LOG_MAX dòng; đang 🔴 Protection hoặc lỗi mạng thì dùng bản trên máy này.
    if(cloudConfigured() && navigator.onLine && egressState().level!=='protection'){
      const res = await cloudFetch('sync_get_logs', {p_limit: LOG_MAX});
      if(res && Array.isArray(res.rows)) allLogs = res.rows.slice(0, LOG_MAX);
    }
    allLogs.forEach(l=>{ l.action = l.action||'Cập nhật dữ liệu'; });
    fillSel(userSel, 'Tất cả User', allLogs.map(l=>l.user));
    fillSel(machSel, 'Tất cả Máy tính', allLogs.map(l=>l.machine));
    fillSel(actSel, 'Tất cả Hành động', allLogs.map(l=>l.action||'Cập nhật dữ liệu'));
    draw();
  }
  [userSel, machSel, actSel].forEach(s=>s.addEventListener('change', draw));
  searchInp.addEventListener('input', draw);
  refreshBtn.addEventListener('click', reload);
  await reload();
}

/* ===================== REPORT TAB (image export) ===================== */
function getMeasureCtx(fontSize){
  try{
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext && canvas.getContext('2d');
    if(!ctx) return null;
    ctx.font = `${fontSize}px Arial, sans-serif`;
    return ctx;
  }catch(e){ return null; }
}
function measureTextWidth(text, fontSize, ctx){
  if(ctx){
    try{ return ctx.measureText(text).width; }catch(e){}
  }
  return String(text).length * fontSize * 0.56; // fallback heuristic (no canvas available)
}
// Wraps text to fit maxWidth, breaking on spaces first and hard-breaking
// any single "word" that's still too long on its own (e.g. a long code).
function wrapText(text, maxWidth, fontSize, ctx){
  const words = String(text).split(/\s+/).filter(Boolean);
  if(words.length===0) return [''];
  const lines = [];
  let cur = '';
  words.forEach(w=>{
    const test = cur ? cur+' '+w : w;
    if(measureTextWidth(test, fontSize, ctx) > maxWidth && cur){
      lines.push(cur);
      cur = w;
    } else {
      cur = test;
    }
  });
  if(cur) lines.push(cur);
  const out = [];
  lines.forEach(line=>{
    if(measureTextWidth(line, fontSize, ctx) <= maxWidth){ out.push(line); return; }
    let chunk = '';
    for(const ch of line){
      const test = chunk + ch;
      if(measureTextWidth(test, fontSize, ctx) > maxWidth && chunk){ out.push(chunk); chunk = ch; }
      else chunk = test;
    }
    if(chunk) out.push(chunk);
  });
  return out.length ? out : [''];
}
function renderLinesToSVG(lines, W){
  const M = 20;
  const FONT = 11.5;
  const ctx = getMeasureCtx(FONT);
  const H_TITLE=26, H_SUB=17, H_SECTION=21, H_ROW=16, H_WRAP=13.5, H_EMPTY=15, H_GAP=5, H_BAR=36, H_FOOTER=18, H_SHIFTDIV=30;
  // Ảnh đính kèm giờ kéo theo chiều rộng báo cáo thay vì thumbnail nhỏ cố
  // định: tối đa 2 ảnh/hàng, mỗi ảnh chia đều chiều rộng còn lại; hàng cuối
  // chỉ còn 1 ảnh (số lẻ) thì ảnh đó kéo full chiều rộng luôn.
  const IMG_ROW_H=200, IMG_GAP=10, IMG_PER_ROW=2;
  let clipCounter = 0;
  const colGap = 14;
  const colW = (W - 2*M - colGap) / 2;

  // First pass: turn each 'row' into a compact "Label: Value" combined
  // string (A), then pack two of them side-by-side per line whenever both
  // fit within half the page width (B). Rows whose value is too long to
  // fit even a full-width single line still wrap (unchanged behaviour),
  // but such rows are rare once combined into one string. Spacing between
  // every element is tightened throughout (C).
  const plan = [];
  let yCursor = M;
  let pending = null; // a single short row waiting for a same-row partner
  function pushEntry(entry){ entry.y = yCursor; yCursor += entry.h; plan.push(entry); }
  function flushPending(){
    if(pending){ pushEntry({t:'row-full', label:pending.label, disp:pending.disp, color:pending.color, h:H_ROW}); pending=null; }
  }
  lines.forEach(l=>{
    if(l.t==='row'){
      const dispStr = l.disp===undefined || l.disp===null ? '' : String(l.disp);
      const combined = dispStr ? `${l.label}: ${dispStr}` : `${l.label}: —`;
      const combinedW = measureTextWidth(combined, FONT, ctx);
      const fitsHalf = dispStr.indexOf('\n')===-1 && combinedW <= (colW - 10);
      if(fitsHalf){
        const entry = {label:l.label, disp:dispStr, color:l.color};
        if(pending){ pushEntry({t:'row-pair', left:pending, right:entry, h:H_ROW}); pending=null; }
        else pending = entry;
      } else {
        flushPending();
        const fitsFull = dispStr.indexOf('\n')===-1 && combinedW <= (W - 2*M - 10);
        if(fitsFull){
          pushEntry({t:'row-full', label:l.label, disp:dispStr, color:l.color, h:H_ROW});
        } else {
          const wrapWidth = W - 2*M - 10;
          let valueLines = [];
          dispStr.split('\n').forEach(p=>{ valueLines = valueLines.concat(wrapText(p, wrapWidth, FONT-0.5, ctx)); });
          pushEntry({t:'row-stack', label:l.label, valueLines, color:l.color, h: H_ROW + valueLines.length*H_WRAP});
        }
      }
    } else {
      flushPending();
      let h; let extra = {};
      if(l.t==='images'){
        const rows = Math.ceil(l.thumbs.length / IMG_PER_ROW);
        h = 16 + rows*(IMG_ROW_H+IMG_GAP) + (l.total>l.thumbs.length ? 14 : 0);
      } else if(l.t==='issueaction'){
        // Issue/Abnormal & Action hiển thị SONG SONG (2 cột) theo từng cặp,
        // trong 1 khung riêng — thay vì đi qua cơ chế 'row' chung, để giữ rõ
        // mối liên hệ Issue -> Action ngay cả khi có nhiều cặp trong 1
        // checkpoint. Độ cao mỗi cặp phụ thuộc số dòng chữ sau khi wrap.
        const pairs = l.pairs || [];
        const iaMeta = pairs.map(p=>{
          const issueLines = wrapText(p.issue||'—', colW-16, FONT-0.5, ctx);
          const actionLines = wrapText(p.action||'—', colW-16, FONT-0.5, ctx);
          const lineCount = Math.max(issueLines.length, actionLines.length, 1);
          return {issueLines, actionLines, blockH: 16 + lineCount*13 + 10};
        });
        h = 6 + iaMeta.reduce((s,m)=>s+m.blockH, 0);
        extra = {iaMeta};
      } else {
        h = l.t==='title'?H_TITLE : l.t==='sub'?H_SUB : l.t==='section'?H_SECTION : l.t==='empty'?H_EMPTY : l.t==='gap'?H_GAP : l.t==='bar'?H_BAR : l.t==='footer'?H_FOOTER : l.t==='shiftdivider'?H_SHIFTDIV : 0;
      }
      pushEntry(Object.assign({}, l, {h}, extra));
    }
  });
  flushPending();

  const totalH = M + (yCursor - M) + M;
  let svg = `<svg class="chart" width="${W}" height="${totalH}" viewBox="0 0 ${W} ${totalH}" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" font-family="Arial, sans-serif">`;
  svg += `<rect x="0" y="0" width="${W}" height="${totalH}" fill="#ffffff"/>`;

  // Alternating background bands: one band per 'section' block, spanning
  // from that section's heading down to the next section (or end).
  const sectionEntries = plan.filter(p=>p.t==='section');
  sectionEntries.forEach((sec,i)=>{
    const bandStart = sec.y;
    const bandEnd = i+1 < sectionEntries.length ? sectionEntries[i+1].y : (yCursor + M - 6);
    if(i % 2 === 1){
      svg += `<rect x="0" y="${bandStart}" width="${W}" height="${bandEnd-bandStart}" fill="#F8FAFC"/>`;
    }
  });

  function labelValueTspan(label, disp, color){
    return `<tspan fill="#334155">${escapeXml(label)}: </tspan><tspan font-weight="700" fill="${color}">${escapeXml(disp||'—')}</tspan>`;
  }

  plan.forEach(p=>{
    const y = p.y;
    if(p.t==='title'){ svg += `<text x="${M}" y="${y+16}" font-size="15.5" font-weight="700" fill="#0B1220">${escapeXml(p.text)}</text>`; }
    else if(p.t==='sub'){ svg += `<text x="${M}" y="${y+12}" font-size="11" fill="#475569">${escapeXml(p.text)}</text>`; }
    else if(p.t==='bar'){
      const {pass,cond,fail,total} = p.stats;
      const barW = W-2*M, bx=M, by=y+15;
      const wPass = total? barW*pass/total : 0, wCond = total? barW*cond/total : 0, wFail = total? barW*fail/total : 0;
      const pct = total ? Math.round(pass/total*100) : 0;
      svg += `<text x="${M}" y="${y+10}" font-size="10.5" font-weight="700" fill="#0F172A">Tổng quan: ${pct}% Đạt (${pass}/${total})</text>`;
      svg += `<rect x="${bx}" y="${by}" width="${barW}" height="11" rx="5.5" fill="#E2E8F0"/>`;
      if(wPass>0) svg += `<rect x="${bx}" y="${by}" width="${wPass}" height="11" rx="5.5" fill="#15803D"/>`;
      if(wCond>0) svg += `<rect x="${bx+wPass}" y="${by}" width="${wCond}" height="11" fill="#B45309"/>`;
      if(wFail>0) svg += `<rect x="${bx+wPass+wCond}" y="${by}" width="${wFail}" height="11" fill="#B91C1C"/>`;
      svg += `<text x="${M}" y="${y+33}" font-size="9" fill="#64748B">✅ Đạt ${pass}   ⚠️ Cảnh báo ${cond}   ❌ Lỗi ${fail}</text>`;
    }
    else if(p.t==='section'){
      svg += `<rect x="${M}" y="${y+2}" width="${W-2*M}" height="1" fill="#CBD5E1"/>`;
      svg += `<text x="${M}" y="${y+16}" font-size="11.5" font-weight="700" fill="#B45309">${escapeXml(p.text.toUpperCase())}</text>`;
    }
    else if(p.t==='empty'){ svg += `<text x="${M+6}" y="${y+11}" font-size="10" fill="#94A3B8">${escapeXml(p.text)}</text>`; }

    }
    else if(p.t==='row-pair'){
      svg += `<text x="${M+6}" y="${y+11}" font-size="11.5">${labelValueTspan(p.left.label, p.left.disp, p.left.color)}</text>`;
      svg += `<text x="${M+colW+colGap+6}" y="${y+11}" font-size="11.5">${labelValueTspan(p.right.label, p.right.disp, p.right.color)}</text>`;
    }
    else if(p.t==='row-stack'){
      svg += `<text x="${M+6}" y="${y+11}" font-size="11.5" fill="#334155">${escapeXml(p.label)}</text>`;
      let vy = y + H_ROW;
      p.valueLines.forEach(vl=>{
        svg += `<text x="${M+14}" y="${vy+10}" font-size="11" font-weight="600" fill="${p.color}">${escapeXml(vl)}</text>`;
        vy += H_WRAP;
      });
    }
    else if(p.t==='images'){
      svg += `<text x="${M+6}" y="${y+10}" font-size="10" font-weight="700" fill="#334155">📎 Ảnh đính kèm (${p.total})</text>`;
      const n = p.thumbs.length;

      let idx = 0, ty = y+16;

        const remaining = n - idx;
        const count = Math.min(IMG_PER_ROW, remaining);
        // Hàng đủ IMG_PER_ROW ảnh: chia đều. Hàng cuối lẻ (chỉ 1 ảnh còn lại):
        // ảnh đó kéo full chiều rộng thay vì để trống nửa còn lại.

          const cid = `thimg${clipCounter++}`;
          svg += `<clipPath id="${cid}"><rect x="${tx}" y="${ty}" width="${boxW}" height="${IMG_ROW_H}" rx="8"/></clipPath>`;
          svg += `<image href="${href}" x="${tx}" y="${ty}" width="${boxW}" height="${IMG_ROW_H}" preserveAspectRatio="xMidYMid slice" clip-path="url(#${cid})"/>`;
          svg += `<rect x="${tx}" y="${ty}" width="${boxW}" height="${IMG_ROW_H}" rx="8" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>`;
          tx += boxW + IMG_GAP;
          idx++;
        }
        ty += IMG_ROW_H + IMG_GAP;
      }
      if(p.total > n){
        svg += `<text x="${M+6}" y="${ty+4}" font-size="10" fill="#94A3B8">+${p.total-n} ảnh khác (xem đầy đủ trong "🌐 Xuất báo cáo HTML đầy đủ")</text>`;

    }
    else if(p.t==='shiftdivider'){

      svg += `<text x="${M+10}" y="${y+15}" font-size="12.5" font-weight="700" fill="#ffffff">${escapeXml(p.text)}</text>`;
    }

      let iy = y + 4;
      const leftX = M+10, rightX = M+colW+colGap+10;
      (p.iaMeta||[]).forEach((m, idx)=>{
        svg += `<rect x="${M}" y="${iy-2}" width="${W-2*M}" height="${m.blockH-4}" rx="6" fill="#FFF7ED" stroke="#FCD34D" stroke-width="1"/>`;
        svg += `<text x="${leftX}" y="${iy+11}" font-size="10" font-weight="700" fill="#B45309">Issue/Abnormal${p.iaMeta.length>1?' #'+(idx+1):''}</text>`;
        svg += `<text x="${rightX}" y="${iy+11}" font-size="10" font-weight="700" fill="#B45309">Action</text>`;

          if(m.actionLines[li]) svg += `<text x="${rightX}" y="${ly}" font-size="11" fill="#0F172A">${escapeXml(m.actionLines[li])}</text>`;
          ly += 13;
        }
        iy += m.blockH;

}

function computeReportStats(cps){
  let pass=0,cond=0,fail=0;
  cps.filter(cp=>cp.section!=='META').forEach(cp=>{
    const sec = sectionById(cp.section);
    if(!sec) return;
    sec.fields.forEach(f=>{
      const v = cp.fields[f.id];
      if(f.type==='boolean'){
        if(v===true) pass++; else if(v===false) fail++;
      } else if(f.type==='number'){
        const st = evalStatus(f, v);
        if(st==='pass') pass++; else if(st==='cond') cond++; else if(st==='fail') fail++;
      }
    });
  });
  return {pass,cond,fail,total:pass+cond+fail};
}
// Loads a data-URL/URL into an Image element (promise-wrapped) — used to
// downscale attached photos before embedding into the compact SVG report,
// so a checkpoint with several full-size photos doesn't bloat the exported
// PNG's render time / memory.
function loadImageEl(src){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = ()=>resolve(img);
    img.onerror = ()=>reject(new Error('image load failed'));
    img.src = src;
  });
}
async function thumbDataUrl(dataUrl, maxDim){
  try{
    const img = await loadImageEl(dataUrl);
    let w=img.width, h=img.height;
    if(w>h){ if(w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; } }
    else { if(h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; } }
    const canvas = document.createElement('canvas');
    canvas.width=w; canvas.height=h;
    canvas.getContext('2d').drawImage(img,0,0,w,h);
    return canvas.toDataURL('image/jpeg', 0.6);
  }catch(e){ console.error(e); return null; }
}

    const src = imgSrc(im);
    if(!src) continue;
    const t = await thumbDataUrl(src, 500); // ảnh giờ hiển thị to hơn nhiều (full chiều rộng báo cáo) — cần nguồn nét hơn 220px cũ
    if(t) thumbs.push(t);
  }
  if(thumbs.length===0) return null;
  return { t:'images', total: imgs.length, thumbs };
}
// qmsOnly (tuỳ chọn, mặc định false): chỉ hiện chỉ tiêu đã đánh dấu "Xuất
// trong báo cáo QMS" ở tab Specs (isQMS) — cùng cơ chế/dữ liệu với nút
// "Xuất theo mẫu Process/QMS", cho phép báo cáo ảnh gọn lại chỉ còn số liệu
// QMS thay vì mọi Parameters đã nhập. Mặc định false = giữ nguyên hành vi
// cũ (hiện mọi chỉ tiêu có giá trị).
// Trả về mảng 'lines' cho 1 checkpoint: chỉ tiêu thường (loại trừ field
// "<Section>_ISSUE"/"_ACTION", vốn có khối riêng bên dưới) rồi tới khối
// Issue/Abnormal & Action song song (nếu có) — dùng chung cho cả báo cáo
// Theo ca và PO Production Timeline để không lặp code/không lệch hành vi.
function buildCheckpointFieldLines(sec, cp, qmsOnly){
  const {issueId, actionId} = findIssueActionFieldIds(sec);
  const rows = [];
  sec.fields.filter(f=>f.id!==issueId && f.id!==actionId).forEach(f=>{
    if(qmsOnly && !f.isQMS) return;
    const v = cp.fields[f.id];
    if(v===undefined||v===null||v==='') return;
    let disp, color='#0F172A';
    if(f.type==='boolean'){ disp = boolDisp(f, v); color = v?'#15803D':'#B91C1C'; }
    else if(f.type==='number'){ const ok=inSpec(f,v); disp=String(v); color= ok===false?'#B91C1C':ok===true?'#15803D':'#0F172A'; }
    else disp = String(v).replace(/\n/g,' / ');
    rows.push({label: (qmsOnly && f.qmsLabel) || f.label.split('\n')[0], disp, color});
  });
  // Issue/Action luôn hiển thị (không phụ thuộc qmsOnly) — đây là thông tin
  // bất thường/xử lý, không phải 1 "chỉ tiêu QMS" nên không hợp lý để lọc
  // theo cờ isQMS như các field đo lường khác.
  const pairs = getIssueActionPairs(cp, sec).filter(p=>p.issue||p.action);
  const out = [];
  if(rows.length===0 && pairs.length===0){
    out.push({t:'empty', text:'— Không có dữ liệu —'});
  } else {
    rows.forEach(r=>out.push({t:'row', label:r.label, disp:r.disp, color:r.color}));
  }
  if(pairs.length>0) out.push({t:'issueaction', pairs});
  return out;
}
// Phần "thân" báo cáo cho 1 tập checkpoint của đúng 1 ca (Bàn giao ca +
// từng công đoạn theo đúng thứ tự SCHEMA) — KHÔNG gồm title/sub/footer, để
// dùng lại được cho cả báo cáo 1 ca (buildReportSVG) lẫn báo cáo "Tất cả
// các ca" (buildAllShiftsReportSVG, lặp lại khối này 3 lần).
async function buildShiftBodyLines(cps, qmsOnly){
  const lines = [];
  const stats = computeReportStats(cps);
  if(stats.total>0) lines.push({t:'bar', stats});
  lines.push({t:'gap'});
  const meta = cps.find(cp=>cp.section==='META');
  if(meta){
    const info=(meta.fields['INFO_ISSUE']||'').trim(), ho=(meta.fields['HANDOVER']||'').trim();
    if(info || ho){
      lines.push({t:'section', text:'Bàn giao ca'});
      if(info) lines.push({t:'row', label:'Tình hình/Sự cố', disp:info, color:'#0F172A'});
      if(ho) lines.push({t:'row', label:'Bàn giao', disp:ho, color:'#0F172A'});
      lines.push({t:'gap'});
    }
  }
  for(const sec of SCHEMA.filter(s=>s.id!=='META')){
    const secCps = cps.filter(cp=>cp.section===sec.id);
    if(secCps.length===0) continue;
    for(const cp of secCps){
      lines.push({t:'section', text:`${sec.name} — PO ${cp.po||'—'}${cp.recipe?' · Recipe '+cp.recipe:''} (QC: ${cp.technician||'—'})`});
      lines.push(...buildCheckpointFieldLines(sec, cp, qmsOnly));
      const imgLine = await buildImagesLineForCheckpoint(cp);
      if(imgLine) lines.push(imgLine);
      lines.push({t:'gap'});
    }
  }
  if(cps.length===0) lines.push({t:'empty', text:'— Chưa có dữ liệu nào cho ca này —'});
  return lines;
}
async function buildReportSVG(dateVal, shiftVal, qmsOnly){

// "Tất cả" (chế độ Theo ca): lần lượt Ca 1 -> 2 -> 3 của đúng 1 ngày, phân
// tách rõ bằng 1 dải màu đậm (t:'shiftdivider') trước mỗi ca; ca không có
// dữ liệu vẫn hiện dải + dòng "Chưa có dữ liệu..." (từ buildShiftBodyLines)

// Thứ tự ưu tiên hiển thị Process trên PO Production Timeline (mục 3) — chỉ
// những Công đoạn THỰC SỰ có checkpoint mới xuất hiện. Nhãn tiếng Anh dùng
// riêng cho Gantt (mục 1/3), khác tên tiếng Việt của section trong SCHEMA.
const PROCESS_TIMELINE_ORDER = ['ROA','EXT','EVA','FD','FP'];
const GANTT_PROCESS_LABELS = {ROA:'ROASTING', EXT:'EXTRACTION', EVA:'EVAPORATION', FD:'FREEZE DRYING', FP:'FILLING & PACKING'};
function nextDateISO(iso){
  const d = new Date(iso+'T00:00:00');
  d.setDate(d.getDate()+1);
  const p = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
// Sinh timeline LIÊN TỤC (mục 2): mỗi Date x Shift từ checkpoint sớm nhất
// -> muộn nhất của PO, kể cả những mốc KHÔNG có checkpoint nào — để Gantt
// thể hiện đúng khoảng chạy thật của từng Process, không chỉ các điểm rời
// rạc có dữ liệu.
function buildPOGanttColumns(relevant){
  if(relevant.length===0) return [];
  const sorted = relevant.slice().sort((a,b)=>(a.date+a.shift).localeCompare(b.date+b.shift));
  const first = sorted[0], last = sorted[sorted.length-1];
  const cols = [];
  let d = first.date, s = parseInt(first.shift,10) || 1;
  const endKey = last.date + last.shift;
  for(let guard=0; guard<3000; guard++){
    cols.push({date:d, shift:String(s)});
    if(d + String(s) === endKey) break;
    s++;
    if(s>3){ s=1; d = nextDateISO(d); }
  }
  return cols;
}
// Gộp các cột liên tiếp cùng Ngày lại thành 1 nhóm (colspan) cho hàng tiêu
// đề Date, để mỗi Ngày chỉ hiện 1 lần, còn hàng Ca bên dưới vẫn tách riêng.
function groupGanttColsByDate(cols){
  const groups = [];
  cols.forEach(c=>{
    const last = groups[groups.length-1];
    if(last && last.date===c.date) last.span++;
    else groups.push({date:c.date, span:1});
  });
  return groups;
}
// 1 checkpoint có thể mang NHIỀU cặp Issue/Action (ISSUE_PAIRS_KEY) — gộp
// thành 1 khối text đánh số cho đúng 1 ô Gantt (mục 5, giống mẫu Excel
// "1. ... / 2. ..."). kind: 'issue' | 'action'.
function ganttCellText(cp, sec, kind){
  if(!cp || !sec) return '';
  const pairs = getIssueActionPairs(cp, sec).filter(p=>p.issue||p.action);
  if(pairs.length===0) return '';
  return pairs.map((p,i)=>{
    const v = (kind==='issue' ? p.issue : p.action) || '';
    return pairs.length>1 ? `${i+1}. ${v}` : v;
  }).join('\n');
}
// Dữ liệu nền dùng CHUNG cho mọi cách "vẽ" Gantt của 1 PO (ảnh SVG xem
// trước/PNG, bảng HTML tương tác, và giờ thêm Excel + PDF theo mẫu) — tính
// 1 lần duy nhất từ đúng checkpoint thật, đảm bảo mọi định dạng xuất luôn
// khớp nhau tuyệt đối (không lệch cột/khoảng chạy giữa các định dạng).
function buildGanttBaseData(matches){
  const relevant = matches.filter(cp=>cp.section!=='META');
  const cols = buildPOGanttColumns(relevant);
  const dateGroups = groupGanttColsByDate(cols);
  const cpIndex = {};
  relevant.forEach(cp=>{ cpIndex[cp.section+'|'+cp.date+'|'+cp.shift] = cp; });
  const bySection = {};
  relevant.forEach(cp=>{ (bySection[cp.section]=bySection[cp.section]||[]).push(cp); });
  const presentSections = PROCESS_TIMELINE_ORDER.filter(id=>bySection[id] && bySection[id].length);
  const withCode = relevant.find(cp=>cp.itemCode) || relevant[0];
  const lookup = withCode && withCode.itemCode ? lookupItemByCode(withCode.itemCode) : {status:'not_found'};
  const itemName = withCode && (lookup.status==='ok'||lookup.status==='missing_recipe') ? lookup.name : '';
  const recipe = withCode ? (withCode.recipe || (lookup.status==='ok' ? lookup.recipe : '')) : '';
  return { relevant, cols, dateGroups, cpIndex, bySection, presentSections, itemCode: withCode?(withCode.itemCode||''):'', itemName, recipe };
}
// Khoảng cột (index, 0-based) mà 1 Công đoạn thực sự có checkpoint — dùng để
// vẽ thanh Gantt liên tục từ cột đầu tới cột cuối. Trả {startIdx:-1,
// endIdx:-1} nếu Công đoạn đó không có checkpoint nào trong `cols`.
function ganttProcessRange(cols, list){
  let startIdx=-1, endIdx=-1;
  cols.forEach((c,i)=>{ if(list.some(cp=>cp.date===c.date && cp.shift===c.shift)){ if(startIdx===-1) startIdx=i; endIdx=i; } });
  return {startIdx, endIdx};
}
// PO Production Timeline dạng Gantt (mục 1-5): Header (Item Code/Item Name/
// PO/Recipe) hiển thị 1 LẦN DUY NHẤT, rồi 1 lưới Process x Date x Shift LIÊN
// TỤC — mỗi Process gồm 3 hàng (thanh Gantt, Issues/Abnormal, Action), Issue/
// Action nằm ĐÚNG cột Date+Shift của checkpoint phát sinh (không gộp). Vẽ
// thủ công bằng SVG (không qua renderLinesToSVG, vốn là danh sách dọc, không
// hợp cho dạng lưới) — W tự co giãn theo đúng số cột thật, không giới hạn
// 760px, để PNG xuất ra không bao giờ cắt mất cột bên phải (mục 9).
async function buildPOReportSVG(poQuery, matches){
  const relevant = matches.filter(cp=>cp.section!=='META');
  const withCode = relevant.find(cp=>cp.itemCode) || relevant[0];
  const lookup = withCode && withCode.itemCode ? lookupItemByCode(withCode.itemCode) : {status:'not_found'};
  const itemName = withCode && (lookup.status==='ok'||lookup.status==='missing_recipe') ? lookup.name : '';
  const recipeVal = withCode ? (withCode.recipe || (lookup.status==='ok' ? lookup.recipe : '')) : '';
  const headerLines = [
    ['ITEM CODE', withCode ? (withCode.itemCode||'—') : '—'],
    ['ITEM NAME', itemName || '—'],
    ['PO', poQuery],
    ['RECIPE', recipeVal || '—'],
  ];
  const PAD=20, TITLE_H=24, HDRLINE_H=16;

  if(relevant.length===0){
    const H = PAD*2 + TITLE_H + headerLines.length*HDRLINE_H + 24;
    const W = 560;
    let svg = `<svg class="chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif"><rect x="0" y="0" width="${W}" height="${H}" fill="#ffffff"/>`;
    svg += `<text x="${PAD}" y="${PAD+14}" font-size="14" font-weight="700" fill="#0B1220">ILD COFFEE VIETNAM — QUALITY &amp; ACTIVITIES FOLLOW UP</text>`;
    let hy = PAD+TITLE_H;
    headerLines.forEach(([label,val])=>{ svg += `<text x="${PAD}" y="${hy+11}" font-size="11"><tspan font-weight="700" fill="#334155">${escapeXml(label)}: </tspan><tspan fill="#0F172A">${escapeXml(val)}</tspan></text>`; hy += HDRLINE_H; });
    svg += `<text x="${PAD}" y="${hy+16}" font-size="11" fill="#94A3B8">— Không có dữ liệu nào cho PO này —</text></svg>`;
    return {svg, width:W, height:H};
  }

  const cols = buildPOGanttColumns(relevant);
  const dateGroups = groupGanttColsByDate(cols);
  const cpIndex = {};
  relevant.forEach(cp=>{ cpIndex[cp.section+'|'+cp.date+'|'+cp.shift] = cp; });
  const bySection = {};
  relevant.forEach(cp=>{ (bySection[cp.section]=bySection[cp.section]||[]).push(cp); });
  const presentSections = PROCESS_TIMELINE_ORDER.filter(id=>bySection[id] && bySection[id].length);

  const STICKY_W=190, COL_W=80, HDR_ROW_H=20, BAR_ROW_H=24, TXT_ROW_MIN_H=18, LINE_H=12;
  const FONT=10;
  const ctx = getMeasureCtx(FONT);
  const nCols = Math.max(cols.length,1);
  const gridW = STICKY_W + COL_W*nCols;
  const W = PAD*2 + gridW;
  const colTextW = COL_W - 10;

  const procRows = presentSections.map(id=>{
    const sec = sectionById(id);
    const list = bySection[id];
    let startIdx=-1, endIdx=-1;
    const issueCells = [], actionCells = [];
    cols.forEach((c,i)=>{
      const cp = cpIndex[id+'|'+c.date+'|'+c.shift];
      if(cp){ if(startIdx===-1) startIdx=i; endIdx=i; }
      const issueTxt = ganttCellText(cp, sec, 'issue');
      const actionTxt = ganttCellText(cp, sec, 'action');
      issueCells.push(issueTxt ? issueTxt.split('\n').flatMap(l=>wrapText(l, colTextW, FONT, ctx)) : []);
      actionCells.push(actionTxt ? actionTxt.split('\n').flatMap(l=>wrapText(l, colTextW, FONT, ctx)) : []);
    });
    const issueRowH = Math.max(TXT_ROW_MIN_H, Math.max(1, ...issueCells.map(l=>l.length))*LINE_H + 6);
    const actionRowH = Math.max(TXT_ROW_MIN_H, Math.max(1, ...actionCells.map(l=>l.length))*LINE_H + 6);
    return {id, sec, list, startIdx, endIdx, issueCells, actionCells, issueRowH, actionRowH};
  });

  const gridTop = PAD + TITLE_H + headerLines.length*HDRLINE_H + 12;
  const dateRowY = gridTop, shiftRowY = gridTop+HDR_ROW_H;
  let rowY = shiftRowY + HDR_ROW_H;
  procRows.forEach(pr=>{ pr.barY=rowY; rowY+=BAR_ROW_H; pr.issueY=rowY; rowY+=pr.issueRowH; pr.actionY=rowY; rowY+=pr.actionRowH; });
  const gridBottom = rowY;
  const H = gridBottom + PAD;
  const gx = PAD + STICKY_W;

  let svg = `<svg class="chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">`;
  svg += `<rect x="0" y="0" width="${W}" height="${H}" fill="#ffffff"/>`;
  svg += `<text x="${PAD}" y="${PAD+14}" font-size="14" font-weight="700" fill="#0B1220">ILD COFFEE VIETNAM — QUALITY &amp; ACTIVITIES FOLLOW UP</text>`;
  let hy = PAD+TITLE_H;
  headerLines.forEach(([label,val])=>{ svg += `<text x="${PAD}" y="${hy+11}" font-size="11"><tspan font-weight="700" fill="#334155">${escapeXml(label)}: </tspan><tspan fill="#0F172A">${escapeXml(val)}</tspan></text>`; hy += HDRLINE_H; });

  // Zebra nền theo từng Process — vẽ TRƯỚC lưới/chữ để không bị đè lên.
  procRows.forEach((pr,pi)=>{
    if(pi%2===1) svg += `<rect x="${PAD}" y="${pr.barY}" width="${gridW}" height="${pr.actionY+pr.actionRowH-pr.barY}" fill="#F8FAFC"/>`;
  });
  // Header đậm (Date gộp theo nhóm + Ca từng cột).
  svg += `<rect x="${PAD}" y="${dateRowY}" width="${gridW}" height="${HDR_ROW_H*2}" fill="#0B1220"/>`;
  svg += `<text x="${PAD+8}" y="${dateRowY+HDR_ROW_H+14}" font-size="10.5" font-weight="700" fill="#ffffff">Process / Information</text>`;
  let dgx = gx;
  dateGroups.forEach(g=>{
    const w = g.span*COL_W;
    svg += `<text x="${dgx+w/2}" y="${dateRowY+14}" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">${escapeXml(fmtDateVN(g.date))}</text>`;
    dgx += w;
  });
  cols.forEach((c,i)=>{
    svg += `<text x="${gx+i*COL_W+COL_W/2}" y="${shiftRowY+14}" font-size="10" fill="#ffffff" text-anchor="middle">Ca ${c.shift}</text>`;
  });
  // Lưới cột dọc xuyên suốt (canh đúng Date/Shift từng hàng bên dưới).
  for(let i=0;i<=cols.length;i++){
    const cx = gx+i*COL_W;
    svg += `<line x1="${cx}" y1="${dateRowY}" x2="${cx}" y2="${gridBottom}" stroke="#E2E8F0" stroke-width="1"/>`;
  }
  svg += `<line x1="${PAD}" y1="${dateRowY}" x2="${PAD}" y2="${gridBottom}" stroke="#CBD5E1" stroke-width="1"/>`;
  svg += `<line x1="${PAD+gridW}" y1="${dateRowY}" x2="${PAD+gridW}" y2="${gridBottom}" stroke="#CBD5E1" stroke-width="1"/>`;

  procRows.forEach(pr=>{
    svg += `<text x="${PAD+8}" y="${pr.barY+16}" font-size="10.5" font-weight="700" fill="#0B1220">${escapeXml(GANTT_PROCESS_LABELS[pr.id]||pr.id)}</text>`;
    svg += `<text x="${PAD+8}" y="${pr.issueY+12}" font-size="9.5" fill="#B45309">Issues/Abnormal</text>`;
    svg += `<text x="${PAD+8}" y="${pr.actionY+12}" font-size="9.5" fill="#15803D">Action</text>`;
    if(pr.startIdx>=0){
      const bx = gx+pr.startIdx*COL_W+3, bw = (pr.endIdx-pr.startIdx+1)*COL_W-6;
      svg += `<rect x="${bx}" y="${pr.barY+4}" width="${bw}" height="${BAR_ROW_H-8}" rx="5" fill="#0D9488"/>`;
    }
    cols.forEach((c,i)=>{
      const cx = gx+i*COL_W+4;
      let ty = pr.issueY+11;
      pr.issueCells[i].forEach(l=>{ svg += `<text x="${cx}" y="${ty}" font-size="9.5" fill="#7C3E00">${escapeXml(l)}</text>`; ty+=LINE_H; });
      let ay = pr.actionY+11;
      pr.actionCells[i].forEach(l=>{ svg += `<text x="${cx}" y="${ay}" font-size="9.5" fill="#15803D">${escapeXml(l)}</text>`; ay+=LINE_H; });
    });
    svg += `<line x1="${PAD}" y1="${pr.actionY+pr.actionRowH}" x2="${PAD+gridW}" y2="${pr.actionY+pr.actionRowH}" stroke="#CBD5E1" stroke-width="1"/>`;
  });

  svg += `</svg>`;
  return {svg, width:W, height:H};
}
function escapeXml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function svgToPngBlob(svgString, width, height, scale){
  scale = scale || 2.5; // higher-resolution export so images stay sharp when
                        // viewed/zoomed on high-density tablet/phone screens
  return new Promise((resolve,reject)=>{
    const svgBlob = new Blob([svgString], {type:'image/svg+xml;charset=utf-8'});
    const url = URL.createObjectURL(svgBlob);
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(width*scale); canvas.height = Math.round(height*scale);
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      URL.revokeObjectURL(url);
      canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('toBlob failed')), 'image/png');
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('SVG image load failed')); };
    img.src = url;
  });
}
/* ===================== PO PRODUCTION TIMELINE (xem trước tương tác) =====
   Bản xem trước HTML (không phải SVG) cho chế độ "Theo PO" ở tab Báo cáo —
   dùng DOM thật (không phải ảnh tĩnh) vì cần nút "✎ Sửa" cho Issue/Action
   ngay tại chỗ. Ảnh xuất (PNG/Chia sẻ) vẫn qua buildPOReportSVG như cũ;
   2 đường render này dùng CHUNG 1 nguồn dữ liệu (checkpoint gốc qua
   getIssueActionPairs/ITEM_CODE_LIST) nên luôn khớp nhau, chỉ khác cách vẽ. */
function buildIssueActionEditableList(sec, cp, onEdited){
  const wrap = el('div',{},[]);
  let editIdx = null; // số nguyên = đang sửa cặp đó, 'new' = đang thêm cặp mới, null = không sửa gì
  async function persistPairs(allPairs, changeLabel, before, after){
    cp.fields = cp.fields || {};

    wrap.appendChild(el('div',{class:'row', style:'margin-bottom:10px;'},[saveBtn, cancelBtn]));

  function draw(){
    wrap.innerHTML = '';
    const pairs = getIssueActionPairs(cp, sec);
    if(pairs.length===0 && editIdx!=='new'){
      wrap.appendChild(el('div',{class:'sub', style:'margin:4px 0 10px;'},['Không có Issue/Action nào được ghi nhận.']));
    }
    pairs.forEach((p, idx)=>{
      if(editIdx===idx){
        renderEditor(p, async (newIssue, newAction)=>{
          const before = {issue:p.issue||'', action:p.action||''};
          const allPairs = getIssueActionPairs(cp, sec);
          allPairs[idx] = {issue:newIssue, action:newAction};
          await persistPairs(allPairs, `Issue/Action #${idx+1}`, before, {issue:newIssue, action:newAction});
          editIdx = null;
          if(onEdited) onEdited(); else draw();
        });
      } else {
        const editBtn = el('button',{class:'btn ghost sm', type:'button'},['✎ Sửa']);
        editBtn.addEventListener('click', ()=>{ editIdx=idx; draw(); });
        const delBtn = el('button',{class:'btn danger sm', type:'button'},['🗑️ Xoá']);
        delBtn.addEventListener('click', async ()=>{
          if(!confirm('Xoá cặp Issue/Action này? Không thể hoàn tác.')) return;
          const before = {issue:p.issue||'', action:p.action||''};
          const allPairs = getIssueActionPairs(cp, sec);
          allPairs.splice(idx,1);
          await persistPairs(allPairs, `Issue/Action #${idx+1} (xoá)`, before, null);
          if(onEdited) onEdited(); else draw();
        });
        wrap.appendChild(el('div',{class:'grid g2', style:'margin-bottom:6px;'},[
          el('div',{},[el('div',{class:'sub', style:'margin:0 0 2px;font-weight:700;'},['Issue/Abnormal']), el('div',{style:'font-size:13px;white-space:pre-wrap;'},[p.issue||'—'])]),
          el('div',{},[el('div',{class:'sub', style:'margin:0 0 2px;font-weight:700;'},['Action']), el('div',{style:'font-size:13px;white-space:pre-wrap;'},[p.action||'—'])]),
        ]));
        wrap.appendChild(el('div',{class:'row', style:'margin-bottom:10px;'},[editBtn, delBtn]));
      }
    });
    if(editIdx==='new'){
      renderEditor({issue:'',action:''}, async (newIssue, newAction)=>{
        const allPairs = getIssueActionPairs(cp, sec);
        allPairs.push({issue:newIssue, action:newAction});
        await persistPairs(allPairs, `Issue/Action #${allPairs.length}`, null, {issue:newIssue, action:newAction});
        editIdx = null;
        if(onEdited) onEdited(); else draw();

      // Cho phép thêm Issue/Action ngay cả khi checkpoint này CHƯA có cặp
      // nào (VD: ô Gantt trống — Ngày+Ca chưa từng ghi Issue/Action) — cùng
      // 1 danh sách, không tạo cơ chế thêm mới riêng.
      const addBtn = el('button',{class:'btn ghost sm', type:'button'},['+ Thêm Issue/Action']);
      addBtn.addEventListener('click', ()=>{ editIdx='new'; draw(); });
      wrap.appendChild(addBtn);

function renderPOTimeline(container, poQuery, matches, onEdited){
  container.innerHTML = '';
  const relevant = matches.filter(cp=>cp.section!=='META');
  const withCode = relevant.find(cp=>cp.itemCode) || relevant[0];
  const lookup = withCode && withCode.itemCode ? lookupItemByCode(withCode.itemCode) : {status:'not_found'};
  const itemName = withCode && (lookup.status==='ok'||lookup.status==='missing_recipe') ? lookup.name : '';
  const recipeVal = withCode ? (withCode.recipe || (lookup.status==='ok' ? lookup.recipe : '')) : '';

  const hdr = el('div',{class:'card'},[
    el('div',{class:'card-h'},['QUALITY & ACTIVITIES FOLLOW UP', el('div',{class:'rule'})]),
    el('div',{class:'kv'},[el('span',{class:'k'},['ITEM CODE']), el('span',{class:'v'},[withCode ? (withCode.itemCode||'—') : '—'])]),
    el('div',{class:'kv'},[el('span',{class:'k'},['ITEM NAME']), el('span',{class:'v'},[itemName||'—'])]),
    el('div',{class:'kv'},[el('span',{class:'k'},['PO']), el('span',{class:'v'},[poQuery])]),
    el('div',{class:'kv'},[el('span',{class:'k'},['RECIPE']), el('span',{class:'v'},[recipeVal||'—'])]),
  ]);
  container.appendChild(hdr);
  if(relevant.length===0){
    container.appendChild(el('div',{class:'sub', style:'padding:16px;margin:0;'},['Không có dữ liệu.']));
    return;
  }

  const cols = buildPOGanttColumns(relevant);
  const dateGroups = groupGanttColsByDate(cols);
  const cpIndex = {};
  relevant.forEach(cp=>{ cpIndex[cp.section+'|'+cp.date+'|'+cp.shift] = cp; });
  const bySection = {};
  relevant.forEach(cp=>{ (bySection[cp.section]=bySection[cp.section]||[]).push(cp); });
  const presentSections = PROCESS_TIMELINE_ORDER.filter(id=>bySection[id] && bySection[id].length);

  const scrollWrap = el('div',{class:'tablescroll', style:'margin-top:10px;'},[]);
  const table = el('table',{class:'gantt-table'},[]);
  scrollWrap.appendChild(table);
  container.appendChild(scrollWrap);

  const thead = el('thead',{},[]);
  const dateRow = el('tr',{},[el('th',{class:'gantt-sticky'},['Process / Information'])]);
  dateGroups.forEach(g=>dateRow.appendChild(el('th',{colspan:String(g.span)},[fmtDateVN(g.date)])));
  const shiftRow = el('tr',{},[el('th',{class:'gantt-sticky'},[''])]);
  cols.forEach(c=>shiftRow.appendChild(el('th',{},[`Ca ${c.shift}`])));
  thead.appendChild(dateRow); thead.appendChild(shiftRow);
  table.appendChild(thead);

  const tbody = el('tbody',{},[]);
  table.appendChild(tbody);

  function openEditModal(cp, sec, titleText){
    const body = el('div',{},[]);
    let modalRef = null;
    const editList = buildIssueActionEditableList(sec, cp, ()=>{ if(modalRef) modalRef.close(); if(onEdited) onEdited(); });
    body.appendChild(el('div',{class:'sub', style:'margin:0 0 10px;'},[`QC: ${cp.technician||'—'}`]));
    body.appendChild(editList);
    modalRef = openModal(titleText, body);
  }

  presentSections.forEach((id,pi)=>{
    const sec = sectionById(id);
    const list = bySection[id];
    let startIdx=-1, endIdx=-1;
    cols.forEach((c,i)=>{ if(list.some(cp=>cp.date===c.date && cp.shift===c.shift)){ if(startIdx===-1) startIdx=i; endIdx=i; } });
    const altCls = pi%2===1 ? ' alt' : '';

    const barRow = el('tr',{class:altCls.trim()},[el('th',{class:'gantt-sticky'},[GANTT_PROCESS_LABELS[id]||id])]);
    cols.forEach((c,i)=>{
      if(i===startIdx){
        barRow.appendChild(el('td',{colspan:String(endIdx-startIdx+1), class:'gantt-bar-cell'},[el('div',{class:'gantt-bar'},[])]));
      } else if(i>startIdx && i<=endIdx){
        // đã gộp vào ô colspan phía trên (thanh Gantt liên tục), bỏ qua.
      } else {
        barRow.appendChild(el('td',{class:'gantt-empty'},[]));
      }
    });
    tbody.appendChild(barRow);

    const issueRow = el('tr',{class:altCls.trim()},[el('th',{class:'gantt-sticky sub-label'},['Issues/Abnormal'])]);
    const actionRow = el('tr',{class:altCls.trim()},[el('th',{class:'gantt-sticky sub-label'},['Action'])]);
    cols.forEach(c=>{
      const existingCp = cpIndex[id+'|'+c.date+'|'+c.shift];
      const issueTxt = ganttCellText(existingCp, sec, 'issue');
      const actionTxt = ganttCellText(existingCp, sec, 'action');
      // Mọi ô đều bấm được, kể cả Ngày+Ca chưa có checkpoint nào — bấm vào
      // sẽ lấy/tạo đúng checkpoint (getOrInitCheckpoint, giống hệt cơ chế
      // Input tab) cho đúng Process+Ngày+Ca+PO đang xem; checkpoint mới chỉ
      // thực sự ghi xuống IndexedDB khi người dùng bấm "💾 Lưu" ít nhất 1
      // cặp Issue/Action (xem buildIssueActionEditableList) — chỉ mở modal
      // không lưu gì thì không tạo ra bản ghi trống nào.
      const issueCell = el('td',{class:'gantt-cell clickable'},[issueTxt||'']);
      const actionCell = el('td',{class:'gantt-cell clickable'},[actionTxt||'']);
      const titleText = `${GANTT_PROCESS_LABELS[id]||id} — ${fmtDateVN(c.date)} Ca ${c.shift}`;
      const openThisCell = ()=>openEditModal(getOrInitCheckpoint(c.date, c.shift, id, poQuery), sec, titleText);
      issueCell.addEventListener('click', openThisCell);
      actionCell.addEventListener('click', openThisCell);
      issueRow.appendChild(issueCell);
      actionRow.appendChild(actionCell);
    });
    tbody.appendChild(issueRow);
    tbody.appendChild(actionRow);
  });
}

    if(noQmsConfigured && !confirm('Chưa có chỉ tiêu nào được đánh dấu "Xuất trong báo cáo QMS" ở tab Specs, nên file xuất ra sẽ chỉ có phần MAIN INFORMATION (Date/Shift/Process/Item Code/PO/ISSUES/ACTION), thiếu hẳn các cột QMS (Moisture, Color, %TC...). Vào tab Specs → sửa từng chỉ tiêu → tick "Xuất trong báo cáo QMS" trước rồi quay lại đây. Vẫn xuất luôn (chỉ có MAIN INFORMATION)?')) return;
    if(subset.length===0){ toast('Không có điểm kiểm tra nào khớp Ngày/Ca/Công đoạn đã chọn'); return; }
    // Ở chế độ Theo PO, cả Excel lẫn PDF theo mẫu giờ có thêm 1 bảng Gantt
    // Process x Date x Shift (giống hệt khung xem trước ở trên) — dùng lại
    // đúng `subset` (đã lọc bỏ META) làm dữ liệu, không xuất thêm gì ngoài
    // phạm vi đang xem. Theo ca không có khái niệm "PO đang xem" nên không
    // có Gantt (giữ nguyên hành vi cũ).
    const gantt = mode==='po' ? { poLabel: currentGen().poQuery || '', matches: subset } : null;
    if(kind==='xlsx'){
      const file = new File([buildProcessQmsExcelXml(subset, gantt)], `Shiftly_ProcessQMS_${todayStr()}.xls`, {type:'application/vnd.ms-excel'});
      await exportFileToPreferredLocation(file, {title:'Shiftly Process/QMS', fallbackMsg:`Đã tải Excel theo mẫu (${subset.length} điểm kiểm tra) về máy`});
    } else {
      // Bảng QMS ở chế độ Theo PO thường có nhiều cột hơn (PO có thể chạy
      // qua nhiều Công đoạn, mỗi Công đoạn 1 khối cột QMS riêng) — in khổ
      // ngang (Landscape) cho dễ đọc hơn khổ dọc mặc định. Theo ca giữ
      // nguyên khổ dọc như cũ (không đổi gì ở đó).
      printReport(buildProcessQmsPrintHtml(subset, mode==='po', gantt), `Shiftly_ProcessQMS_${todayStr()}`);
    }
  }
  qmsXlsxBtn.addEventListener('click', ()=>exportQmsTemplate('xlsx'));
  qmsPdfBtn.addEventListener('click', ()=>exportQmsTemplate('pdf'));
}
