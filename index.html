// Ghi đè LSL/LCL/UCL/USL theo Recipe cho 1 chỉ tiêu kiểu Số — tách riêng
// khỏi bảng chính (renderSpecs) vì đây là 1 bảng con lồng bên trong, mở ra
// khi bấm nút "🧬 Ghi đè" ở dòng tương ứng. Tự lưu ngay khi đổi (không có
// nút "Lưu" riêng), khớp triết lý sửa-tới-đâu-lưu-tới-đó của bảng chính.
function buildRecipeOverrideEditor(f){
  const wrap = el('div',{class:'card', style:'padding:12px 14px;background:#F8FAFC;'},[
    el('div',{class:'card-h'},[`Ghi đè theo Recipe — ${f.label.split('\n')[0]}`, el('div',{class:'rule'})]),
  ]);
  if(f.type!=='number'){
    wrap.appendChild(el('div',{class:'sub', style:'margin:0;'},['Chỉ áp dụng cho chỉ tiêu kiểu Số.']));
    return wrap;
  }
  let overrideRows = f.recipeOverrides ? Object.keys(f.recipeOverrides).map(r=>({recipe:r, ...f.recipeOverrides[r]})) : [];
  async function persist(){
    if(overrideRows.length){
      f.recipeOverrides = {};
      overrideRows.forEach(r=>{
        if(!r.recipe) return;
        const o = {};
        if(r.hardMin!=null) o.hardMin=r.hardMin; if(r.tMin!=null) o.tMin=r.tMin; if(r.tMax!=null) o.tMax=r.tMax; if(r.hardMax!=null) o.hardMax=r.hardMax;
        f.recipeOverrides[r.recipe] = o;
      });
    } else {
      delete f.recipeOverrides;
    }
    await saveSchema();
  }
  const overrideList = el('div',{},[]);
  function renderOverrides(){
    overrideList.innerHTML = '';
    if(overrideRows.length===0){
      overrideList.appendChild(el('div',{class:'sub', style:'margin:0 0 6px;'},['Chưa có ghi đè nào.']));
    }
    overrideRows.forEach((row,idx)=>{
      const rAC = renderAutocomplete(row.recipe, allKnownRecipes(), 'VD: 405', async (v)=>{ row.recipe = v; await persist(); });
      const mkNum = (key)=>{ const inp = el('input',{class:'inp num', type:'text', inputmode:'decimal', placeholder:'—'},[]); if(row[key]!=null) inp.value=row[key]; inp.addEventListener('change', async ()=>{ row[key]=toNum(inp.value); await persist(); }); return inp; };
      const rmBtn = el('button',{class:'btn danger sm', type:'button'},['🗑']);
      rmBtn.addEventListener('click', async ()=>{ overrideRows.splice(idx,1); renderOverrides(); await persist(); });
      overrideList.appendChild(el('div',{class:'overriderow'},[
        rAC.node, mkNum('hardMin'), mkNum('tMin'), mkNum('tMax'), mkNum('hardMax'), rmBtn,
      ]));
    });
  }
  renderOverrides();
  const addOverrideBtn = el('button',{class:'btn ghost sm', type:'button', style:'margin-top:6px;'},['➕ Thêm ghi đè theo Recipe']);
  addOverrideBtn.addEventListener('click', async ()=>{ overrideRows.push({recipe:allKnownRecipes()[0]||'', hardMin:null,tMin:null,tMax:null,hardMax:null}); renderOverrides(); await persist(); });
  wrap.appendChild(el('div',{class:'overriderow overriderow-hdr'},[
    el('span',{},['Recipe']), el('span',{},['LSL']), el('span',{},['LCL']), el('span',{},['UCL']), el('span',{},['USL']), el('span',{},['']),
  ]));
  wrap.appendChild(overrideList);
  wrap.appendChild(addOverrideBtn);
  return wrap;
}
// "Thêm chỉ tiêu" popup for the Specs tab — replaces the old inline add-row.
// Captures the full type-conditional field config up front (Giới hạn/Lựa
// chọn/Nhãn Đạt-Lỗi/Bắt buộc/QMS) instead of just Tên+Loại, so a new chỉ
// tiêu rarely needs a second trip through the table's inline-edit cells.
function openAddSpecModal(sec, onAdded){
  const body = el('div',{});
  const labelInp = el('textarea',{class:'inp', rows:'2', placeholder:'Tên chỉ tiêu (dòng 1) — có thể thêm dòng mô tả bên dưới'});
  body.appendChild(el('label',{class:'fld'},[el('span',{class:'lab'},['Tên chỉ tiêu *']), labelInp]));

  const typeSel = el('select',{class:'inp'},[]);
  SPEC_TYPE_OPTIONS.forEach(o=>typeSel.appendChild(el('option',{value:o.value},[o.label])));
  typeSel.value = 'number';
  body.appendChild(el('label',{class:'fld', style:'margin-top:10px;'},[el('span',{class:'lab'},['Loại *']), typeSel]));

  const mkNumInp = (ph) => el('input',{class:'inp num', type:'text', inputmode:'decimal', placeholder:ph, style:'padding:9px 8px;font-size:13px;min-height:40px;'});
  const hardMinInp = mkNumInp('LSL'), tMinInp = mkNumInp('LCL'), tMaxInp = mkNumInp('UCL'), hardMaxInp = mkNumInp('USL');
  const numberBox = el('div',{style:'margin-top:10px;', 'data-box':'number'},[
    el('span',{class:'lab'},['Giới hạn: LSL / LCL / UCL / USL']),
    el('div',{style:'display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:5px;'},[hardMinInp, tMinInp, tMaxInp, hardMaxInp]),
  ]);
  body.appendChild(numberBox);

  const trueLabelInp = el('input',{class:'inp', type:'text', placeholder:'Đạt'});
  const falseLabelInp = el('input',{class:'inp', type:'text', placeholder:'Lỗi'});
  const boolBox = el('div',{style:'margin-top:10px;', 'data-box':'boolean'},[
    el('span',{class:'lab'},['Nhãn Đạt / Lỗi']),
    el('div',{style:'display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:5px;'},[trueLabelInp, falseLabelInp]),
  ]);
  body.appendChild(boolBox);

  const requiredCb = el('input',{type:'checkbox'});
  const allowNoteCb = el('input',{type:'checkbox'});
  const allowNegativeCb = el('input',{type:'checkbox'});
  const negLabel = el('label',{style:'display:flex;align-items:center;gap:6px;'},[allowNegativeCb, '± Số âm']);
  const flagsRow = el('div',{style:'display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:13.5px;'},[
    el('label',{style:'display:flex;align-items:center;gap:6px;'},[requiredCb, 'Bắt buộc']),
    el('label',{style:'display:flex;align-items:center;gap:6px;'},[allowNoteCb, 'Cho phép ghi chú']),
    negLabel,
  ]);
  body.appendChild(flagsRow);

  const qmsCb = el('input',{type:'checkbox'});
  const qmsLabelInp = el('input',{class:'inp', type:'text', placeholder:'Tên cột khi xuất (để trống = dùng tên chỉ tiêu)', style:'margin-top:8px;display:none;'});
  const qmsBox = el('div',{style:'margin-top:10px;'},[
    el('label',{style:'display:flex;align-items:center;gap:6px;font-size:13.5px;'},[qmsCb, 'Hiển thị trong báo cáo QMS ở tab Báo cáo']),
    qmsLabelInp,
  ]);
  qmsCb.addEventListener('change', ()=>{ qmsLabelInp.style.display = qmsCb.checked ? '' : 'none'; });
  body.appendChild(qmsBox);

  const optionsInp = el('textarea',{class:'inp', rows:'3', placeholder:'Mỗi dòng 1 lựa chọn'});
  const optionsBox = el('div',{style:'margin-top:10px;', 'data-box':'select'},[
    el('span',{class:'lab'},['Lựa chọn (Danh sách) — mỗi dòng 1 lựa chọn']),
    el('div',{style:'margin-top:5px;'},[optionsInp]),
  ]);
  body.appendChild(optionsBox);

  function syncVisibility(){
    const t = typeSel.value;
    numberBox.style.display = t==='number' ? '' : 'none';
    negLabel.style.display = t==='number' ? '' : 'none';
    boolBox.style.display = t==='boolean' ? '' : 'none';
    optionsBox.style.display = t==='select' ? '' : 'none';
  }
  typeSel.addEventListener('change', syncVisibility);
  syncVisibility();

  const foot = el('div',{class:'modal-foot'},[]);
  const cancelBtn = el('button',{class:'btn ghost', type:'button'},['Huỷ']);
  const submitBtn = el('button',{class:'btn teal', type:'button'},['➕ Thêm chỉ tiêu']);
  foot.appendChild(cancelBtn); foot.appendChild(submitBtn);
  body.appendChild(foot);

  const modal = openModal('Thêm chỉ tiêu — '+sec.name, body);
  cancelBtn.addEventListener('click', ()=>modal.close());

  submitBtn.addEventListener('click', async ()=>{
    const label = labelInp.value.trim();
    if(!label){ toast('Cần nhập tên chỉ tiêu'); return; }
    const type = typeSel.value;
    const f = {id: newFieldId(sec.id), label, type, required: requiredCb.checked, allowNote: allowNoteCb.checked, isQMS: qmsCb.checked};
    if(qmsCb.checked && qmsLabelInp.value.trim()) f.qmsLabel = qmsLabelInp.value.trim();
    if(type==='number'){
      if(allowNegativeCb.checked) f.allowNegative = true;
      const hardMin=toNum(hardMinInp.value), tMin=toNum(tMinInp.value), tMax=toNum(tMaxInp.value), hardMax=toNum(hardMaxInp.value);
      if(hardMin!=null) f.hardMin=hardMin; if(tMin!=null) f.tMin=tMin; if(tMax!=null) f.tMax=tMax; if(hardMax!=null) f.hardMax=hardMax;
    } else if(type==='boolean'){
      if(trueLabelInp.value.trim()) f.trueLabel = trueLabelInp.value.trim();
      if(falseLabelInp.value.trim()) f.falseLabel = falseLabelInp.value.trim();
    } else if(type==='select'){
      f.options = optionsInp.value.split('\n').map(s=>s.trim()).filter(Boolean);
    }
    sec.fields.push(f);
    await saveSchema();
    toast('Đã thêm chỉ tiêu');
    modal.close();
    onAdded();
  });
}
function renderSpecs(){
  const root = qs('#view-specs');
  root.innerHTML = '';
  root.appendChild(el('div',{class:'section-title'},['Specs — Chỉ tiêu & Giới hạn']));
  root.appendChild(el('div',{class:'sub', style:'margin-top:-10px;'},['Thêm / sửa / xoá chỉ tiêu kiểm tra cho từng công đoạn. Thay đổi có hiệu lực ngay ở tab Nhập liệu, Dữ liệu và cột CSV.']));
  root.appendChild(el('div',{class:'sub', style:'margin:6px 0 14px;'},['FAIL: ngoài LSL–USL · CONDITIONAL: giữa Control (LCL–UCL) và Spec (LSL–USL) · PASS: trong LCL–UCL. Bỏ trống ô nào thì ranh giới đó không áp dụng.']));

  const syncCard = el('div',{class:'card'},[
    el('div',{class:'card-h'},['Sao lưu / Đồng bộ cấu hình Specs giữa nhiều tablet', el('div',{class:'rule'})]),
    el('p',{class:'sub', style:'margin:0 0 10px;'},['Cấu hình chỉ tiêu (Specs) lưu riêng trên từng máy. Nếu dùng nhiều tablet, xuất file này từ máy đã chỉnh xong rồi nhập vào các máy khác để đồng bộ — file này KHÔNG chứa dữ liệu ca, chỉ chứa danh sách chỉ tiêu & giới hạn.']),
    el('div',{class:'row'},[
      el('button',{class:'btn ghost sm', id:'btnExportSpecs'},['⬇️ Xuất cấu hình Specs (JSON)']),
      el('button',{class:'btn ghost sm', id:'btnExportSpecsXlsx'},['📊 Xuất Excel Specs']),
      el('label',{class:'btn ghost sm', style:'position:relative;'},['⬆️ Nhập cấu hình Specs (JSON)',
        el('input',{type:'file', accept:'.json', id:'importSpecsInput', style:'position:absolute;inset:0;opacity:0;cursor:pointer;'})
      ]),
    ]),
    el('p',{class:'sub', style:'margin:10px 0 0;'},['File JSON dùng để đồng bộ/nhập lại vào app (mục "⬆️ Nhập cấu hình Specs" ở trên). File Excel chỉ để xem/in/lưu hồ sơ — không nhập lại được vào app.']),
  ]);
  root.appendChild(syncCard);
  qs('#btnExportSpecs', syncCard).addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(SCHEMA, null, 2)], {type:'application/json'});
    downloadBlob(blob, `Shiftly_Specs_${todayStr()}.json`);
    toast('Đã xuất cấu hình Specs');
  });
  qs('#btnExportSpecsXlsx', syncCard).addEventListener('click', async ()=>{
    const xml = buildSpecsExcelXml();
    const file = new File([xml], `Shiftly_Specs_${todayStr()}.xls`, {type:'application/vnd.ms-excel'});
    await exportFileToPreferredLocation(file, {title:'Shiftly Specs', fallbackMsg:'Đã tải Excel cấu hình Specs về máy'});
  });
  qs('#importSpecsInput', syncCard).addEventListener('change', async (e)=>{
    const file = e.target.files[0]; if(!file) return;
    try{
      const text = await file.text();
      const incoming = JSON.parse(text);
      if(!Array.isArray(incoming) || !incoming.every(s=>s && s.id && Array.isArray(s.fields))){
        toast('File không đúng định dạng cấu hình Specs'); return;
      }
      const ok = confirm(`Nhập cấu hình Specs từ file này sẽ THAY THẾ toàn bộ ${SCHEMA.length} nhóm chỉ tiêu hiện tại bằng ${incoming.length} nhóm trong file. Dữ liệu các ca đã lưu không bị ảnh hưởng. Tiếp tục?`);
      if(!ok){ e.target.value=''; return; }
      SCHEMA = incoming;
      await saveSchema();
      if(!stageIds().includes(currentStage)) currentStage = stageIds()[0];
      toast('Đã nhập cấu hình Specs mới');
      renderSpecs();
    }catch(err){ console.error(err); toast('File JSON không hợp lệ'); }
  });

  function specMiniNumInput(value, onCommit){
    const inp = el('input',{class:'inp num', type:'text', inputmode:'decimal', placeholder:'—', style:'min-width:0;padding:5px 6px;font-size:11.5px;min-height:30px;'});
    if(value!=null) inp.value = value;
    inp.addEventListener('blur', async ()=>{ await onCommit(toNum(inp.value)); });
    return inp;
  }
  function specMiniTextInput(value, placeholder, onCommit){
    const inp = el('input',{class:'inp', type:'text', placeholder: placeholder||'', style:'min-width:0;padding:5px 6px;font-size:11.5px;min-height:30px;'});
    inp.value = value||'';
    inp.addEventListener('blur', async ()=>{ await onCommit(inp.value.trim()); });
    return inp;
  }

  renderSpecs._tableState = renderSpecs._tableState || {};
  renderSpecs._overrideOpen = renderSpecs._overrideOpen || {};

  SCHEMA.forEach(sec=>{
    const addBtn = el('button',{class:'btn teal sm', type:'button', style:'width:auto;'},['➕ Thêm chỉ tiêu']);
    const card = el('div',{class:'card'},[
      el('div',{class:'card-h'},[sec.name+` (${sec.fields.length})`, el('div',{class:'rule'}), addBtn]),
    ]);
    root.appendChild(card);

    renderSpecs._tableState[sec.id] = renderSpecs._tableState[sec.id] || {filters:{}, sort:{key:null,dir:null}};
    const overridePanelSlot = el('div',{style:'margin-top:12px;'},[]);
    function refreshOverridePanel(){
      overridePanelSlot.innerHTML = '';
      const openId = renderSpecs._overrideOpen[sec.id];
      if(!openId) return;
      const f = sec.fields.find(x=>x.id===openId);
      if(!f) return;
      overridePanelSlot.appendChild(buildRecipeOverrideEditor(f));
    }

    function rebuildSection(){ renderSpecs(); }
    addBtn.addEventListener('click', ()=>openAddSpecModal(sec, rebuildSection));

    const table = buildEditableTable({
      state: renderSpecs._tableState[sec.id],
      tableClass: 'specs-table',
      rows: sec.fields.map((f,idx)=>({f, idx})),
      emptyText: 'Chưa có chỉ tiêu nào trong công đoạn này — bấm "➕ Thêm chỉ tiêu" ở trên.',
      columns: [
        {
          key:'label', label:'Tên chỉ tiêu', sortable:true, filter:'text', type:'textarea', rows:'2',
          get: row=>row.f.label,
          sortVal: row=>row.f.label.split('\n')[0],
          filterVal: row=>row.f.label,
          set: async (row, val) => {
            if(!val.trim()){ toast('Cần nhập tên chỉ tiêu'); return false; }
            row.f.label = val;
            await saveSchema();
          },
        },
        {
          key:'type', label:'Loại', sortable:true,
          filter:{type:'multi', options:SPEC_TYPE_OPTIONS},
          filterVal: row=>row.f.type, sortVal: row=>row.f.type,
          type:'select', options:SPEC_TYPE_OPTIONS,
          get: row=>row.f.type,
          set: async (row, val) => {
            if(val===row.f.type) return;
            clearSpecTypeSpecificProps(row.f);
            row.f.type = val;
            await saveSchema();
            rebuildSection();
          },
        },
        {
          key:'limits', label:'Giới hạn (Số): LSL / LCL / UCL / USL',
          render: row => {
            const f = row.f;
            if(f.type!=='number') return el('span',{class:'sub', style:'margin:0;'},['— (chỉ áp dụng cho Loại Số)']);
            const wrap = el('div',{style:'display:grid;grid-template-columns:repeat(4,1fr);gap:4px;min-width:190px;'});
            wrap.appendChild(specMiniNumInput(f.hardMin, async v=>{ if(v==null) delete f.hardMin; else f.hardMin=v; await saveSchema(); }));
            wrap.appendChild(specMiniNumInput(f.tMin, async v=>{ if(v==null) delete f.tMin; else f.tMin=v; await saveSchema(); }));
            wrap.appendChild(specMiniNumInput(f.tMax, async v=>{ if(v==null) delete f.tMax; else f.tMax=v; await saveSchema(); }));
            wrap.appendChild(specMiniNumInput(f.hardMax, async v=>{ if(v==null) delete f.hardMax; else f.hardMax=v; await saveSchema(); }));
            return wrap;
          },
        },
        {
          key:'boolLabels', label:'Nhãn Đạt / Lỗi',
          render: row => {
            const f = row.f;
            if(f.type!=='boolean') return el('span',{class:'sub', style:'margin:0;'},['—']);
            const wrap = el('div',{style:'display:grid;grid-template-columns:1fr 1fr;gap:4px;min-width:130px;'});
            wrap.appendChild(specMiniTextInput(f.trueLabel, 'Đạt', async v=>{ if(v) f.trueLabel=v; else delete f.trueLabel; await saveSchema(); }));
            wrap.appendChild(specMiniTextInput(f.falseLabel, 'Lỗi', async v=>{ if(v) f.falseLabel=v; else delete f.falseLabel; await saveSchema(); }));
            return wrap;
          },
        },
        {
          key:'flags', label:'Bắt buộc / Ghi chú / ±Âm', sortable:true,
          filter:{type:'multi', options:[{value:'yes',label:'Bắt buộc'},{value:'no',label:'Không bắt buộc'}]},
          filterVal: row=> row.f.required ? 'yes' : 'no',
          sortVal: row=> row.f.required?1:0,
          render: row => {
            const f = row.f;
            const wrap = el('div',{style:'display:flex;flex-direction:column;gap:4px;font-size:11.5px;min-width:115px;'});
            const mk = (checked, labelTxt, onCommit) => {
              const cb = el('input',{type:'checkbox'}); cb.checked = !!checked;
              cb.addEventListener('change', async ()=>{ onCommit(cb.checked); await saveSchema(); });
              return el('label',{style:'display:flex;align-items:center;gap:6px;'},[cb, labelTxt]);
            };
            wrap.appendChild(mk(f.required, 'Bắt buộc', v=>{ f.required=v; }));
            wrap.appendChild(mk(f.allowNote, 'Ghi chú', v=>{ f.allowNote=v; }));
            if(f.type==='number') wrap.appendChild(mk(f.allowNegative, '± Số âm', v=>{ f.allowNegative=v; }));
            return wrap;
          },
        },
        {
          key:'qms', label:'QMS (báo cáo QMS ở tab Báo cáo)',
          sortable:true, sortVal: row=> row.f.isQMS?1:0,
          filter:{type:'multi', options:[{value:'yes',label:'Có QMS'},{value:'no',label:'Không QMS'}]},
          filterVal: row=> row.f.isQMS ? 'yes' : 'no',
          render: row => {
            const f = row.f;
            const wrap = el('div',{style:'display:flex;flex-direction:column;gap:4px;min-width:150px;'});
            const cb = el('input',{type:'checkbox'}); cb.checked = !!f.isQMS;
            const nameInp = specMiniTextInput(f.qmsLabel, 'Tên cột khi xuất', async v=>{ if(v) f.qmsLabel=v; else delete f.qmsLabel; await saveSchema(); });
            nameInp.style.display = f.isQMS ? '' : 'none';
            cb.addEventListener('change', async ()=>{ f.isQMS = cb.checked; nameInp.style.display = cb.checked?'':'none'; await saveSchema(); });
            wrap.appendChild(el('label',{style:'display:flex;align-items:center;gap:6px;font-size:11.5px;'},[cb, 'Xuất QMS']));
            wrap.appendChild(nameInp);
            return wrap;
          },
        },
        {
          key:'options', label:'Lựa chọn (Danh sách) — mỗi dòng 1 lựa chọn', type:'textarea', rows:'2',
          filter:'text',
          filterVal: row=> row.f.type==='select' ? (row.f.options||[]).join(' ') : '',
          get: row=> row.f.type==='select' ? (row.f.options||[]).join('\n') : '',
          set: async (row, val) => {
            if(row.f.type!=='select') return false;
            row.f.options = val.split('\n').map(s=>s.trim()).filter(Boolean);
            await saveSchema();
          },
        },
      ],
      renderActions: row => {
        const f = row.f, idx = row.idx;
        const upBtn = el('button',{class:'rowbtn'},['▲']);
        if(idx===0) upBtn.disabled = true;
        upBtn.addEventListener('click', async ()=>{
          if(idx===0) return;
          [sec.fields[idx-1], sec.fields[idx]] = [sec.fields[idx], sec.fields[idx-1]];
          await saveSchema();
          rebuildSection();
        });
        const downBtn = el('button',{class:'rowbtn'},['▼']);
        if(idx===sec.fields.length-1) downBtn.disabled = true;
        downBtn.addEventListener('click', async ()=>{
          if(idx===sec.fields.length-1) return;
          [sec.fields[idx+1], sec.fields[idx]] = [sec.fields[idx], sec.fields[idx+1]];
          await saveSchema();
          rebuildSection();
        });
        const ovLabel = `🧬 Ghi đè${f.recipeOverrides && Object.keys(f.recipeOverrides).length ? ` (${Object.keys(f.recipeOverrides).length})` : ''}`;
        const ovBtn = el('button',{class:'rowbtn', style: f.type!=='number' ? 'opacity:.4;' : ''},[ovLabel]);
        ovBtn.addEventListener('click', ()=>{
          if(f.type!=='number'){ toast('Ghi đè theo Recipe chỉ áp dụng cho chỉ tiêu kiểu Số.'); return; }
          renderSpecs._overrideOpen[sec.id] = (renderSpecs._overrideOpen[sec.id]===f.id) ? null : f.id;
          refreshOverridePanel();
        });
        const delBtn = el('button',{class:'rowbtn del'},['🗑️']);
        delBtn.addEventListener('click', async ()=>{
          if(confirm(`Xoá chỉ tiêu "${f.label.split('\n')[0]}"? Dữ liệu đã lưu trước đó của chỉ tiêu này sẽ không còn hiện trong form (vẫn còn trong CSV cũ).`)){
            sec.fields = sec.fields.filter(x=>x.id!==f.id);
            if(renderSpecs._overrideOpen[sec.id]===f.id) renderSpecs._overrideOpen[sec.id] = null;
            await saveSchema();
            rebuildSection();
          }
        });
        return [upBtn, downBtn, ovBtn, delBtn];
      },
      selectable: true,
      rowKey: row => row.f.id,
      // Xoá hàng loạt là hành động phá huỷ trên cấu hình dùng chung cho mọi
      // tablet — bắt buộc mật khẩu Admin (APP_PASSWORD, giống Force sửa/xoá
      // dữ liệu ca ở tab Dữ liệu) sau bước xác nhận thường, không chỉ 1 nút.
      onBulkDelete: async (selectedRows) => {
        const labels = selectedRows.map(r=>r.f.label.split('\n')[0]);
        if(!confirm(`Xoá ${selectedRows.length} chỉ tiêu đã chọn?\n- ${labels.join('\n- ')}\n\nDữ liệu đã lưu trước đó của các chỉ tiêu này sẽ không còn hiện trong form (vẫn còn trong CSV cũ). Không thể hoàn tác.`)) return false;
        if(!promptPasswordOK('Nhập mật khẩu Admin để xác nhận xoá nhiều chỉ tiêu:')) return false;
        const idsToDelete = new Set(selectedRows.map(r=>r.f.id));
        sec.fields = sec.fields.filter(x=>!idsToDelete.has(x.id));
        if(idsToDelete.has(renderSpecs._overrideOpen[sec.id])) renderSpecs._overrideOpen[sec.id] = null;
        renderSpecs._tableState[sec.id].selected.clear();
        await saveSchema();
        toast(`Đã xoá ${selectedRows.length} chỉ tiêu`);
        rebuildSection();
        return true;
      },
    });
    card.appendChild(table);
    card.appendChild(overridePanelSlot);
    refreshOverridePanel();
  });
}

function weekRangeOf(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const day = d.getDay();
  const diffToMonday = (day===0 ? -6 : 1-day);
  const monday = new Date(d); monday.setDate(d.getDate()+diffToMonday);
  const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
  const fmt = x=>{ const p=n=>String(n).padStart(2,'0'); return `${x.getFullYear()}-${p(x.getMonth()+1)}-${p(x.getDate())}`; };
  return [fmt(monday), fmt(sunday)];
}

    cp.images = cp.images || [];
    let n=0, skipped=0;
    for(const file of Array.from(files)){
      if(cp.images.length >= MAX_IMAGES_PER_CHECKPOINT){ skipped++; continue; }
      try{
        const dataUrl = await compressImageFile(file, 1280, 0.72);

      }catch(err){ console.error(err); }

    await refreshCache();

    toast(`Đã đính kèm ${n} ảnh vào ${sectionById(secId).name} — PO ${poV} — Ca ${shiftV} ngày ${fmtDateVN(dateV)}`+(skipped>0?` — bỏ qua ${skipped} ảnh vì đã đạt tối đa ${MAX_IMAGES_PER_CHECKPOINT} ảnh`:''));
    e.target.value = '';
  });
}

/* ===================== ADMIN — MEMBER MANAGEMENT =====================
   Talks to the Worker's /admin/users route (cloudflare/src/worker.js) —
   never the database directly — since creating/disabling accounts needs the
   service_role key, which must never reach the browser (see that function's
   own comments). Only rendered for a verified Admin (see renderSettings). */
async function adminUsersCall(action, params){
  const token = await currentAccessToken();
  if(!token) return {error:'Chưa đăng nhập'};
  try{
    const res = await fetch(cloudCfg.url + '/admin/users', {
      method:'POST',
      headers:{'Content-Type':'application/json', 'Authorization':'Bearer '+token},
      body: JSON.stringify(Object.assign({action}, params||{})),
      signal: AbortSignal.timeout(20000),
    });
    let body = {}; try{ body = await res.json(); }catch(e){}
    if(!res.ok) return {error: body.error || ('HTTP '+res.status)};
    return body;
  }catch(e){ return {error:'Không gọi được máy chủ quản lý tài khoản (kiểm tra mạng / địa chỉ máy chủ)'}; }
}

    el('label',{class:'fld', style:'margin-top:10px;'},[el('span',{class:'lab'},['Tên đăng nhập / Email']), userOrEmailInp]),
    el('label',{class:'fld', style:'margin-top:10px;'},[el('span',{class:'lab'},['Mật khẩu']), passInp]),
    createErr, createBtn,
  ]);
  loginModeSel.addEventListener('change', ()=>{ userOrEmailInp.placeholder = loginModeSel.value==='email' ? 'Email' : 'Tên đăng nhập (chữ thường, không dấu)'; });
  async function refreshList(){
    const res = await adminUsersCall('list-users');
    listBox.innerHTML = '';
    if(res.error){ listBox.appendChild(el('p',{class:'sub', style:'color:var(--fail);'},[res.error])); return; }
    (res.users||[]).forEach(u=>{
      const info = ROLE_INFO[u.role] || ROLE_INFO.user;
      const row = el('div',{class:'filepill', style:'margin-bottom:8px;'+(u.status==='Disabled'?'opacity:.55;':'')},[
        el('span',{class:'ic'},[info.icon]),
        el('span',{class:'nm'},[`${u.displayName} — ${u.username?('@'+u.username):u.email} — ${info.label} — ${u.status==='Disabled'?'Đã vô hiệu hóa':'Đang hoạt động'}`]),
      ]);
      const isSelf = currentMember && currentMember.userId===u.userId;
      if(!isSelf){
        const roleChangeSel = el('select',{class:'inp', style:'width:auto;'},Object.keys(ROLE_INFO).map(r=>el('option',{value:r},[ROLE_INFO[r].label])));
        roleChangeSel.value = u.role;

          const newRole = roleChangeSel.value;
          const r = await adminUsersCall('change-role', {targetUserId:u.userId, newRole});
          if(r.error){ toast(r.error); roleChangeSel.value = u.role; } else { toast('Đã cập nhật vai trò'); refreshList(); }
        });
        row.appendChild(roleChangeSel);
        const toggleActiveBtn = el('button',{class:'btn '+(u.status==='Disabled'?'teal':'danger')+' sm'},[u.status==='Disabled'?'Kích hoạt lại':'Vô hiệu hóa']);
        toggleActiveBtn.addEventListener('click', async ()=>{
          if(u.status!=='Disabled' && !confirm(`Vô hiệu hóa tài khoản "${u.displayName}"? Người này sẽ không đăng nhập được nữa.`)) return;
          const r = await adminUsersCall(u.status==='Disabled'?'enable-user':'disable-user', {targetUserId:u.userId});
          if(r.error) toast(r.error); else { toast('Đã cập nhật'); refreshList(); }
        });
        row.appendChild(toggleActiveBtn);
      } else {
        row.appendChild(el('span',{class:'sub'},['(bạn)']));
      }
      listBox.appendChild(row);
    });
    if(!res.users || !res.users.length) listBox.appendChild(el('p',{class:'sub'},['Chưa có tài khoản nào.']));
  }
  createBtn.addEventListener('click', async ()=>{
    createErr.style.display = 'none';
    const isEmail = loginModeSel.value==='email';
    const payload = {displayName: nameInp.value, role: roleSel.value, password: passInp.value};
    if(isEmail) payload.email = userOrEmailInp.value; else payload.username = userOrEmailInp.value;
    createBtn.disabled = true; createBtn.textContent = 'Đang tạo…';
    const r = await adminUsersCall('create-user', payload);
    createBtn.disabled = false; createBtn.textContent = '➕ Tạo tài khoản';
    if(r.error){ createErr.textContent = r.error; createErr.style.display = ''; return; }
    toast('Đã tạo tài khoản');
    nameInp.value = ''; userOrEmailInp.value = ''; passInp.value = '';
    refreshList();
  });
  refreshList();
  card.appendChild(createCard);
  return card;
}

/* ===================== ADMIN — TAB LAYOUT & PER-ROLE VISIBILITY =====================
   Lets Admin reorder the tab bar and hide individual tabs for the 'user'
   and/or 'supervisor' role — see the TAB LAYOUT & PER-ROLE VISIBILITY module
   (applyTabConfig/TAB_CONFIG) for how this is enforced. Only rendered for a
   verified Admin (see renderSettings). Works on a local draft copy of
   TAB_CONFIG so "Lưu" is one explicit action, not applied keystroke-by-keystroke. */
function renderTabConfigCard(){
  const draft = { order: TAB_CONFIG.order.slice(), hidden: {user: TAB_CONFIG.hidden.user.slice(), supervisor: TAB_CONFIG.hidden.supervisor.slice()} };
  const card = el('div',{class:'card'},[
    el('div',{class:'card-h'},['🗂️ Sắp xếp & Ẩn/hiện Tab', el('div',{class:'rule'})]),
    el('p',{class:'sub', style:'margin:0 0 10px;'},['Đổi thứ tự hiện ở thanh tab trên cùng, và chọn ẩn tab nào với vai trò Nhân viên/Giám sát. Admin luôn thấy đủ mọi tab.']),
  ]);
  const listBox = el('div',{},[]);
  card.appendChild(listBox);
  function renderList(){
    listBox.innerHTML = '';
    draft.order.forEach((id,idx)=>{
      const upAttrs = {class:'btn ghost sm', title:'Lên trên'}; if(idx===0) upAttrs.disabled='disabled';
      const downAttrs = {class:'btn ghost sm', title:'Xuống dưới'}; if(idx===draft.order.length-1) downAttrs.disabled='disabled';
      const userChk = el('input',{type:'checkbox'},[]); userChk.checked = draft.hidden.user.includes(id);
      const supChk = el('input',{type:'checkbox'},[]); supChk.checked = draft.hidden.supervisor.includes(id);
      const row = el('div',{class:'specfield'},[
        el('div',{class:'reorder'},[el('button',upAttrs,['▲']),el('button',downAttrs,['▼'])]),
        el('div',{class:'fi'},[el('b',{},[TAB_LABELS[id]||id])]),
        el('label',{style:'display:flex;align-items:center;gap:5px;font-size:12.5px;white-space:nowrap;'},[userChk,'Ẩn/User']),
        el('label',{style:'display:flex;align-items:center;gap:5px;font-size:12.5px;white-space:nowrap;margin-left:10px;'},[supChk,'Ẩn/Giám sát']),
      ]);
      const [upBtn, downBtn] = qsa('button', row);
      upBtn.addEventListener('click', ()=>{ if(idx===0) return; [draft.order[idx-1],draft.order[idx]]=[draft.order[idx],draft.order[idx-1]]; renderList(); });
      downBtn.addEventListener('click', ()=>{ if(idx===draft.order.length-1) return; [draft.order[idx+1],draft.order[idx]]=[draft.order[idx],draft.order[idx+1]]; renderList(); });
      userChk.addEventListener('change', ()=>{
        draft.hidden.user = userChk.checked ? [...new Set([...draft.hidden.user, id])] : draft.hidden.user.filter(x=>x!==id);
      });
      supChk.addEventListener('change', ()=>{
        draft.hidden.supervisor = supChk.checked ? [...new Set([...draft.hidden.supervisor, id])] : draft.hidden.supervisor.filter(x=>x!==id);
      });
      listBox.appendChild(row);
    });
  }
  renderList();
  const saveBtn = el('button',{class:'btn teal sm', style:'margin-top:10px;'},['💾 Lưu cấu hình Tab']);
  saveBtn.addEventListener('click', async ()=>{
    TAB_CONFIG = normalizeTabConfig(draft);
    await idbPut('meta', {k:'tabConfig', value: TAB_CONFIG});
    await queueMetaSync('tabConfig', TAB_CONFIG);
    applyTabConfig();
    toast('Đã lưu cấu hình Tab');
  });
  card.appendChild(saveBtn);
  return card;
}

/* ===================== SAO LƯU / PHỤC HỒI JSON (v2) =====================
   File sao lưu v2 = {version:2, exportedAt, checkpoints:[...kèm ảnh], meta:{schema, poList, clientList, itemCodeList,
   technicians, poClosures, tabConfig, egressControl}}. Khi phục hồi, các dấu "đã đồng bộ" cục bộ (_syncedAt/_imagesSyncedFp)
   bị bỏ đi: nếu không, bản ghi bị coi là ĐÃ có trên server và sẽ KHÔNG bao giờ được đẩy lên máy chủ mới. */
function buildBackupJson(){
  return {
    version: 2, exportedAt: new Date().toISOString(),
    checkpoints: allCheckpoints,
    meta: { schema: SCHEMA, poList: PO_LIST, clientList: CLIENT_LIST, itemCodeList: ITEM_CODE_LIST, technicians: TECHNICIANS,
      poClosures, tabConfig: TAB_CONFIG, egressControl: EGRESS_CONFIG },
  };
}
function forUpload(r){
  const c = Object.assign({}, r);
  delete c._syncedAt; delete c._imagesSyncedFp;
  return c;
}
async function restoreMetaFromBackup(meta){
  let n = 0;
  for(const key of ['schema','poList','clientList','itemCodeList','technicians','poClosures','tabConfig','egressControl']){
    const value = meta[key];
    if(value===undefined || value===null) continue;
    // Chỉ Admin được ghi egressControl (máy chủ cũng kiểm lại) — người khác thì bỏ qua để khỏi tạo hàng đợi bị từ chối.
    if(key==='egressControl' && !(currentMember && currentMember.role==='admin')) continue;
    applyRemoteMeta(key, value);
    await queueMetaSync(key, key==='schema' ? SCHEMA : key==='tabConfig' ? TAB_CONFIG : key==='egressControl' ? EGRESS_CONFIG : value);
    n++;
  }
  return n;
}

  if(!isAdmin){

  const enabledChk = el('input',{type:'checkbox'},[]); enabledChk.checked = EGRESS_CONFIG.enabled;
  const softInp = el('input',{class:'inp', type:'number', min:'1', step:'1', value:String(EGRESS_CONFIG.softLimitMB)},[]);

    el('label',{style:'display:flex;align-items:center;gap:8px;margin-bottom:10px;'},[enabledChk, 'Bật bảo vệ traffic']),

    el('label',{class:'fld', style:'margin-top:10px;'},[el('span',{class:'lab'},['Hard Daily Limit (MB) — chuyển sang 🔴 Protection']), hardInp]),
  ]);
  const saveBtn = el('button',{class:'btn teal sm', style:'margin-top:10px;'},['💾 Save Settings']);
  saveBtn.addEventListener('click', async ()=>{
    const ok = await saveEgressConfig({enabled: enabledChk.checked, softLimitMB: toNum(softInp.value), hardLimitMB: toNum(hardInp.value)});
    if(ok) toast('Đã lưu cấu hình Data & Egress Control');

  });
  qs('input[type=file]', backupCard).addEventListener('change', async (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const text = await file.text();
    try{
      const parsed = JSON.parse(text);
      // Định dạng mới: {version:2, checkpoints:[...], meta:{...}}; định dạng cũ: mảng checkpoint trần — vẫn đọc được.
      const list = Array.isArray(parsed) ? parsed : (parsed && Array.isArray(parsed.checkpoints) ? parsed.checkpoints : null);
      if(!list) throw new Error('bad backup');
      const records = [];
      list.forEach(r=>{
        if(r.section !== undefined) records.push(r);
        else records.push(...splitLegacyIntoCheckpoints(r));
      });
      for(const r of records) await idbPut('shifts', forUpload(r));
      let metaCount = 0;
      if(parsed && !Array.isArray(parsed) && parsed.meta) metaCount = await restoreMetaFromBackup(parsed.meta);
      await refreshCache();
      await persistAll();
      toast(`Đã phục hồi ${records.length} điểm kiểm tra` + (metaCount ? ` và ${metaCount} mục cấu hình/danh mục` : '') + ' — đang đồng bộ lên máy chủ');
      renderAll();
    }catch(err){ toast('File JSON không hợp lệ'); }
  });
  root.appendChild(backupCard);

  const shareBox = el('div',{},[]);
  root.appendChild(shareBox);
  renderShare(shareBox);

  const catCard = el('div',{class:'card'},[
    el('div',{class:'card-h'},['Danh mục Tên QC', el('div',{class:'rule'})]),
    el('p',{class:'sub', style:'margin:0 0 10px;'},['Mỗi tên 1 dòng. Danh sách này sẽ hiện ra dạng chọn ở tab Nhập liệu.']),
  ]);
  const techArea = el('textarea',{class:'inp', rows:'5'},[]);
  techArea.value = TECHNICIANS.join('\n');
  catCard.appendChild(techArea);
  const techSaveBtn = el('button',{class:'btn teal sm', style:'margin-top:10px;'},['💾 Lưu danh sách QC']);
  techSaveBtn.addEventListener('click', async ()=>{
    TECHNICIANS = techArea.value.split('\n').map(s=>s.trim()).filter(Boolean);
    await idbPut('meta', {k:'technicians', value: TECHNICIANS});
    await queueMetaSync('technicians', TECHNICIANS);
    toast('Đã lưu danh sách QC');
  });
  catCard.appendChild(techSaveBtn);
  root.appendChild(catCard);

  const dangerCard = el('div',{class:'card'},[
    el('div',{class:'card-h'},['Xoá dữ liệu', el('div',{class:'rule'})]),
    el('button',{class:'btn danger sm'},['🗑️ Xoá toàn bộ dữ liệu trong máy']),
  ]);
  qs('button', dangerCard).addEventListener('click', async ()=>{
    const msg = cloudCfg.url
      ? 'Xoá TOÀN BỘ dữ liệu ca đã lưu trong MÁY NÀY? Đây chỉ xoá bản sao cục bộ — dữ liệu trên máy chủ (và các thiết bị khác) KHÔNG bị xoá, và lần đồng bộ tiếp theo sẽ tự tải lại về máy này. Muốn xoá vĩnh viễn trên cả server, cần thao tác trực tiếp trên Cloudflare D1 (npx wrangler d1 execute).'
      : 'Xoá TOÀN BỘ dữ liệu ca đã lưu trong máy này? Hành động không thể hoàn tác.';
    if(confirm(msg)){
      for(const r of allCheckpoints) await idbDelete('shifts', r.key);
      await refreshCache();
      await persistAll();
      toast('Đã xoá toàn bộ dữ liệu');
      renderAll();
    }
  });
  root.appendChild(dangerCard);
}

/* ===================== GUIDE TAB ===================== */
function renderGuide(){
  const root = qs('#view-guide');
  if(root.dataset.rendered) return;
  root.dataset.rendered='1';
  root.innerHTML = `
  <div class="section-title">Hướng dẫn sử dụng</div>
  <div class="card markd">
    <h4>0. Mô hình dữ liệu: Điểm kiểm tra (Checkpoint)</h4>
    <p>App không còn coi "1 ca = 1 PO cho tất cả công đoạn". Thực tế dây chuyền chạy liên tục nên <b>1 ca có thể có nhiều PO chạy song song</b>, mỗi PO chỉ ứng với 1 vài công đoạn cụ thể (VD: PO 65 chỉ có ở Rang, PO 89 và 90 cùng chạy ở Trích ly). Vì vậy đơn vị nhập liệu nhỏ nhất giờ là <b>Điểm kiểm tra</b> = 1 lần nhập cho đúng 1 Công đoạn + 1 PO cụ thể, trong 1 Ngày + Ca. 1 ca có thể có nhiều điểm kiểm tra.</p>
    <h4>1. Đồng bộ Cloudflare (tuỳ chọn, khuyên bật để dùng nhiều thiết bị)</h4>
    <p>Đây là bản Online của Shiftly Report — dữ liệu luôn được lưu trước trong chính máy đang dùng (IndexedDB), giống hệt bản offline gốc, nên mất mạng vẫn nhập liệu bình thường. Muốn nhiều tablet/máy tính cùng thấy chung 1 bộ dữ liệu, app đã có sẵn địa chỉ máy chủ Cloudflare mặc định nên không cần nhập gì thêm (tab <b>Cài đặt</b> → mục "☁️ Đồng bộ Cloudflare" chỉ để xem trạng thái hoặc đổi máy chủ khi cần). Mở app là app yêu cầu <b>đăng nhập</b> (tài khoản do Admin tạo trong tab Cài đặt → "👥 Quản lý tài khoản") — mỗi người dùng riêng, đăng nhập xong app tự đẩy/kéo dữ liệu, không cần thao tác thêm.</p>
    <h4>1b. Đăng nhập & quản lý tài khoản</h4>
    <p>Khi đã bật Đồng bộ Cloudflare, app yêu cầu đăng nhập trước khi vào — có 3 loại tài khoản: <b>Admin</b> (toàn quyền, đăng nhập bằng email + mật khẩu), <b>Nhân viên/User</b> (nhập liệu bình thường, đăng nhập bằng tên đăng nhập + mật khẩu), và <b>Giám sát/Quản lý</b> (chỉ xem — Báo cáo, Dữ liệu... — không nhập/sửa được dữ liệu; cũng đăng nhập bằng tên đăng nhập + mật khẩu). Chỉ Admin thấy mục "👥 Quản lý tài khoản" trong tab Cài đặt để tạo tài khoản mới, đổi vai trò (kể cả đổi qua lại giữa 3 vai trò), hoặc vô hiệu hóa một tài khoản (người bị vô hiệu hóa không đăng nhập được nữa, kể cả trên thiết bị đang mở sẵn — lần gọi đồng bộ tiếp theo sẽ bị từ chối và quay lại màn hình đăng nhập). Tài khoản Admin đầu tiên do người triển khai tạo 1 lần bằng khóa khởi tạo — xem <code>cloudflare/README.md</code>. Nếu chưa cấu hình đồng bộ, app dùng bình thường không cần đăng nhập gì cả (y hệt trước đây). Khi đã đăng nhập, góc phải thanh trên cùng (mọi tab) hiện tên tài khoản kèm nút <b>"🚪 Đăng xuất"</b> — bấm vào sẽ đăng xuất VÀ tự xoá bộ nhớ cache trình duyệt của trang (Cache Storage/Service Worker nếu có), rồi tải lại trang; dữ liệu đã nhập trong máy (IndexedDB) không hề bị đụng tới.</p>
    <h4>1c. Admin tuỳ chỉnh thứ tự & ẩn/hiện Tab theo vai trò</h4>
    <p>Ở tab Cài đặt, mục "🗂️ Sắp xếp &amp; Ẩn/hiện Tab" (chỉ Admin thấy) cho phép đổi thứ tự hiện ở thanh tab trên cùng (nút ▲▼, áp dụng chung cho mọi thiết bị/mọi người sau khi bấm Lưu), và chọn ẩn riêng từng tab với vai trò Nhân viên và/hoặc Giám sát/Quản lý — VD ẩn tab Specs với Nhân viên nếu không muốn họ tự sửa chỉ tiêu. Admin luôn thấy đủ mọi tab bất kể cấu hình này. Tab Cài đặt không bao giờ ẩn được (đây là nơi duy nhất có nút đăng xuất/ngắt kết nối, ẩn đi sẽ nhốt luôn tài khoản đó). Mặc định, vai trò Giám sát/Quản lý bị ẩn sẵn tab Nhập liệu.</p>
    <h4>2. Nhập liệu theo Điểm kiểm tra</h4>
    <p>Ở tab <b>Nhập liệu</b>: chọn Ngày + Ca → phần "Bàn giao ca" (Tình hình/Sự cố, Bàn giao) không cần PO, điền được ngay. Bên dưới là danh sách các điểm kiểm tra đã có trong ca này. Bấm <b>"➕ Thêm điểm kiểm tra"</b> → theo đúng thứ tự: chọn <b>Công đoạn</b> → nhập/chọn <b>mã PO</b> (và Item Code nếu có) → chọn <b>Recipe</b> (+ Client nếu có) → chọn <b>Technician (QC)</b> → nhập chỉ tiêu → <b>"Lưu điểm kiểm tra"</b>. Muốn nhập PO khác cho cùng công đoạn (VD: PO 89 rồi PO 90 đều ở Trích ly), bấm "➕ Thêm điểm kiểm tra" lần nữa với PO mới — không bị ghi đè lên nhau.</p>
    <h4>3. Ô Đạt / Lỗi</h4>
    <p>Với các chỉ tiêu kiểm tra ngoại quan (không có số liệu), chạm nút để chuyển trạng thái: — — (chưa kiểm) → ✅ Đạt → ❌ Lỗi → quay lại — —.</p>
    <h4>4. Xem lại & sửa</h4>
    <p>Tab <b>Dữ liệu</b> liệt kê tất cả các điểm kiểm tra đã nhập (chế độ 📋 Danh sách ca), mỗi dòng có Công đoạn + PO riêng, chạm 👁 để xem chi tiết, ✎ sửa, hoặc 🗑 xoá. Chế độ 📅 Xem theo ngày hiển thị Ca 1/2/3 cạnh nhau — mỗi cột liệt kê tất cả điểm kiểm tra (mọi công đoạn, mọi PO) của ca đó, giống bố cục file Excel gốc.</p>
    <h4>6. An toàn dữ liệu</h4>
    <p>Toàn bộ dữ liệu được lưu ngay trong máy đang dùng (IndexedDB) trước tiên — luôn vào được, kể cả mất mạng. Nếu có bật đồng bộ, mỗi lần lưu app sẽ tự đẩy dữ liệu lên; nếu đang offline hoặc đồng bộ lỗi, các thay đổi được xếp vào 1 "hàng đợi" lưu ngay trong máy và app tự thử lại khi có mạng trở lại — không mất dữ liệu. Vẫn nên thỉnh thoảng tải file JSON sao lưu ở tab Cài đặt như 1 lớp an toàn bổ sung — file này gồm cả điểm kiểm tra (kèm ảnh) lẫn Specs/danh mục/cấu hình, và phục hồi từ file sẽ tự đẩy lại lên máy chủ.</p>
    <h4>6b. Đồng bộ Cloudflare — cách hoạt động</h4>
    <p>Sau khi cấu hình ở tab Cài đặt, mỗi lần lưu 1 điểm kiểm tra/Specs/Danh sách PO-Recipe-Client-QC, app đẩy ngay thay đổi đó lên máy chủ, đồng thời máy chủ phát 1 tín hiệu Realtime "vừa có thay đổi" — các máy khác đang mở app nhận tín hiệu này gần như ngay lập tức và tự kéo dữ liệu mới về, không cần chờ. Nếu Realtime không kết nối được (mạng công ty chặn WebSocket, trình duyệt cũ...), app tự rơi về kiểm tra định kỳ mỗi ~15-20 giây (và mỗi khi mở lại app / có mạng trở lại) — vẫn tự động, không cần biết Realtime có đang hoạt động hay không. Nếu 2 người cùng sửa <b>đúng 1 điểm kiểm tra</b> (trùng Ngày+Ca+Công đoạn+PO) gần như cùng lúc, bản lưu <b>sau cùng sẽ thắng</b> (theo thời gian lưu) — vì mỗi điểm kiểm tra đã tách rất nhỏ theo Công đoạn+PO nên tình huống này hiếm khi xảy ra. Ảnh đính kèm được lưu ở kho ảnh riêng của máy chủ (Cloudflare R2); máy nhận điểm kiểm tra sẽ tải ảnh về ngay sau đó, và chỉ tải khi ảnh mới hoặc đã đổi. Có thể bấm "🔄 Đồng bộ ngay" ở tab Cài đặt để đồng bộ thủ công bất cứ lúc nào — app sẽ báo rõ vừa nhận thêm bao nhiêu thay đổi mới, hoặc lý do cụ thể nếu đồng bộ thất bại (sai địa chỉ máy chủ, phiên đăng nhập hết hạn, mất mạng...) thay vì chỉ báo chung chung. Con trỏ đồng bộ dùng số thứ tự do server tự sinh (không dùng đồng hồ của máy) nên đồng hồ điện thoại/máy tính lệch nhau không làm mất hoặc trễ dữ liệu. Nếu nghi ngờ 1 thiết bị bị "kẹt" (báo đã đồng bộ nhưng thiếu dữ liệu), bấm "🔁 Đồng bộ lại từ đầu" để buộc tải lại toàn bộ từ server — an toàn, không mất dữ liệu.</p>
    <h4>7. Đưa dữ liệu sang máy tính (Tablet Android ↔ PC Windows)</h4>
    <p>Nếu đã bật Đồng bộ Cloudflare, việc này giờ <b>tự động</b> — bất kỳ máy nào (tablet ở xưởng, PC văn phòng, laptop quản lý) mở cùng 1 địa chỉ app, rồi đăng nhập tài khoản của mình sẽ tự thấy dữ liệu chung, không cần chép file qua lại nữa. Chỉ cần cả 2 máy có mạng tại một thời điểm nào đó (không cần đồng thời) để đồng bộ diễn ra.</p>
    <p>Vẫn nên duy trì thói quen sao lưu thủ công định kỳ để phòng rủi ro (mất tài khoản Cloudflare, xoá nhầm, sự cố ngoài dự kiến):</p>
    <ul>
      <li><b>Định kỳ (hàng tuần):</b> tải JSON sao lưu (tab Cài đặt) gửi email cho chính mình hoặc copy qua USB.</li>
      <li><b>Không có mạng dài ngày ở xưởng:</b> vẫn nhập liệu bình thường — dữ liệu nằm an toàn trong máy (hàng đợi đồng bộ), tự đẩy lên hết khi có mạng trở lại, không cần thao tác gì thêm.</li>
      <li><b>Chưa/không muốn bật đồng bộ:</b> vẫn dùng mục <b>Xuất nhập dữ liệu</b> (tab Cài đặt) để xuất CSV/Excel/JSON thủ công và chia sẻ qua OneDrive/SharePoint/USB như cách làm truyền thống.</li>
    </ul>
    <h4>8. Xuất / nhập nhanh một phần dữ liệu (Short CSV)</h4>
    <p>Khi chỉ cần gửi vài ca (không phải toàn bộ lịch sử) cho người khác — ví dụ đưa số liệu hôm nay cho quản lý xem trên máy khác:</p>
    <ul>
      <li><b>Xuất theo lựa chọn tay:</b> ở tab <b>Dữ liệu</b> (chế độ Danh sách ca), tick chọn các ca cần gửi (có "chọn tất cả" ở đầu bảng) → bấm <b>"Xuất ca đã chọn (Short CSV)"</b>.</li>
      <li><b>Xuất theo khoảng thời gian tự động:</b> ở mục <b>Xuất nhập dữ liệu</b> (tab Cài đặt), chọn phạm vi "Theo ca cụ thể / Theo ngày / Theo tuần / Theo tháng" → app tự lọc đúng các ca trong khoảng đó → "Xuất & Chia sẻ".</li>
      <li>Cả 2 cách đều tạo 1 file CSV nhỏ, tên bắt đầu bằng <b>"Short_"</b>, cùng định dạng cột với file CSV tổng nên mở được ở cả 2 nơi.</li>
      <li><b>Nhập:</b> ở máy nhận, vào mục <b>Xuất nhập dữ liệu</b> (tab Cài đặt) → "Chọn file CSV để nhập" → chọn file "Short_..." (hoặc cả file CSV tổng) vừa nhận. App tự so sánh với dữ liệu đang có và <b>báo động nếu phát hiện ca trùng</b> (cùng Ngày+Ca đã tồn tại) — chọn "Chỉ thêm ca mới" (an toàn, bỏ qua trùng) hoặc "Ghi đè cả ca trùng" (nếu chắc chắn muốn thay bằng bản mới). Dữ liệu nhập vào được lưu vào máy này và tự đồng bộ lên máy chủ (nếu đã bật) như mọi thay đổi khác.</li>
    </ul>
    <h4>9. Đính kèm ảnh bất thường</h4>
    <p>Ngay dưới ô "Ghi chú bất thường" của mỗi công đoạn có 2 nút: <b>📎 Đính kèm ảnh</b> (chọn ảnh có sẵn trong máy) và <b>📷 Chụp ảnh</b> (mở camera chụp trực tiếp). Ảnh được nén gọn và lưu ngay trong máy (IndexedDB) — không cần bấm "Lưu công đoạn" mới lưu ảnh. Chạm ✕ trên ảnh nhỏ để xoá. <b>Lưu ý:</b> ảnh không đi kèm trong file CSV (CSV chỉ chứa số liệu để tương thích Excel) — ảnh chỉ xem được trong app trên chính máy đã chụp/đính kèm, hoặc trong bản backup JSON đầy đủ (tab Cài đặt).</p>
    <h4>10. Banner bàn giao ca</h4>
    <p>Khi mở 1 ca mới, nếu ca liền trước đó có ghi "Tình hình/Sự cố" hoặc "Bàn giao" (ở công đoạn Tổng kết ca), app sẽ tự hiện 1 banner màu vàng nổi bật ngay đầu tab Nhập liệu — không cần vào từng công đoạn mới thấy. Đây là thông tin quan trọng nhất khi giao ca nên được đưa lên đầu.</p>
    <h4>11. Đánh Đạt tất cả (nhập nhanh)</h4>
    <p>Với các nhóm chỉ tiêu kiểm tra ngoại quan (Đạt/Lỗi), mỗi nhóm có nút <b>"✅ Đạt tất cả"</b> ở đầu — bấm 1 lần để đánh Đạt hết cả nhóm, sau đó chỉ cần sửa lại những mục thực sự phát hiện lỗi. Tiết kiệm thời gian cho các công đoạn có nhiều mục kiểm tra (F&amp;P).</p>
    <h4>12. Nhắc khi lưu còn thiếu dữ liệu</h4>
    <p>Khi bấm "Lưu công đoạn" mà còn chỉ tiêu chưa nhập, app sẽ hỏi xác nhận trước ("Còn X/Y chỉ tiêu chưa nhập, vẫn lưu?") — không chặn, chỉ nhắc để tránh bỏ sót ngoài ý muốn.</p>
    <h4>13. Đồng bộ cấu hình Specs giữa nhiều tablet</h4>
    <p>Nếu công ty dùng nhiều tablet, chỉnh Specs xong ở 1 máy → vào tab <b>Specs</b> → "Xuất cấu hình Specs (JSON)" → chia sẻ file này sang các máy khác → ở máy nhận, vào tab Specs → "Nhập cấu hình Specs (JSON)" → chọn file. File này chỉ chứa danh sách chỉ tiêu &amp; giới hạn, không chứa dữ liệu ca nên an toàn khi đồng bộ.</p>
    <h4>14. Truy xuất dữ liệu — lọc ngay trong tab Dữ liệu</h4>
    <p>Tab "Truy xuất" riêng đã được gộp vào tab <b>Dữ liệu</b> (ở chế độ "📋 Danh sách ca") — thẻ "🔎 Truy xuất — lọc theo PO/Ca/khoảng ngày" ngay phía trên bảng cho lọc theo mã PO (chọn từ gợi ý hoặc gõ tay), Ca, và/hoặc khoảng ngày; bảng bên dưới tự cập nhật ngay khi đổi bộ lọc (không cần bấm nút tìm kiếm), kèm nút "✕ Xoá bộ lọc" và "📊 Xuất Excel kết quả" cho đúng phần đang lọc. Vẫn dùng chung các nút 👁/✎/🗑 sẵn có của bảng — ✎ Sửa 1 điểm kiểm tra thuộc PO đã đóng sẽ hỏi mật khẩu Force như trước.</p>
    <h4>15. Sắp xếp lại thứ tự chỉ tiêu (Specs)</h4>
    <p>Mỗi chỉ tiêu trong tab Specs có 2 nút ▲ ▼ để di chuyển lên/xuống trong danh sách của công đoạn đó — thứ tự này cũng là thứ tự hiển thị ở tab Nhập liệu.</p>
    <h4>16. Báo cáo theo ca — Ngày + Ca độc lập, xem "Tất cả"</h4>
    <p>Chế độ <b>"Theo ca"</b> giờ tách thành 2 lựa chọn riêng: ô <b>Ngày</b> và ô <b>Ca</b> (Ca 1 / Ca 2 / Ca 3 / <b>Tất cả</b>) — mặc định trỏ sẵn tới Ngày+Ca gần nhất đang có dữ liệu, nhưng có thể tự chọn bất kỳ tổ hợp nào. Chọn <b>"Tất cả"</b> sẽ hiển thị lần lượt báo cáo Ca 1 → Ca 2 → Ca 3 của đúng Ngày đã chọn trong CÙNG 1 ảnh, mỗi ca phân tách rõ bằng 1 dải tiêu đề đậm màu; ca nào chưa có dữ liệu vẫn hiện, chỉ ghi "Chưa có dữ liệu". Trong mỗi công đoạn, Issue/Abnormal và Action giờ hiển thị <b>song song 2 cột trong cùng 1 khung</b> thay vì lẫn vào các chỉ tiêu khác, dễ thấy ngay Issue nào đi với Action nào.</p>
    <h4>16a. Báo cáo theo PO — Gantt Process x Date x Shift (tab Báo cáo)</h4>
    <p>Chế độ <b>"Theo PO"</b>: nhập mã PO (cùng quy tắc định dạng với tab Nhập liệu — đúng 9 chữ số, hoặc SHUTDOWN, không phân biệt hoa/thường) → app dựng 1 bảng <b>Gantt</b> giống mẫu Excel "QUALITY & ACTIVITIES FOLLOW UP". Phần đầu chỉ hiện <b>ITEM CODE / ITEM NAME / PO / RECIPE</b> đúng 1 lần. Bên dưới là lưới: mỗi cột là 1 <b>Ngày + Ca</b>, sinh <b>LIÊN TỤC</b> từ checkpoint sớm nhất tới muộn nhất của PO (kể cả những Ca không có dữ liệu) để thanh Gantt thể hiện đúng khoảng chạy thật; mỗi Công đoạn thực sự có dữ liệu chiếm 3 hàng: thanh Gantt (kéo dài từ Ngày+Ca đầu tới cuối), rồi <b>Issues/Abnormal</b> và <b>Action</b> — nội dung nằm ĐÚNG ô Ngày+Ca của checkpoint phát sinh, không gộp chung. Bảng cuộn ngang được (<b>overflow-x: auto</b>), cột đầu ("Process/Information") cố định khi cuộn để luôn thấy tên công đoạn. <b>Mọi ô Issue/Action đều bấm được</b>, kể cả Ngày+Ca chưa từng ghi nhận gì (viền sáng lên khi rê chuột) — mở popup sửa/thêm mới ("✎ Sửa" cho cặp đã có, hoặc "+ Thêm Issue/Action" nếu ô đó còn trống) → 2 ô nhập → "💾 Lưu" — ghi thẳng vào đúng checkpoint (Ngày/Ca/Công đoạn/PO tương ứng, tự tạo mới nếu chưa từng có, không tạo báo cáo riêng), nên tab Nhập liệu và Data Log đều thấy thay đổi ngay lập tức, và thanh Gantt của Công đoạn đó tự nới rộng nếu Ngày+Ca vừa thêm nằm ngoài khoảng cũ. Ảnh PNG/Chia sẻ xuất ra từ chế độ này tự co giãn theo đúng số cột thật (không giới hạn độ rộng cố định như trước), luôn thấy đủ hết các cột bên phải. Ở chế độ Theo PO, <b>"📊 Excel theo mẫu"/"📄 PDF theo mẫu" (Process/QMS — xem mục 34) giờ có thêm chính bảng Gantt này</b> — Excel thêm 1 sheet "Gantt" riêng (trước sheet "Data Export" quen thuộc, thanh Gantt tô màu bằng ô gộp cột), PDF chèn thêm 1 bảng Gantt ngay đầu trang in (khổ ngang) trước bảng QMS — cả 2 đều dùng đúng dữ liệu PO đang xem, không xuất thêm gì ngoài phạm vi đó. Theo ca không có khái niệm "1 PO đang xem" nên 2 nút này ở đó vẫn giữ nguyên như cũ, không có Gantt.</p>
    <h4>16b. Ảnh đính kèm full chiều rộng + lọc chỉ tiêu QMS trong báo cáo ảnh (Theo ca)</h4>
    <p>Ảnh đính kèm trong báo cáo ảnh <b>Theo ca</b> (PNG/chia sẻ) hiển thị lớn — tối đa 2 ảnh/hàng, mỗi ảnh chia đều chiều rộng báo cáo; nếu lẻ 1 ảnh ở hàng cuối, ảnh đó tự kéo full chiều rộng thay vì để trống 1 nửa như trước. Ô <b>"Chỉ hiện chỉ tiêu QMS trong báo cáo ảnh"</b> (phía trên khung xem trước, chỉ hiện ở chế độ Theo ca) cho chuyển qua lại giữa 2 chế độ: bỏ tick (mặc định) hiện mọi chỉ tiêu đã nhập như trước giờ; tick vào chỉ còn các chỉ tiêu đã đánh dấu "Xuất trong báo cáo QMS" ở tab Specs (dùng chung đúng cấu hình với nút "Excel/PDF theo mẫu") — tiện khi cần báo cáo ảnh gọn, chỉ có số liệu QMS thay vì đầy đủ mọi Parameters đã nhập. Báo cáo <b>Theo PO</b> (Gantt, mục 16a) không hiện từng chỉ tiêu/ảnh đính kèm nữa — chỉ tập trung vào tiến độ Process theo thời gian và Issue/Action.</p>
    <h4>17. Định dạng ngày DD/MM/YYYY</h4>
    <p>Toàn bộ ngày hiển thị trong app (và cột Date khi xuất CSV/Excel) đều theo định dạng <b>DD/MM/YYYY</b> (VD: 17/07/2026). Khi nhập lại file CSV cũ có định dạng khác, app vẫn tự nhận diện được.</p>
    <h4>18. Xuất dữ liệu nhiều định dạng (CSV / Excel / JSON)</h4>
    <p>Mục Xuất nhập dữ liệu (tab Cài đặt) giờ cho chọn phạm vi (Toàn bộ / Theo ca / Ngày / Tuần / Tháng / Theo PO) và định dạng file (CSV, Excel .xls, hoặc JSON) trước khi xuất. Giờ cũng <b>nhập lại được</b> file Excel .xls — nhưng chỉ với file do chính app này xuất ra (app đọc lại đúng định dạng của mình, không đọc được file .xlsx bất kỳ từ nơi khác).</p>
    <h4>19. Nhập ảnh đính kèm từ xa</h4>
    <p>Mục Xuất nhập dữ liệu (tab Cài đặt) có mục "Nhập ảnh đính kèm": chọn đúng Ngày + Ca + Công đoạn + PO của điểm kiểm tra rồi chọn ảnh — dùng khi nhận được ảnh bằng chứng qua Zalo/email từ người khác thay vì tự chụp trực tiếp trong ca.</p>
    <h4>20. Dán ảnh trực tiếp (Copy/Paste)</h4>
    <p>Ô "📋 Dán ảnh vào đây (Ctrl+V)" dưới mỗi Ghi chú bất thường — chạm vào ô rồi dán (paste) ảnh đã copy sẵn, không cần lưu file trước.</p>
    <h4>21. Tab Specs — bảng chỉnh sửa trực tiếp, Bắt buộc & ghi đè theo Recipe</h4>
    <p>Mỗi Công đoạn là 1 bảng riêng (giống tab Danh sách Items Code), cột <b>Lựa chọn (Danh sách)</b> nằm cuối cùng — bấm tiêu đề cột để sắp xếp, gõ vào ô "Lọc" dưới mỗi cột để tìm nhanh (lọc được theo Tên, Loại, Bắt buộc, QMS, và Lựa chọn), sửa Tên/Loại/Giới hạn/Nhãn/Bắt buộc/QMS/Lựa chọn ngay trong ô (gõ xong bấm ra ngoài hoặc tick là lưu ngay, không cần nút Lưu riêng). Nút <b>"➕ Thêm chỉ tiêu"</b> ở đầu mỗi bảng mở 1 popup nhập đầy đủ thông tin chỉ tiêu mới (Tên, Loại, Giới hạn/Lựa chọn/Nhãn tuỳ Loại, Bắt buộc, QMS) trong 1 lần thay vì phải điền tiếp trong bảng. Nút ▲▼ ở cột Hành động để sắp xếp thủ công thứ tự hiển thị ở tab Nhập liệu (tắt sắp xếp cột khác trước để thấy rõ khi dùng ▲▼). Tick "Bắt buộc" để đánh dấu Mandatory (hiện dấu * và cảnh báo mạnh hơn khi lưu thiếu ở tab Nhập liệu). Với chỉ tiêu Loại Số, bấm nút "🧬 Ghi đè" ở cuối dòng để mở bảng con "Ghi đè theo Recipe" ngay bên dưới — cùng 1 chỉ tiêu nhưng LSL/LCL/UCL/USL khác nhau tuỳ Recipe đang chọn ở công đoạn đó (ô Recipe gợi ý mọi mã đang có trong Item Code Master). Ô tick ở đầu mỗi dòng (và ô tick "chọn tất cả" trên tiêu đề cột) cho <b>chọn nhiều chỉ tiêu cùng lúc</b> — khi có dòng đang chọn, 1 thanh xanh hiện ra với nút <b>"🗑️ Xoá N mục đã chọn"</b> để xoá hàng loạt trong 1 lần, thay vì xoá từng dòng; xoá hàng loạt luôn hỏi xác nhận rồi bắt <b>nhập mật khẩu Admin</b> (giống mật khẩu Force sửa/xoá dữ liệu ca ở tab Dữ liệu) trước khi thực sự xoá.</p>
    <h4>22. Mỗi điểm kiểm tra = 1 Công đoạn + 1 PO riêng</h4>
    <p>Khác với trước đây (1 ca chỉ có 1 PO chung), giờ mỗi điểm kiểm tra tự chọn PO riêng của nó. Nhờ vậy 1 ca có thể có nhiều PO chạy song song ở các công đoạn khác nhau, hoặc thậm chí nhiều PO khác nhau cùng 1 công đoạn (VD: 2 mẻ Trích ly liên tiếp) — mỗi cái là 1 điểm kiểm tra riêng biệt, không đè lên nhau. Khi bắt đầu nhập, app tự gợi ý copy số liệu từ <b>lần kiểm tra gần nhất của đúng PO + Công đoạn đó</b> (không phải "ca trước" nói chung).</p>
    <h4>23. Tab Danh sách PO</h4>
    <p>Nhập trước các mã PO sẽ dùng (mỗi mã 1 dòng) — các PO này (trừ PO đã đóng) sẽ hiện thành gợi ý chọn nhanh ở tab Nhập liệu và tab Truy xuất. Không bắt buộc phải khai báo trước — vẫn gõ tay được mã PO mới bất kỳ lúc nào. Tab này cũng cho xuất/nhập danh sách bằng Excel, kèm file template mẫu để điền sẵn. Phía dưới là mục <b>"Tiến độ &amp; Xác thực đóng PO"</b>: gộp tất cả điểm kiểm tra đã dùng cùng 1 PO để xem số điểm kiểm tra, mức điền dữ liệu trung bình, <b>danh sách công đoạn thực tế đã có dữ liệu</b> (không phải tỉ lệ x/8 cố định), QC tham gia. Bấm <b>"✅ Verify — Xác thực đóng PO"</b> khi hoàn thành — PO đã đóng sẽ không còn hiện trong danh sách chọn ở Nhập liệu (vẫn xem lại được, và có thể "🔓 Mở lại").</p>
    <h4>24. Recipe được truy xuất tự động từ Item Code</h4>
    <p>Không còn tab/danh sách Recipe quản lý riêng — Recipe của mỗi điểm kiểm tra được app tự động lấy theo đúng Item Code đã chọn (từ tab "Danh sách Items Code"), hiển thị ngay dưới ô Item Code ở tab Nhập liệu, không tự gõ/chọn tay được. Ở tab Specs, nút "🧬 Ghi đè" của 1 chỉ tiêu Loại Số vẫn cho khai báo LSL/LCL/UCL/USL riêng theo từng mã Recipe — ô nhập Recipe ở đó gợi ý sẵn mọi mã Recipe đang có trong Item Code Master.</p>
    <h4>25. Tab Danh sách Client</h4>
    <p>Quản lý danh sách khách hàng/Client — tên, ghi chú riêng, và highlight màu (🔴 quan trọng/rủi ro, 🟠 cần chú ý, 🟢 VIP/ưu tiên). Khi chọn Client cho 1 điểm kiểm tra ở tab Nhập liệu, nếu Client đó có ghi chú, app tự hiện banner nổi bật ngay trong form để QC không bỏ sót.</p>
    <h4>26. Client là thuộc tính của từng điểm kiểm tra</h4>
    <p>Client chọn trực tiếp khi tạo/sửa điểm kiểm tra (cùng chỗ với PO, QC) — không còn là 1 chỉ tiêu riêng trong danh sách Specs của từng công đoạn.</p>
    <h4>27. Sửa dữ liệu: cho phép đổi mã PO</h4>
    <p>Khi bấm "✎ Sửa" 1 điểm kiểm tra đã có (từ tab Dữ liệu), ô Mã PO giờ sửa được trực tiếp (Công đoạn vẫn giữ nguyên, không đổi được). Nếu đổi sang mã PO đã có sẵn 1 điểm kiểm tra khác trùng Công đoạn/Ca/Ngày, app sẽ hỏi xác nhận trước khi ghi đè.</p>
    <h4>28. Tab Data Log</h4>
    <p>Ghi lại toàn bộ lịch sử thay đổi dữ liệu: mỗi lần bấm "Lưu điểm kiểm tra", app tự so sánh giá trị cũ và mới của từng chỉ tiêu, chỉ ghi log những gì thực sự thay đổi — kèm thời gian, Ca, PO, công đoạn, QC. Lọc theo ngày hoặc theo PO để tra cứu nhanh.</p>
    <h4>29. Ảnh đính kèm hiển thị ngay trong Báo cáo</h4>
    <p>Ảnh bất thường đính kèm cho từng công đoạn giờ hiện luôn trong báo cáo (cả chế độ Theo ca và Theo PO) — 1 dải ảnh nhỏ ngay dưới các chỉ tiêu của công đoạn đó, tối đa 6 ảnh/công đoạn trong bản ảnh PNG (nếu nhiều hơn sẽ ghi "+N"). Áp dụng cho cả 3 định dạng xuất: ảnh PNG, PDF (in trang), và HTML đầy đủ.</p>
    <h4>30. Xuất báo cáo HTML đầy đủ (đẹp, có ảnh)</h4>
    <p>Ở tab Báo cáo, chọn "Định dạng khác..." → <b>"🌐 Xuất báo cáo HTML đầy đủ (đẹp, có ảnh)"</b> — tạo 1 file .html độc lập, mở được bằng bất kỳ trình duyệt nào, không cần app. Bố cục dạng thẻ (card) rõ ràng theo từng công đoạn, có ô thống kê tổng quan, và <b>toàn bộ ảnh đính kèm hiển thị đầy đủ độ phân giải gốc</b> dạng lưới ảnh — chạm vào ảnh để xem full-size ở tab mới. Phù hợp khi cần gửi báo cáo đẹp, đầy đủ hình ảnh cho khách hàng hoặc lưu hồ sơ.</p>
    <h4>31. Kiến trúc bản Online (GitHub + Cloudflare)</h4>
    <p>Bản này (<code>index.html</code>) khác với bản offline gốc (<code>Shiftly_Report_App.html</code>) ở 1 điểm duy nhất: có thêm khả năng đồng bộ dữ liệu qua mạng, kèm đăng nhập tài khoản thật. Mã nguồn giao diện (chính file <code>index.html</code> này) được lưu trên GitHub và publish bằng GitHub Pages (địa chỉ web không đổi); dữ liệu thật lưu ở Cloudflare — điểm kiểm tra, cấu hình và tài khoản nằm trong cơ sở dữ liệu D1, ảnh đính kèm nằm trong kho R2. App gọi thẳng vào 1 Cloudflare Worker (các hàm <code>/rpc/sync_*</code>), xác thực bằng phiên đăng nhập thật của từng người (xem mục 1b); Worker tự kiểm tra người gọi còn là tài khoản hoạt động và đúng vai trò ở MỌI lần gọi. Việc tạo/vô hiệu hóa tài khoản chạy qua route quản trị của chính Worker (chỉ Admin). Xem thư mục <code>cloudflare/</code> trong mã nguồn (<code>schema.sql</code>, <code>src/worker.js</code>, <code>README.md</code>) để biết chi tiết triển khai.</p>
    <h4>32. Ảnh chụp từ nhiều máy hiển thị lẫn nhau</h4>
    <p>Ảnh đính kèm chụp trên 1 máy đi kèm luôn trong dữ liệu của điểm kiểm tra đó (không tách riêng) — nên ngay khi 1 máy khác đồng bộ nhận được điểm kiểm tra, ảnh cũng đã có sẵn, xem được ngay kể cả trong Báo cáo (PNG/PDF/HTML đầy đủ) mà không cần tải thêm bước nào. Ảnh vừa chụp nhưng máy chưa kịp đồng bộ (đang chờ mạng) sẽ chỉ hiện được trên đúng máy đã chụp cho tới khi đồng bộ xong.</p>
    <h4>33. Item Code</h4>
    <p>Mỗi điểm kiểm tra có ô <b>Item Code</b> — nhập tay đúng 8 chữ số, KHÔNG có danh sách gợi ý sẵn (khác PO). App tự tra trong Item Code Master (tab Danh sách Items Code) để điền sẵn Tên sản phẩm + Recipe (xem mục 37). Hiện ở bảng Dữ liệu, trang Chi tiết, danh sách điểm kiểm tra trong Nhập liệu, và các file CSV/Excel xuất ra (cột "ItemCode", ngay sau cột PO) — kể cả file sao lưu/phục hồi JSON.</p>
    <h4>34. Xuất theo mẫu Process/QMS (Excel/PDF)</h4>

    <p>File xuất ra đúng bố cục mẫu: mỗi Công đoạn 1 khối riêng (Date, Shift, Process, Item Code, PO, ISSUES/Abnormal, ACTION + các cột chỉ tiêu QMS của công đoạn đó), ngày theo định dạng <code>dd/mm/yyyy</code> (VD: 19/09/2026, giống mọi ngày khác trong app), <b>không kèm ảnh đính kèm</b>. Cột ISSUES/Abnormal tự lấy từ ô "Issue/ Abnormal" sẵn có của từng công đoạn. Cột ACTION chỉ có dữ liệu nếu công đoạn đó có 1 chỉ tiêu tên "Action" (thêm qua tab Specs, kiểu "Ghi chú", nếu cần). <b>Các cột QMS phải tự đánh dấu trước</b> ở tab Specs → sửa từng chỉ tiêu → tick "Xuất trong báo cáo QMS" (mặc định LUÔN bỏ chọn, kể cả trên thiết bị mới — tự chọn đúng chỉ tiêu cần, có thể đặt tên cột ngắn gọn riêng, VD chỉ tiêu "Color: 45 ± 2" đặt tên cột là "Color") — app không tự đoán chỉ tiêu nào là QMS vì tên gọi khác nhau tuỳ nhà máy.</p>
    <h4>35. Thư mục lưu xuất tự động</h4>

    <h4>36. Tab Danh sách Items Code</h4>
