    <p>Để cập nhật hàng loạt sau này: bấm <b>"⬇️ Tải template mẫu"</b> để có file Excel đúng định dạng, điền thêm dòng mới vào rồi bấm <b>"📥 Nhập từ Excel"</b> — dòng trùng cả Loại + Item Code + Tên sản phẩm sẽ tự bỏ qua (không tạo trùng lặp), dòng mới sẽ được thêm vào. Bấm <b>"⬆️ Xuất Excel"</b> để tải toàn bộ danh sách hiện tại ra file. Lưu ý: cũng như các tab danh sách khác (PO/Recipe/Client), file Excel ở đây dùng đúng định dạng ".xls" mà chính app này tự xuất ra — 1 file ".xlsx" gốc khác (vd tải trực tiếp từ Excel/Google Sheets) cần dán lại dữ liệu vào đúng file template trước khi nhập vào app.</p>
    <h4>37. Quy trình nhập liệu mới (kiểm soát chặt hơn)</h4>
    <p>Tab Nhập liệu đi theo đúng thứ tự: <b>Ngày → Ca → QC → Công đoạn → Item Code → Tên sản phẩm/Recipe (tự động) → Mã PO → các chỉ tiêu công đoạn → Issue/Abnormal &amp; Action → Lưu</b>. Ca/QC/Công đoạn không còn tự chọn sẵn nữa — phải tự chọn (chưa chọn Ca thì cả tab chưa hiện gì, đúng ý "chưa có Ca thì chưa có gì để lưu"). Công đoạn khi TẠO MỚI chỉ còn 5 lựa chọn: Rang (ROA), Trích ly (EXT), Cô đặc (EVA), Sấy thăng hoa (FD), Đóng gói (F&amp;P) — Tổng kết ca (META) không còn tạo mới được nhưng dữ liệu lịch sử vẫn xem/sửa/xuất báo cáo bình thường. <b>Tạo bọt (Foaming) và Tái chế (Rework) đã bị xoá hẳn khỏi danh sách công đoạn của app</b> (không chỉ ẩn khi tạo mới) — checkpoint Foaming/Rework đã lưu từ trước vẫn còn nguyên trong dữ liệu, chỉ không còn hiển thị đẹp/xuất báo cáo được như các công đoạn khác nữa.</p>
    <p>Ô Item Code vừa gõ tay vừa <b>tìm/chọn từ danh sách có sẵn</b> (gõ vài số đầu sẽ hiện gợi ý các mã đã có trong Item Code Master, giống hệt cách chọn PO) — chọn xong hoặc rời khỏi ô đó (bấm sang ô khác), Tên sản phẩm và Recipe tự điền (chỉ đọc, không sửa tay) từ đúng dữ liệu tab Danh sách Items Code. Không tìm thấy mã, mã có nhiều bản ghi mâu thuẫn nhau, hoặc mã chưa có Recipe trong Item Code Master đều báo lỗi rõ ràng và <b>chặn lưu</b> cho tới khi sửa đúng (đúng 8 chữ số). Mã PO phải đúng 9 chữ số, hoặc gõ "SHUTDOWN" (không phân biệt hoa/thường, tự chuyển thành chữ hoa) — với 1 điểm kiểm tra MỚI, app kiểm tra ngay khi gõ: sai định dạng thì hiện cảnh báo và <b>chưa mở phần chỉ tiêu phía dưới</b> (không cần đợi tới lúc bấm Lưu mới biết sai). <b>Riêng PO = SHUTDOWN thì Item Code KHÔNG bắt buộc</b> (nhãn ô tự đổi thành "không bắt buộc") — vì ca dừng máy không gắn với 1 sản phẩm cụ thể nào; để trống vẫn lưu được bình thường (Recipe để trống theo), còn nếu vẫn gõ vào thì mã đó vẫn được kiểm tra/tra cứu như bình thường. 1 PO = 1 Item Code (mục dưới) cũng không áp dụng cho SHUTDOWN.</p>
    <p>Issue/Abnormal và Action giờ nhập theo từng CẶP dòng, bấm "+ Thêm Issue/Action" nếu cần nhiều dòng — dòng nào đã gõ Issue thì bắt buộc phải gõ Action tương ứng (và ngược lại), dòng để trống hoàn toàn thì bỏ qua, không chặn lưu. Dữ liệu vẫn tương thích ngược 100% với các báo cáo/Excel/QMS đã có (App tự ghép lại vào đúng ô "Issue/ Abnormal" quen thuộc khi lưu).</p>
  </div>`;
}

/* ===================== EXPORT HELPERS ===================== */
function downloadBlob(blob, filename){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}
// Tries the Web Share API for a file; on ANY failure, unsupported API,
// or unavailable secure-context (e.g. file:// on some browsers), it
// silently falls back to a direct download instead of surfacing an error.
async function robustShareOrDownload(file, opts){
  opts = opts || {};
  try{
    if(typeof navigator.share === 'function' && navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title: opts.title || 'Shiftly Report'});
      return true;
    }
  }catch(e){
    if(e && e.name === 'AbortError') return false; // user cancelled the share sheet
    console.error(e);
  }
  try{
    downloadBlob(file, file.name);
    toast(opts.fallbackMsg || 'Đã tải file về máy (chia sẻ trực tiếp không khả dụng trên trình duyệt này)');
  }catch(e2){
    console.error(e2);
    toast('Không thể xuất file — vui lòng thử lại');
  }
  return false;
}
// Shares a whole batch of files in ONE action via the OS share sheet
// (Android handles multiple files natively there). Falling back to
// individual downloads is done with a short delay between each, since
// Chrome on Android blocks/queues rapid-fire multi-downloads otherwise.
async function robustShareMultipleOrDownload(files, opts){
  opts = opts || {};
  try{
    if(typeof navigator.share === 'function' && navigator.canShare && navigator.canShare({files})){
      await navigator.share({files, title: opts.title || 'Shiftly Report'});
      return true;
    }
  }catch(e){
    if(e && e.name === 'AbortError') return false;
    console.error(e);
  }
  for(let i=0;i<files.length;i++){
    downloadBlob(files[i], files[i].name);
    if(i < files.length-1) await new Promise(r=>setTimeout(r, 400));
  }
  toast(opts.fallbackMsg || `Đã tải ${files.length} file về máy (chia sẻ hàng loạt không khả dụng trên trình duyệt này)`);
  return false;
}

/* ===================== STORAGE DURABILITY (Tablet) =====================
   Trình duyệt (đặc biệt Android Chrome trên Tablet) có thể tự ý xoá dữ liệu
   IndexedDB của 1 origin dưới áp lực thiếu dung lượng máy, TRỪ KHI origin đó
   được đánh dấu "persistent". Với 1 app mà toàn bộ giá trị nằm ở việc không
   bao giờ mất dữ liệu offline, đây là lớp bảo vệ nền tảng — xin 1 lần lúc
   khởi động, không chặn/làm chậm gì nếu trình duyệt không hỗ trợ hoặc từ
   chối (một số trình duyệt tự cấp âm thầm dựa trên "site engagement", không
   phải lúc nào cũng hiện hộp thoại hỏi). Trạng thái hiện ở tab Cài đặt. */
let storagePersisted = null; // null = chưa biết/không hỗ trợ, true/false = đã hỏi xong
async function ensureStoragePersisted(){
  try{
    if(!navigator.storage || !navigator.storage.persist){ storagePersisted = null; return; }
    const already = await navigator.storage.persisted();
    storagePersisted = already || await navigator.storage.persist();
  }catch(e){ console.error(e); storagePersisted = null; }
}

/* ===================== AUTO-SAVE FOLDER (File System Access API) =====================
   "Cho phép thiết đặt 1 lần ổ đĩa lưu khi xuất về" — chọn 1 thư mục MỘT LẦN
   (Chrome/Edge trên máy tính; API này không tồn tại trên Safari/Firefox và
   không có trên trình duyệt di động, kể cả Chrome Android — những nơi đó tự
   rơi về hộp thoại tải/chia sẻ file bình thường, không có gì hỏng cả).
   FileSystemDirectoryHandle clone được vào IndexedDB (hỗ trợ sẵn trên
   Chromium từ bản 86+), nên chọn 1 lần là nhớ mãi — mỗi lần ghi file sau đó
   chỉ cần xin lại quyền (queryPermission/requestPermission), không cần chọn
   lại thư mục. Chỉ áp dụng cho các file app tự tạo ra (Blob) như Excel/CSV —
   xuất PDF (qua hộp thoại In của trình duyệt) do chính trình duyệt kiểm
   soát việc lưu, không thể tự động hoá bước đó. */
let saveDirHandle = null;
async function loadSaveDirHandle(){
  try{
    const rec = await idbGet('meta','saveDirHandle');
    if(rec && rec.value) saveDirHandle = rec.value;
  }catch(e){ console.error(e); }
}
async function pickSaveDirectory(){
  if(!window.showDirectoryPicker){ toast('Trình duyệt này không hỗ trợ chọn thư mục lưu tự động (chỉ Chrome/Edge trên máy tính)'); return; }
  try{
    const handle = await window.showDirectoryPicker({mode:'readwrite'});
    await idbPut('meta', {k:'saveDirHandle', value: handle});
    saveDirHandle = handle;
    toast('Đã chọn thư mục lưu: ' + handle.name);
    renderSettings();
  }catch(e){ if(e && e.name!=='AbortError'){ console.error(e); toast('Không chọn được thư mục'); } }
}
async function clearSaveDirectory(){
  saveDirHandle = null;
  await idbDelete('meta','saveDirHandle');
  toast('Đã bỏ chọn thư mục lưu tự động — xuất file sẽ quay về tải/chia sẻ thủ công');
  renderSettings();
}
async function ensureSaveDirPermission(){
  if(!saveDirHandle) await loadSaveDirHandle();
  if(!saveDirHandle) return null;
  try{
    if(await saveDirHandle.queryPermission({mode:'readwrite'}) === 'granted') return saveDirHandle;
    if(await saveDirHandle.requestPermission({mode:'readwrite'}) === 'granted') return saveDirHandle;
  }catch(e){ console.error(e); }
  return null;
}
// Every export button in the app should call THIS instead of
// robustShareOrDownload() directly whenever it's producing a file the app
// itself created (a real Blob/File) — it writes straight into the chosen
// folder when one is configured+permitted, and transparently falls back to
// the normal share/download prompt otherwise (unconfigured, permission
// denied, or an unsupported browser).
async function exportFileToPreferredLocation(file, opts){
  const dir = await ensureSaveDirPermission();
  if(dir){
    try{
      const fh = await dir.getFileHandle(file.name, {create:true});
      const writable = await fh.createWritable();
      await writable.write(file);
      await writable.close();
      toast(`Đã lưu "${file.name}" vào thư mục đã chọn`);
      return true;
    }catch(e){ console.error(e); /* rơi xuống tải/chia sẻ thủ công bên dưới */ }
  }
  await robustShareOrDownload(file, opts);
  return false;
}

/* ===================== XUẤT THEO MẪU PROCESS/QMS (Excel/PDF) =====================
   Layout theo file mẫu người dùng cung cấp: nhóm theo Công đoạn (Process),
   mỗi nhóm chỉ có các cột QMS đã đánh dấu "isQMS" trong Specs (tab Specs) —
   không đoán/hard-code cột nào ứng với chỉ tiêu nào, vì tên cột QMS (VD
   "%TC", "Sediment set tank 2") có thể khớp nhiều chỉ tiêu khác nhau tuỳ
   nhà máy — Admin tự đánh dấu đúng chỉ tiêu của mình. Cột ISSUES/Abnormal
   luôn lấy từ field có id kết thúc "_ISSUE" (đã có sẵn, đồng nhất, ở mọi
   công đoạn). Cột ACTION lấy từ 1 field tuỳ chọn có id kết thúc "_ACTION"
   hoặc tên đúng "Action" — nếu công đoạn chưa có field này (Specs), cột để
   trống — thêm field đó qua tab Specs (kiểu "Ghi chú") nếu cần dùng cột này.
   Không xuất ảnh — đúng yêu cầu "không xuất hình". */
// "Xuất trong báo cáo QMS" (isQMS) mặc định LUÔN bỏ chọn cho mọi chỉ tiêu,
// kể cả trên thiết bị mới — người dùng tự tick từng chỉ tiêu cần thiết ở tab
// Specs. (Trước đây có seedQmsDefaults() tự tích sẵn ~13 chỉ tiêu khớp rõ
// với file mẫu QMS — đã BỎ theo yêu cầu người dùng 2026-09-21: "mặc định bỏ
// chọn". Nếu 1 thiết bị nào đó đã từng chạy bản cũ và có isQMS:true tồn dư,
// tự bỏ tick lại ở bảng Specs — giờ sửa trực tiếp trong bảng rất nhanh.)
// Trước đây Xuất Excel/PDF theo mẫu Process/QMS dùng riêng định dạng
// "d-mmm-yyyy" (VD: 19-Sep-2026) để khớp numfmt của 1 file mẫu thật — theo
// yêu cầu người dùng 2026-09-21 ("Tất cả định dạng ngày trong html này đều
// là dd/mm/yyyy"), đã bỏ ngoại lệ này: fmtDateExport giờ chỉ gọi thẳng
// fmtDateVN (dd/mm/yyyy) — giữ nguyên hàm riêng (thay vì `const ... = fmtDateVN`)
// vì đây là function DECLARATION nên vẫn lên `window` như trước, tránh phá
// vỡ chỗ nào lỡ gọi qua `window.fmtDateExport` (VD test harness).
function fmtDateExport(iso){ return fmtDateVN(iso); }
function processQmsFieldsFor(sec){
  const issueField = sec.fields.find(f=>/_ISSUE$/i.test(f.id));
  const actionField = sec.fields.find(f=>/_ACTION$/i.test(f.id) || /^action$/i.test((f.label||'').split('\n')[0].trim()));
  const qmsFields = sec.fields.filter(f=>f.isQMS);
  return {issueField, actionField, qmsFields};
}
function qmsCellDisplay(f, v){
  if(v===undefined || v===null || v==='') return '';
  if(f.type==='boolean') return v===true ? boolLabels(f).t : (v===false ? boolLabels(f).f : '');
  return v;
}
function processQmsSections(rows){
  return SCHEMA.filter(s=>s.id!=='META').map(sec=>({
    sec, rows: rows.filter(r=>r.section===sec.id).sort((a,b)=>(a.date+a.shift+a.po).localeCompare(b.date+b.shift+b.po)),
  })).filter(g=>g.rows.length>0);
}
// Bảng Gantt Process x Date x Shift dạng SpreadsheetML — 1 sheet riêng
// ("Gantt"), dùng CHUNG dữ liệu (buildGanttBaseData) với ảnh SVG/bảng HTML
// tương tác ở tab Báo cáo nên luôn khớp nhau tuyệt đối. Thanh Gantt vẽ bằng
// 1 ô ss:MergeAcross tô màu (style "ganttBar"), header đậm màu style
// "ganttHdr" — cả 2 style được khai báo sẵn trong <Styles> của
// buildProcessQmsExcelXml() (luôn có, không tốn thêm gì khi không dùng).
function buildGanttExcelSheet(poLabel, base){
  const {cols, dateGroups, cpIndex, bySection, presentSections} = base;
  const plainCell = v => (v===undefined||v===null||v==='') ? '<Cell/>' : `<Cell><Data ss:Type="String">${xmlEscape(v)}</Data></Cell>`;
  const hdrCell = (v, span) => `<Cell ss:StyleID="ganttHdr"${span>1?` ss:MergeAcross="${span-1}"`:''}><Data ss:Type="String">${xmlEscape(v)}</Data></Cell>`;
  const emptyCells = n => '<Cell/>'.repeat(Math.max(0,n));
  let xml = `<Worksheet ss:Name="Gantt"><Table>\n`;
  xml += `<Row>${plainCell('ITEM CODE')}${plainCell(base.itemCode||'—')}</Row>\n`;
  xml += `<Row>${plainCell('ITEM NAME')}${plainCell(base.itemName||'—')}</Row>\n`;
  xml += `<Row>${plainCell('PO')}${plainCell(poLabel)}</Row>\n`;
  xml += `<Row>${plainCell('RECIPE')}${plainCell(base.recipe||'—')}</Row>\n`;
  xml += `<Row></Row>\n`;
  if(cols.length===0){
    xml += `<Row>${plainCell('— Không có dữ liệu nào cho PO này —')}</Row>\n</Table></Worksheet>`;
    return xml;
  }
  xml += '<Row>' + hdrCell('Process / Information', 1) + dateGroups.map(g=>hdrCell(fmtDateExport(g.date), g.span)).join('') + '</Row>\n';
  xml += '<Row>' + hdrCell('', 1) + cols.map(c=>hdrCell('Ca '+c.shift, 1)).join('') + '</Row>\n';
  presentSections.forEach(id=>{
    const sec = sectionById(id);
    const {startIdx, endIdx} = ganttProcessRange(cols, bySection[id]);
    xml += '<Row>' + hdrCell(GANTT_PROCESS_LABELS[id]||id, 1);
    if(startIdx>=0){
      xml += emptyCells(startIdx);
      xml += `<Cell ss:StyleID="ganttBar"${(endIdx-startIdx)>0?` ss:MergeAcross="${endIdx-startIdx}"`:''}/>`;
      xml += emptyCells(cols.length-1-endIdx);
    } else {
      xml += emptyCells(cols.length);
    }
    xml += '</Row>\n';
    xml += '<Row>' + plainCell('Issues/Abnormal') + cols.map(c=>plainCell(ganttCellText(cpIndex[id+'|'+c.date+'|'+c.shift], sec, 'issue'))).join('') + '</Row>\n';
    xml += '<Row>' + plainCell('Action') + cols.map(c=>plainCell(ganttCellText(cpIndex[id+'|'+c.date+'|'+c.shift], sec, 'action'))).join('') + '</Row>\n';
  });
  xml += `</Table></Worksheet>`;
  return xml;
}
// gantt (tuỳ chọn, mặc định false/undefined — không đổi gì hành vi xuất từ
// Theo ca): {poLabel, matches} — thêm 1 sheet "Gantt" trước sheet "Data
// Export" hiện có, dựng từ buildGanttBaseData(matches).
function buildProcessQmsExcelXml(rows, gantt){
  let xml = `<?xml version="1.0"?>\n<?mso-application progid="Excel.Sheet"?>\n`;
  xml += `<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">\n`;
  xml += `<Styles><Style ss:ID="hdr"><Font ss:Bold="1"/><Interior ss:Color="#EEF1F6" ss:Pattern="Solid"/></Style>`;
  xml += `<Style ss:ID="ganttHdr"><Font ss:Bold="1" ss:Color="#FFFFFF"/><Interior ss:Color="#0B1220" ss:Pattern="Solid"/><Alignment ss:Horizontal="Center"/></Style>`;
  xml += `<Style ss:ID="ganttBar"><Interior ss:Color="#0D9488" ss:Pattern="Solid"/></Style></Styles>\n`;
  if(gantt) xml += buildGanttExcelSheet(gantt.poLabel, buildGanttBaseData(gantt.matches));
  xml += `<Worksheet ss:Name="Data Export"><Table>\n`;
  const strCell = v => (v===undefined||v===null||v==='') ? '<Cell/>' : `<Cell><Data ss:Type="String">${xmlEscape(v)}</Data></Cell>`;
  const numCell = v => (v===undefined||v===null||v==='') ? '<Cell/>' : `<Cell><Data ss:Type="Number">${Number(v)}</Data></Cell>`;
  const hdrCell = v => `<Cell ss:StyleID="hdr"><Data ss:Type="String">${xmlEscape(v)}</Data></Cell>`;
  processQmsSections(rows).forEach(({sec, rows:secRows})=>{
    const {issueField, actionField, qmsFields} = processQmsFieldsFor(sec);
    const headers = ['Date','Shift','Process','Item Code','PO','ISSUES/ Abnormal','ACTION', ...qmsFields.map(f=>f.qmsLabel || f.label.split('\n')[0])];
    xml += '<Row>' + headers.map(hdrCell).join('') + '</Row>\n';
    secRows.forEach(r=>{
      let cells = strCell(fmtDateExport(r.date));
      cells += numCell(r.shift);
      cells += strCell(sec.id);
      cells += strCell(r.itemCode||'');
      cells += strCell(r.po||'');
      cells += strCell(issueField ? (r.fields[issueField.id]||'') : '');
      cells += strCell(actionField ? (r.fields[actionField.id]||'') : '');
      qmsFields.forEach(f=>{
        const v = qmsCellDisplay(f, r.fields[f.id]);
        cells += (f.type==='number' && typeof v==='number') ? numCell(v) : strCell(v);
      });
      xml += `<Row>${cells}</Row>\n`;
    });
  });
  xml += `</Table></Worksheet></Workbook>`;
  return xml;
}
// Bảng Gantt dạng HTML tĩnh (không có nút bấm sửa — chỉ để in/PDF), giống
// hệt cấu trúc bảng tương tác renderPOTimeline() nhưng dựng bằng chuỗi HTML
// thay vì DOM, dùng chung buildGanttBaseData() nên luôn khớp bảng xem trước.
function buildGanttPrintHtml(poLabel, base){
  const {cols, dateGroups, cpIndex, bySection, presentSections} = base;
  let html = `<h1>PO Production Timeline</h1>`;
  html += `<table class="gantthdr"><tr><td><b>ITEM CODE</b></td><td>${escapeHtml(base.itemCode||'—')}</td></tr>`;
  html += `<tr><td><b>ITEM NAME</b></td><td>${escapeHtml(base.itemName||'—')}</td></tr>`;
  html += `<tr><td><b>PO</b></td><td>${escapeHtml(poLabel)}</td></tr>`;
  html += `<tr><td><b>RECIPE</b></td><td>${escapeHtml(base.recipe||'—')}</td></tr></table>`;
  if(cols.length===0){ html += '<p>— Không có dữ liệu nào cho PO này —</p>'; return html; }
  html += '<table class="gantt"><thead><tr><th>Process / Information</th>';
  dateGroups.forEach(g=>{ html += `<th colspan="${g.span}">${escapeHtml(fmtDateExport(g.date))}</th>`; });
  html += '</tr><tr><th></th>';
  cols.forEach(c=>{ html += `<th>Ca ${escapeHtml(c.shift)}</th>`; });
  html += '</tr></thead><tbody>';
  presentSections.forEach(id=>{
    const sec = sectionById(id);
    const {startIdx, endIdx} = ganttProcessRange(cols, bySection[id]);
    html += `<tr><th class="ganttlbl">${escapeHtml(GANTT_PROCESS_LABELS[id]||id)}</th>`;
    cols.forEach((c,i)=>{
      if(i===startIdx) html += `<td colspan="${endIdx-startIdx+1}" class="ganttbar"></td>`;
      else if(i>startIdx && i<=endIdx){ /* gộp vào ô colspan phía trên */ }
      else html += '<td></td>';
    });
    html += '</tr>';
    html += `<tr><th class="ganttlbl sub">Issues/Abnormal</th>` + cols.map(c=>`<td>${escapeHtml(ganttCellText(cpIndex[id+'|'+c.date+'|'+c.shift], sec, 'issue'))}</td>`).join('') + '</tr>';
    html += `<tr><th class="ganttlbl sub">Action</th>` + cols.map(c=>`<td>${escapeHtml(ganttCellText(cpIndex[id+'|'+c.date+'|'+c.shift], sec, 'action'))}</td>`).join('') + '</tr>';
  });
  html += '</tbody></table>';
  return html;
}
// landscape (tuỳ chọn, mặc định false = giữ nguyên khổ dọc như trước): bật
// khi bảng có nhiều cột hơn bình thường (VD: xuất từ chế độ Theo PO — PO có
// thể chạy qua nhiều Công đoạn, mỗi Công đoạn 1 khối cột QMS riêng) — chỉ
// đổi @page CSS cho lần in này, không ảnh hưởng cỡ giấy mặc định của trình
// duyệt hay các bản in khác. gantt (tuỳ chọn): {poLabel, matches} — chèn
// thêm bảng Gantt (buildGanttPrintHtml) phía TRƯỚC bảng QMS hiện có.
function buildProcessQmsPrintHtml(rows, landscape, gantt){
  const groups = processQmsSections(rows);
  let html = `<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><title>Shiftly — Xuất dữ liệu theo mẫu</title>
<style>
*{box-sizing:border-box;} body{font-family:Arial,Helvetica,sans-serif;color:#0F172A;margin:0;padding:16px;font-size:11px;}
h1{font-size:15px;margin:0 0 12px;}
table{width:100%;border-collapse:collapse;margin:0 0 16px;}
th,td{border:1px solid #94A3B8;padding:4px 6px;text-align:left;}
th{background:#EEF1F6;font-weight:700;}
.sectitle{font-weight:700;background:#0B1220;color:#fff;padding:5px 8px;margin:14px 0 6px;border-radius:4px;}
table.gantthdr{width:auto;margin:0 0 14px;} table.gantthdr td{border:none;padding:2px 8px 2px 0;}
table.gantt th{text-align:center;white-space:nowrap;} table.gantt td{text-align:center;}
th.ganttlbl{text-align:left;background:#fff;font-weight:700;} th.ganttlbl.sub{font-weight:600;color:#64748B;font-size:9.5px;text-transform:uppercase;}
td.ganttbar{background:#0D9488;}
@media print{ .sectitle,th,td.ganttbar{-webkit-print-color-adjust:exact;print-color-adjust:exact;} }
${landscape ? '@page{size:landscape;}' : ''}
</style></head><body>
${gantt ? buildGanttPrintHtml(gantt.poLabel, buildGanttBaseData(gantt.matches)) : ''}
<h1>ILD Coffee Vietnam — Xuất dữ liệu (${rows.length} điểm kiểm tra)</h1>`;
  if(groups.length===0) html += '<p>Không có dữ liệu phù hợp.</p>';
  groups.forEach(({sec, rows:secRows})=>{
    const {issueField, actionField, qmsFields} = processQmsFieldsFor(sec);
    html += `<div class="sectitle">${escapeHtml(sec.name)} (${escapeHtml(sec.id)})</div>`;
    const headers = ['Date','Shift','Process','Item Code','PO','ISSUES/ Abnormal','ACTION', ...qmsFields.map(f=>f.qmsLabel || f.label.split('\n')[0])];
    html += '<table><thead><tr>' + headers.map(h=>`<th>${escapeHtml(h)}</th>`).join('') + '</tr></thead><tbody>';
    secRows.forEach(r=>{
      const cells = [fmtDateExport(r.date), r.shift, sec.id, r.itemCode||'', r.po||'',
        issueField ? (r.fields[issueField.id]||'') : '', actionField ? (r.fields[actionField.id]||'') : ''];
      qmsFields.forEach(f=>cells.push(qmsCellDisplay(f, r.fields[f.id])));
      html += '<tr>' + cells.map(c=>`<td>${escapeHtml(c===undefined||c===null?'':String(c))}</td>`).join('') + '</tr>';
    });
    html += '</tbody></table>';
  });
  html += `<div style="text-align:right;color:#64748B;font-size:10px;">Xuất lúc: ${fmtDateTimeVN(Date.now())}</div>`;
  html += '</body></html>';
  return html;
}

/* ===================== BOOT ===================== */
function renderAll(){
  applyTabConfig();
  renderInputGate();
  const active = qs('.tab[aria-selected="true"]');
  if(active && active.dataset.tab!=='input') showTab(active.dataset.tab);
}
(async function init(){
  DB = await idbOpen();
  await loadCloudState();
  await loadSaveDirHandle();
  ensureStoragePersisted(); // không await — không cần chặn boot để chờ hộp thoại quyền (nếu có)
  const metaTabConfig = await idbGet('meta','tabConfig');
  if(metaTabConfig && metaTabConfig.value) TAB_CONFIG = migrateTabConfig(metaTabConfig.value);
  const metaTech = await idbGet('meta','technicians');
  if(metaTech && Array.isArray(metaTech.value) && metaTech.value.length) TECHNICIANS = metaTech.value;
  const metaSchema = await idbGet('meta','schema');
  if(metaSchema && Array.isArray(metaSchema.value) && metaSchema.value.length) SCHEMA = metaSchema.value;
  else await idbPut('meta', {k:'schema', value: SCHEMA});
  // Defensive migration: older saved schemas may still use the 2-band
  // min/max keys — fold them into hardMin/hardMax (LSL/USL) on load.
  let migrated = false;
  SCHEMA.forEach(s=>s.fields.forEach(f=>{
    if(f.type==='number' && (f.min!==undefined || f.max!==undefined)){
      if(f.hardMin===undefined && f.min!==undefined) f.hardMin = f.min;
      if(f.hardMax===undefined && f.max!==undefined) f.hardMax = f.max;
      delete f.min; delete f.max;
      migrated = true;
    }
  }));
  // Dọn các công đoạn đã bị xoá hẳn (hiện: FOAMING) khỏi 1 SCHEMA đã lưu từ
  // trước — xem comment ở stripRemovedSections(). Checkpoint FOAMING đã lưu
  // KHÔNG bị đụng tới, chỉ không còn là 1 công đoạn hợp lệ trong
  // Specs/Báo cáo/Gantt nữa.
  const cleanedSchema = stripRemovedSections(SCHEMA);
  if(cleanedSchema !== SCHEMA){ SCHEMA = cleanedSchema; migrated = true; }
  if(migrated) await saveSchema();
  if(!stageIds().includes(currentStage)) currentStage = stageIds()[0];
  const metaPoClosures = await idbGet('meta','poClosures');
  if(metaPoClosures && metaPoClosures.value) poClosures = metaPoClosures.value;
  const metaPoList = await idbGet('meta','poList');
  if(metaPoList && Array.isArray(metaPoList.value)) PO_LIST = metaPoList.value;
  const metaClientList = await idbGet('meta','clientList');
  if(metaClientList && Array.isArray(metaClientList.value)) CLIENT_LIST = metaClientList.value;
  const metaItemCodeList = await idbGet('meta','itemCodeList');
  if(metaItemCodeList && Array.isArray(metaItemCodeList.value) && metaItemCodeList.value.length) ITEM_CODE_LIST = metaItemCodeList.value;
  await loadEgressFromIdb();
  await refreshCache();
  if(allCheckpoints.length===0){
    const backup = localStorage.getItem('shiftly_backup');
    if(backup){
      try{
        const records = JSON.parse(backup);
        for(const r of records) await idbPut('shifts', r);
        await refreshCache();
      }catch(e){}
    }
  }
  // One-time migration: records from before the checkpoint model have a
  // `.stages` object and no `.section` — split each into the new
  // per-section-per-PO checkpoint shape, then remove the old record.
  const legacyRecords = allCheckpoints.filter(r=>r.section===undefined);
  if(legacyRecords.length>0){
    let createdCount = 0;
    for(const old of legacyRecords){
      const newCps = splitLegacyIntoCheckpoints(old);
      for(const cp of newCps){ await idbPut('shifts', cp); createdCount++; }
      await idbDelete('shifts', old.key);
    }
    await refreshCache();
    await persistAll();
    toast(`Đã tự động chuyển đổi ${legacyRecords.length} ca cũ sang ${createdCount} điểm kiểm tra`);
  }
  updateCloudPill();
  if(cloudConfigured()){ await checkAccessGate(); } // shows login gate or the app + starts sync, once verified
  else { showApp(); renderAll(); }
})();

</script>
