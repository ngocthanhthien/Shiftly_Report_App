function compressImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      let w=img.width, h=img.height;
      if(w>maxDim || h>maxDim){
        if(w>h){ h = Math.round(h*maxDim/w); w=maxDim; } else { w = Math.round(w*maxDim/h); h=maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('image load failed')); };
    img.src = url;
  });
}
// Custom autocomplete (replaces native <datalist>, which has a long-standing
// unfixed Chromium bug and simply does not show suggestions on Android
// Chrome — confirmed on Chrome 8+ / still broken as of MDN's compatibility
// notes). Built purely with JS/DOM so it works reliably on every device.
function renderAutocomplete(value, options, placeholder, onChange){
  const wrap = el('div',{class:'ac-wrap'},[]);
  const inp = el('input',{class:'inp', type:'text', placeholder: placeholder||'', autocomplete:'off'},[]);
  inp.value = value||'';
  const list = el('div',{class:'ac-list'},[]);
  wrap.appendChild(inp);
  wrap.appendChild(list);
  function commit(){ if(onChange) onChange(inp.value.trim()); }
  function showSuggestions(){
    const q = inp.value.trim().toLowerCase();
    const matches = (q ? options.filter(o=>o.toLowerCase().includes(q)) : options).slice(0,8);
    list.innerHTML = '';
    if(matches.length===0){ list.style.display='none'; return; }
    matches.forEach(m=>{
      const item = el('div',{class:'ac-item'},[m]);
      const pick = (e)=>{ if(e && e.preventDefault) e.preventDefault(); inp.value=m; list.style.display='none'; commit(); };
      item.addEventListener('mousedown', pick);
      item.addEventListener('touchstart', pick);
      list.appendChild(item);
    });
    list.style.display = 'block';
  }
  inp.addEventListener('focus', showSuggestions);
  inp.addEventListener('input', showSuggestions);
  inp.addEventListener('blur', ()=>{ setTimeout(()=>{ list.style.display='none'; }, 150); commit(); });
  return { node: wrap, getValue: ()=> inp.value.trim(), setValue: v=>{ inp.value = v||''; } };
}
function renderImageAttach(cp){
  const wrap = el('div',{class:'imgattach full'},[]);
  const thumbRow = el('div',{class:'thumbrow'},[]);
  wrap.appendChild(thumbRow);
  function renderThumbs(){
    thumbRow.innerHTML='';
    const imgs = cp.images || [];
    imgs.forEach((im, idx)=>{
      const box = el('div',{class:'thumb'},[]);
      box.appendChild(el('img',{src: imgSrc(im)},[]));
      const rm = el('button',{class:'rm', type:'button'},['✕']);
      rm.addEventListener('click', async ()=>{
        cp.images.splice(idx,1);
        cp.updatedAt = new Date().toISOString();
        await idbPut('shifts', cp);
        await refreshCache();
        await persistAll();
        renderThumbs();
      });
      box.appendChild(rm);
      thumbRow.appendChild(box);
    });
  }
  renderThumbs();
  const attachInp = el('input',{type:'file', accept:'image/*', style:'display:none;'},[]);
  const cameraInp = el('input',{type:'file', accept:'image/*', capture:'environment', style:'display:none;'},[]);
  async function handleFiles(fileList){
    for(const file of Array.from(fileList)){
      try{
        const dataUrl = await compressImageFile(file, 1280, 0.72);
        cp.images = cp.images || [];
        const ts = Date.now();
        cp.images.push({name:file.name, dataUrl, ts});
        cp.updatedAt = new Date().toISOString();
        await idbPut('shifts', cp);
        await refreshCache();
        await persistAll();
      }catch(e){ console.error(e); toast('Không đọc được ảnh'); }
    }
    renderThumbs();
    toast('Đã đính kèm ảnh bất thường');
  }
  attachInp.addEventListener('change', e=>{ if(e.target.files.length) handleFiles(e.target.files); e.target.value=''; });
  cameraInp.addEventListener('change', e=>{ if(e.target.files.length) handleFiles(e.target.files); e.target.value=''; });
  const pasteZone = el('div',{class:'pastezone', tabindex:'0', contenteditable:'true'},['📋 Dán ảnh vào đây (Ctrl+V)']);
  pasteZone.addEventListener('paste', (e)=>{
    e.preventDefault();
    const items = (e.clipboardData && e.clipboardData.items) || [];
    const files = [];
    for(let i=0;i<items.length;i++){
      if(items[i].type && items[i].type.indexOf('image/')===0){
        const f = items[i].getAsFile();
        if(f) files.push(f);
      }
    }
    pasteZone.textContent = '📋 Dán ảnh vào đây (Ctrl+V)';
    if(files.length) handleFiles(files);
    else toast('Không tìm thấy ảnh trong clipboard');
  });
  wrap.appendChild(pasteZone);
  const btnRow = el('div',{class:'row', style:'margin-top:6px;'},[
    el('button',{class:'btn ghost sm', type:'button'},['📎 Đính kèm ảnh']),
    el('button',{class:'btn ghost sm', type:'button'},['📷 Chụp ảnh']),
  ]);
  const [attachBtn, cameraBtn] = qsa('button', btnRow);
  attachBtn.addEventListener('click', ()=>attachInp.click());
  cameraBtn.addEventListener('click', ()=>cameraInp.click());
  wrap.appendChild(btnRow);
  wrap.appendChild(attachInp);
  wrap.appendChild(cameraInp);
  return wrap;
}
function groupOf(f){
  if(f.id.endsWith('_RECIPE')) return 'Recipe';
  if(f.id.includes('_CLEAN_')) return 'Vệ sinh (Cleaning)';
  if(f.id.endsWith('_ISSUE')) return 'Ghi chú bất thường';
  if(f.id==='INFO_ISSUE' || f.id==='HANDOVER') return 'Bàn giao ca';
  return 'Chỉ tiêu kiểm tra';
}

function formatPrevDisplay(f, v){
  if(f.type==='boolean') return v===true?'Đạt':v===false?'Lỗi':'—';
  if(f.type==='textarea'){ const s=String(v); return s.length>36 ? s.slice(0,36)+'…' : s; }
  return String(v);
}
function prevHintRow(f, prevVal, applyFn, onCopied){
  if(prevVal===undefined || prevVal===null || prevVal==='') return null;
  const row = el('div',{class:'prevhint'},[
    el('span',{},[`Ca trước: ${formatPrevDisplay(f, prevVal)}`]),
    el('button',{class:'usebtn'},['↺ Dùng']),
  ]);
  qsa('button', row)[0].addEventListener('click', ()=>{ applyFn(prevVal); onCopied(f.id); });
  return row;
}
function renderField(f, val, prevVal, onCopied, recipeVal){
  onCopied = onCopied || function(){};
  const labText = f.label.split('\n')[0] + (f.required ? ' *' : '');
  if(f.type==='boolean'){
    let state = val===true ? 'pass' : (val===false ? 'fail' : 'unset');
    const label = el('div',{class:'txt'},[labText, f.label.includes('\n')?el('span',{class:'spec'},[f.label.split('\n').slice(1).join(' / ')]):null]);
    const btn = el('button',{class:'st-'+state},[boolDisp(f, state==='pass'?true:state==='fail'?false:null)]);
    const boolBox = el('div',{class:'boolfld'},[label, btn]);
    function setState(newState){
      state = newState;
      btn.className = 'st-'+state;
      btn.textContent = boolDisp(f, state==='pass'?true:state==='fail'?false:null);
    }
    btn.addEventListener('click', ()=>{
      setState(state==='unset' ? 'pass' : state==='pass' ? 'fail' : 'unset');
    });
    const outer = el('div',{},[boolBox]);
    const hint = prevHintRow(f, prevVal, v=>setState(v===true?'pass':v===false?'fail':'unset'), onCopied);
    if(hint) outer.appendChild(hint);
    return { node: outer, getValue: ()=> state==='unset' ? null : state==='pass', setValue: v=>setState(v===true?'pass':v===false?'fail':'unset') };
  }
  if(f.type==='select'){
    const s = el('select',{class:'inp'},[]);
    s.appendChild(el('option',{value:''},['— Chọn —']));
    (f.options||[]).forEach(o=>{ const opt=el('option',{value:o},[o]); if(val===o) opt.setAttribute('selected','selected'); s.appendChild(opt); });
    const outer = el('label',{class:'fld'},[el('span',{class:'lab'},[labText]), s]);
    const hint = prevHintRow(f, prevVal, v=>{ s.value = v; }, onCopied);
    if(hint) outer.appendChild(hint);
    return { node: outer, getValue: ()=> s.value || null, setValue: v=>{ s.value = v==null?'':v; } };
  }
  if(f.type==='textarea'){
    const t = el('textarea',{class:'inp', rows:'3', placeholder:'Nhập ghi chú...'},[]);
    t.value = val||'';
    const outer = el('label',{class:'fld'},[el('span',{class:'lab'},[labText]), t]);
    const hint = prevHintRow(f, prevVal, v=>{ t.value = v; }, onCopied);
    if(hint) outer.appendChild(hint);
    return { node: outer, getValue: ()=> t.value || '', setValue: v=>{ t.value = v||''; } };
  }
  if(f.type==='number'){
    const i = el('input',{class:'inp num', type:'text', inputmode:'decimal', placeholder:'—'},[]);
    i.value = val==null ? '' : val;
    let numRow;
    if(f.allowNegative){
      const toggleBtn = el('button',{class:'signtoggle', type:'button', title:'Đổi dấu âm / dương'},['±']);
      toggleBtn.addEventListener('click', ()=>{
        let v = i.value.trim();
        if(v.startsWith('-')) v = v.slice(1);
        else v = '-' + v;
        i.value = v;
        i.focus();
      });
      numRow = el('div',{class:'numrow'},[i, toggleBtn]);
    } else {
      numRow = i;
    }
    const spec = specText(f, recipeVal);
    const outer = el('label',{class:'fld'},[
      el('span',{class:'lab'},[labText]), numRow,
      spec ? el('span',{class:'spec'},[spec]) : null
    ]);
    const hint = prevHintRow(f, prevVal, v=>{ i.value = v; }, onCopied);
    if(hint) outer.appendChild(hint);
    return { node: outer, getValue: ()=> toNum(i.value), setValue: v=>{ i.value = v==null?'':v; } };
  }
  // text (PO / free text)
  const i = el('input',{class:'inp', type:'text'},[]);
  i.value = val||'';
  const outer = el('label',{class:'fld'},[el('span',{class:'lab'},[labText]), i]);
  const hint = prevHintRow(f, prevVal, v=>{ i.value = v; }, onCopied);
  if(hint) outer.appendChild(hint);
  return { node: outer, getValue: ()=> i.value || '', setValue: v=>{ i.value = v||''; } };
}

  const mode = renderTable._mode || 'list';
  const modeRow = el('div',{class:'row', style:'margin-bottom:12px;'},[
    el('button',{class:'btn'+(mode==='list'?' teal':' ghost')+' sm'},['📋 Danh sách ca']),

function buildSimpleListExcelXml(sheetName, colName, values){
  let xml = `<?xml version="1.0"?>\n<?mso-application progid="Excel.Sheet"?>\n`;
  xml += `<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">\n`;
  xml += `<Styles><Style ss:ID="hdr"><Font ss:Bold="1"/><Interior ss:Color="#EEF1F6" ss:Pattern="Solid"/></Style></Styles>\n`;
  xml += `<Worksheet ss:Name="${xmlEscape(sheetName)}"><Table>\n`;
  xml += `<Row><Cell ss:StyleID="hdr"><Data ss:Type="String">${xmlEscape(colName)}</Data></Cell></Row>\n`;
  values.forEach(v=>{ xml += `<Row><Cell><Data ss:Type="String">${xmlEscape(v)}</Data></Cell></Row>\n`; });
  xml += `</Table></Worksheet></Workbook>`;
  return xml;
}
function parseSimpleListExcelXml(text){
  try{
    const doc = new DOMParser().parseFromString(text, 'text/xml');
    if(doc.getElementsByTagName('parsererror').length) return null;
    const rowEls = Array.from(doc.getElementsByTagName('Row'));
    if(rowEls.length<1) return null;
    const values = [];
    rowEls.slice(1).forEach(rowEl=>{ // skip header row
      const dataEl = rowEl.getElementsByTagName('Data')[0];
      const v = dataEl ? (dataEl.textContent||'').trim() : '';
      if(v) values.push(v);
    });
    return values;
  }catch(e){ console.error(e); return null; }
}
function buildTableExcelXml(sheetName, headers, rows){
  let xml = `<?xml version="1.0"?>\n<?mso-application progid="Excel.Sheet"?>\n`;
  xml += `<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">\n`;
  xml += `<Styles><Style ss:ID="hdr"><Font ss:Bold="1"/><Interior ss:Color="#EEF1F6" ss:Pattern="Solid"/></Style></Styles>\n`;
  xml += `<Worksheet ss:Name="${xmlEscape(sheetName)}"><Table>\n`;
  xml += '<Row>' + headers.map(h=>`<Cell ss:StyleID="hdr"><Data ss:Type="String">${xmlEscape(h)}</Data></Cell>`).join('') + '</Row>\n';
  rows.forEach(row=>{
    xml += '<Row>' + row.map(v=>`<Cell><Data ss:Type="String">${xmlEscape(v||'')}</Data></Cell>`).join('') + '</Row>\n';
  });
  xml += `</Table></Worksheet></Workbook>`;
  return xml;
}
function parseTableExcelXml(text){
  try{
    const doc = new DOMParser().parseFromString(text, 'text/xml');
    if(doc.getElementsByTagName('parsererror').length) return null;
    const rowEls = Array.from(doc.getElementsByTagName('Row'));
    if(rowEls.length<1) return null;
    return rowEls.map(rowEl=>{
      const cellEls = Array.from(rowEl.getElementsByTagName('Cell'));
      return cellEls.map(cellEl=>{
        const dataEl = cellEl.getElementsByTagName('Data')[0];
        return dataEl ? (dataEl.textContent||'').trim() : '';
      });
    });
  }catch(e){ console.error(e); return null; }
}

/* ===================== REPORT TAB (image export) ===================== */
function getMeasureCtx(fontSize){
  try{
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext && canvas.getContext('2d');
    if(!ctx) return null;
    ctx.font = `${fontSize}px Arial, sans-serif`;
    return ctx;
  }catch(e){ return null; }
}
function measureTextWidth(text, fontSize, ctx){
  if(ctx){
    try{ return ctx.measureText(text).width; }catch(e){}
  }
  return String(text).length * fontSize * 0.56; // fallback heuristic (no canvas available)
}
// Wraps text to fit maxWidth, breaking on spaces first and hard-breaking
// any single "word" that's still too long on its own (e.g. a long code).
function wrapText(text, maxWidth, fontSize, ctx){
  const words = String(text).split(/\s+/).filter(Boolean);
  if(words.length===0) return [''];
  const lines = [];
  let cur = '';
  words.forEach(w=>{
    const test = cur ? cur+' '+w : w;
    if(measureTextWidth(test, fontSize, ctx) > maxWidth && cur){
      lines.push(cur);
      cur = w;
    } else {
      cur = test;
    }
  });
  if(cur) lines.push(cur);
  const out = [];
  lines.forEach(line=>{
    if(measureTextWidth(line, fontSize, ctx) <= maxWidth){ out.push(line); return; }
    let chunk = '';
    for(const ch of line){
      const test = chunk + ch;
      if(measureTextWidth(test, fontSize, ctx) > maxWidth && chunk){ out.push(chunk); chunk = ch; }
      else chunk = test;
    }
    if(chunk) out.push(chunk);
  });
  return out.length ? out : [''];
}
function renderLinesToSVG(lines, W){
  const M = 20;
  const FONT = 11.5;
  const ctx = getMeasureCtx(FONT);
  const H_TITLE=26, H_SUB=17, H_SECTION=21, H_ROW=16, H_WRAP=13.5, H_EMPTY=15, H_GAP=5, H_BAR=36, H_FOOTER=18;
  const THUMB_W=84, THUMB_H=64, THUMB_GAP=10, THUMB_PER_ROW=6;
  let clipCounter = 0;
  const colGap = 14;
  const colW = (W - 2*M - colGap) / 2;

  // First pass: turn each 'row' into a compact "Label: Value" combined
  // string (A), then pack two of them side-by-side per line whenever both
  // fit within half the page width (B). Rows whose value is too long to
  // fit even a full-width single line still wrap (unchanged behaviour),
  // but such rows are rare once combined into one string. Spacing between
  // every element is tightened throughout (C).
  const plan = [];
  let yCursor = M;
  let pending = null; // a single short row waiting for a same-row partner
  function pushEntry(entry){ entry.y = yCursor; yCursor += entry.h; plan.push(entry); }
  function flushPending(){
    if(pending){ pushEntry({t:'row-full', label:pending.label, disp:pending.disp, color:pending.color, h:H_ROW}); pending=null; }
  }
  lines.forEach(l=>{
    if(l.t==='row'){
      const dispStr = l.disp===undefined || l.disp===null ? '' : String(l.disp);
      const combined = dispStr ? `${l.label}: ${dispStr}` : `${l.label}: —`;
      const combinedW = measureTextWidth(combined, FONT, ctx);
      const fitsHalf = dispStr.indexOf('\n')===-1 && combinedW <= (colW - 10);
      if(fitsHalf){
        const entry = {label:l.label, disp:dispStr, color:l.color};
        if(pending){ pushEntry({t:'row-pair', left:pending, right:entry, h:H_ROW}); pending=null; }
        else pending = entry;
      } else {
        flushPending();
        const fitsFull = dispStr.indexOf('\n')===-1 && combinedW <= (W - 2*M - 10);
        if(fitsFull){
          pushEntry({t:'row-full', label:l.label, disp:dispStr, color:l.color, h:H_ROW});
        } else {
          const wrapWidth = W - 2*M - 10;
          let valueLines = [];
          dispStr.split('\n').forEach(p=>{ valueLines = valueLines.concat(wrapText(p, wrapWidth, FONT-0.5, ctx)); });
          pushEntry({t:'row-stack', label:l.label, valueLines, color:l.color, h: H_ROW + valueLines.length*H_WRAP});
        }
      }
    } else {
      flushPending();
      let h;
      if(l.t==='images'){
        const rows = Math.ceil(l.thumbs.length / THUMB_PER_ROW);
        h = 16 + rows*(THUMB_H+8);
      } else {
        h = l.t==='title'?H_TITLE : l.t==='sub'?H_SUB : l.t==='section'?H_SECTION : l.t==='empty'?H_EMPTY : l.t==='gap'?H_GAP : l.t==='bar'?H_BAR : l.t==='footer'?H_FOOTER : 0;
      }
      pushEntry(Object.assign({}, l, {h}));
    }
  });
  flushPending();

  const totalH = M + (yCursor - M) + M;
  let svg = `<svg class="chart" width="${W}" height="${totalH}" viewBox="0 0 ${W} ${totalH}" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" font-family="Arial, sans-serif">`;
  svg += `<rect x="0" y="0" width="${W}" height="${totalH}" fill="#ffffff"/>`;

  // Alternating background bands: one band per 'section' block, spanning
  // from that section's heading down to the next section (or end).
  const sectionEntries = plan.filter(p=>p.t==='section');
  sectionEntries.forEach((sec,i)=>{
    const bandStart = sec.y;
    const bandEnd = i+1 < sectionEntries.length ? sectionEntries[i+1].y : (yCursor + M - 6);
    if(i % 2 === 1){
      svg += `<rect x="0" y="${bandStart}" width="${W}" height="${bandEnd-bandStart}" fill="#F8FAFC"/>`;
    }
  });

  function labelValueTspan(label, disp, color){
    return `<tspan fill="#334155">${escapeXml(label)}: </tspan><tspan font-weight="700" fill="${color}">${escapeXml(disp||'—')}</tspan>`;
  }

  plan.forEach(p=>{
    const y = p.y;
    if(p.t==='title'){ svg += `<text x="${M}" y="${y+16}" font-size="15.5" font-weight="700" fill="#0B1220">${escapeXml(p.text)}</text>`; }
    else if(p.t==='sub'){ svg += `<text x="${M}" y="${y+12}" font-size="11" fill="#475569">${escapeXml(p.text)}</text>`; }
    else if(p.t==='bar'){
      const {pass,cond,fail,total} = p.stats;
      const barW = W-2*M, bx=M, by=y+15;
      const wPass = total? barW*pass/total : 0, wCond = total? barW*cond/total : 0, wFail = total? barW*fail/total : 0;
      const pct = total ? Math.round(pass/total*100) : 0;
      svg += `<text x="${M}" y="${y+10}" font-size="10.5" font-weight="700" fill="#0F172A">Tổng quan: ${pct}% Đạt (${pass}/${total})</text>`;
      svg += `<rect x="${bx}" y="${by}" width="${barW}" height="11" rx="5.5" fill="#E2E8F0"/>`;
      if(wPass>0) svg += `<rect x="${bx}" y="${by}" width="${wPass}" height="11" rx="5.5" fill="#15803D"/>`;
      if(wCond>0) svg += `<rect x="${bx+wPass}" y="${by}" width="${wCond}" height="11" fill="#B45309"/>`;
      if(wFail>0) svg += `<rect x="${bx+wPass+wCond}" y="${by}" width="${wFail}" height="11" fill="#B91C1C"/>`;
      svg += `<text x="${M}" y="${y+33}" font-size="9" fill="#64748B">✅ Đạt ${pass}   ⚠️ Cảnh báo ${cond}   ❌ Lỗi ${fail}</text>`;
    }
    else if(p.t==='section'){
      svg += `<rect x="${M}" y="${y+2}" width="${W-2*M}" height="1" fill="#CBD5E1"/>`;
      svg += `<text x="${M}" y="${y+16}" font-size="11.5" font-weight="700" fill="#B45309">${escapeXml(p.text.toUpperCase())}</text>`;
    }
    else if(p.t==='empty'){ svg += `<text x="${M+6}" y="${y+11}" font-size="10" fill="#94A3B8">${escapeXml(p.text)}</text>`; }
    else if(p.t==='row-full'){
      svg += `<text x="${M+6}" y="${y+11}" font-size="11.5">${labelValueTspan(p.label, p.disp, p.color)}</text>`;
    }
    else if(p.t==='row-pair'){
      svg += `<text x="${M+6}" y="${y+11}" font-size="11.5">${labelValueTspan(p.left.label, p.left.disp, p.left.color)}</text>`;
      svg += `<text x="${M+colW+colGap+6}" y="${y+11}" font-size="11.5">${labelValueTspan(p.right.label, p.right.disp, p.right.color)}</text>`;
    }
    else if(p.t==='row-stack'){
      svg += `<text x="${M+6}" y="${y+11}" font-size="11.5" fill="#334155">${escapeXml(p.label)}</text>`;
      let vy = y + H_ROW;
      p.valueLines.forEach(vl=>{
        svg += `<text x="${M+14}" y="${vy+10}" font-size="11" font-weight="600" fill="${p.color}">${escapeXml(vl)}</text>`;
        vy += H_WRAP;
      });
    }
    else if(p.t==='images'){
      svg += `<text x="${M+6}" y="${y+10}" font-size="10" font-weight="700" fill="#334155">📎 Ảnh đính kèm (${p.total})</text>`;
      let tx = M+6, ty = y+16;
      p.thumbs.forEach((href,i)=>{
        if(i>0 && i%THUMB_PER_ROW===0){ tx = M+6; ty += THUMB_H+8; }
        const cid = `thimg${clipCounter++}`;
        svg += `<clipPath id="${cid}"><rect x="${tx}" y="${ty}" width="${THUMB_W}" height="${THUMB_H}" rx="8"/></clipPath>`;
        svg += `<image href="${href}" x="${tx}" y="${ty}" width="${THUMB_W}" height="${THUMB_H}" preserveAspectRatio="xMidYMid slice" clip-path="url(#${cid})"/>`;
        svg += `<rect x="${tx}" y="${ty}" width="${THUMB_W}" height="${THUMB_H}" rx="8" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>`;
        tx += THUMB_W+THUMB_GAP;
      });
      if(p.total > p.thumbs.length){
        svg += `<text x="${tx+4}" y="${ty+THUMB_H/2+4}" font-size="10" fill="#94A3B8">+${p.total-p.thumbs.length}</text>`;
      }
    }
    else if(p.t==='footer'){
      svg += `<rect x="${M}" y="${y}" width="${W-2*M}" height="1" fill="#E2E8F0"/>`;
      svg += `<text x="${W-M}" y="${y+14}" font-size="9" fill="#94A3B8" text-anchor="end">${escapeXml(p.text)}</text>`;
    }
  });
  svg += `</svg>`;
  return {svg, width:W, height:totalH};
}
function escapeHtmlPr(s){ return escapeHtml(s); }
function buildPrintableReportHTML(dateVal, shiftVal){
  const cps = checkpointsFor(dateVal, shiftVal);
  const stats = computeReportStats(cps);
  const pct = stats.total ? Math.round(stats.pass/stats.total*100) : 0;
  let html = `<div class="prthdr"><h1>ILD COFFEE VIETNAM — SHIFTLY REPORT</h1><div class="sub">Ngày ${fmtDateVN(dateVal)} · Ca ${shiftVal}</div></div>`;
  if(stats.total>0){
    html += `<div style="margin-bottom:8px;"><b style="font-size:11px;">Tổng quan: ${pct}% Đạt (${stats.pass}/${stats.total})</b>`;
    html += `<div class="prtbar"><i style="width:${stats.total?stats.pass/stats.total*100:0}%;background:#15803D;"></i><i style="width:${stats.total?stats.cond/stats.total*100:0}%;background:#B45309;"></i><i style="width:${stats.total?stats.fail/stats.total*100:0}%;background:#B91C1C;"></i></div>`;
    html += `<div style="font-size:9.5px;color:#64748B;">✅ Đạt ${stats.pass} &nbsp; ⚠️ Cảnh báo ${stats.cond} &nbsp; ❌ Lỗi ${stats.fail}</div></div>`;
  }
  const meta = cps.find(cp=>cp.section==='META');
  if(meta){
    const info=(meta.fields['INFO_ISSUE']||'').trim(), ho=(meta.fields['HANDOVER']||'').trim();
    if(info||ho){
      html += `<div class="prtsec"><h3>BÀN GIAO CA</h3><div class="prtrows">`;
      if(info) html += `<div class="prtrow full"><span class="k">Tình hình/Sự cố</span><span class="v">${escapeHtmlPr(info)}</span></div>`;
      if(ho) html += `<div class="prtrow full"><span class="k">Bàn giao</span><span class="v">${escapeHtmlPr(ho)}</span></div>`;
      html += `</div></div>`;
    }
  }
  SCHEMA.filter(s=>s.id!=='META').forEach(sec=>{
    cps.filter(cp=>cp.section===sec.id).forEach(cp=>{
      html += `<div class="prtsec"><h3>${escapeHtmlPr(sec.name)} — PO ${escapeHtmlPr(cp.po||'—')} (QC: ${escapeHtmlPr(cp.technician||'—')})</h3><div class="prtrows">`;
      let any=false;
      sec.fields.forEach(f=>{
        const v = cp.fields[f.id];
        if(v===undefined||v===null||v==='') return;
        any=true;
        let disp, color='#0F172A';
        if(f.type==='boolean'){ disp=boolDisp(f, v); color=v?'#15803D':'#B91C1C'; }
        else if(f.type==='number'){ const ok=inSpec(f,v); disp=String(v); color=ok===false?'#B91C1C':ok===true?'#15803D':'#0F172A'; }
        else disp = String(v).replace(/\n/g,' / ');
        const fullCls = (f.type==='textarea'||f.type==='text') ? ' full' : '';
        html += `<div class="prtrow${fullCls}"><span class="k">${escapeHtmlPr(f.label.split('\n')[0])}</span><span class="v" style="color:${color};">${escapeHtmlPr(disp)}</span></div>`;
      });
      if(!any) html += `<div class="prtrow full"><span class="k">— Không có dữ liệu —</span></div>`;
      html += `</div></div>`;
    });
  });
  if(cps.length===0) html += `<p>Chưa có dữ liệu nào cho ca này.</p>`;
  html += `<div class="prtfooter">Xuất lúc: ${escapeHtmlPr(fmtDateTimeVN(Date.now()))}</div>`;
  return html;
}

// Full standalone HTML report (self-contained .html file, opens in any
// browser) — richer than the compact print layout: full-size images in a
// gallery grid (click to open full-res in a new tab), used by the "Xuất
// báo cáo HTML đầy đủ" option in the Report tab. No thumbnail downscaling
// here (unlike the SVG/PNG report) since this isn't rasterized — the
// browser handles display sizing, and images are already compressed at
// attach-time (compressImageFile).
function fullHtmlReportHead(title){
  return `<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>${escapeHtml(title)}</title>
<style>
*{box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#EEF1F6;color:#0F172A;margin:0;padding:24px;}
.wrap{max-width:900px;margin:0 auto;}
.hdr{background:#0B1220;color:#fff;border-radius:16px;padding:22px 26px;margin-bottom:18px;}
.hdr h1{margin:0 0 4px;font-size:20px;}
.hdr .sub{color:#9FB0C9;font-size:13px;}
.statrow{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
.stat{flex:1;min-width:120px;background:#fff;border-radius:12px;padding:14px;text-align:center;box-shadow:0 1px 2px rgba(15,23,42,.06);}
.stat b{display:block;font-size:22px;}
.stat span{font-size:11px;color:#64748B;font-weight:600;text-transform:uppercase;letter-spacing:.3px;}
.card{background:#fff;border-radius:16px;padding:18px 20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px -12px rgba(15,23,42,.18);}
.card h2{margin:0 0 4px;font-size:16px;color:#B45309;}
.card .meta{font-size:12px;color:#64748B;margin-bottom:12px;}
.rows{display:grid;grid-template-columns:1fr 1fr;gap:4px 20px;}
@media(max-width:560px){.rows{grid-template-columns:1fr;}}
.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed #E2E8F0;font-size:13px;}
.row .k{color:#334155;}
.row .v{font-weight:700;}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:14px;}
.gallery a{display:block;border-radius:10px;overflow:hidden;border:1.5px solid #E2E8F0;aspect-ratio:4/3;}
.gallery img{width:100%;height:100%;object-fit:cover;display:block;}
.empty{color:#94A3B8;font-size:12.5px;font-style:italic;}
.footer{text-align:right;color:#94A3B8;font-size:11px;margin-top:10px;}
.handover{background:#FEF3C7;border:1.5px solid #FCD34D;border-radius:12px;padding:14px 16px;margin-bottom:16px;}
.handover h3{margin:0 0 6px;font-size:13px;color:#7C3E00;}
@media print{ body{background:#fff;} .card,.stat{box-shadow:none;border:1px solid #E2E8F0;} }
</style></head><body><div class="wrap">`;
}
function fullHtmlReportRow(f, v){
  let disp, color='#0F172A';
  if(f.type==='boolean'){ disp = boolDisp(f, v); color = v?'#15803D':'#B91C1C'; }
  else if(f.type==='number'){ const ok=inSpec(f,v); disp=String(v); color= ok===false?'#B91C1C':ok===true?'#15803D':'#0F172A'; }
  else disp = escapeHtml(String(v)).replace(/\n/g,'<br>');
  return `<div class="row"><span class="k">${escapeHtml(f.label.split('\n')[0])}</span><span class="v" style="color:${color};">${disp}</span></div>`;
}
function fullHtmlReportStatRow(stats){
  const pct = stats.total ? Math.round(stats.pass/stats.total*100) : 0;
  if(stats.total===0) return '';
  return `<div class="statrow">
    <div class="stat"><b>${stats.total}</b><span>Tổng chỉ tiêu</span></div>
    <div class="stat"><b style="color:#15803D;">${pct}%</b><span>Tỉ lệ Đạt</span></div>
    <div class="stat"><b style="color:#B45309;">${stats.cond}</b><span>Cảnh báo</span></div>
    <div class="stat"><b style="color:#B91C1C;">${stats.fail}</b><span>Lỗi</span></div>
  </div>`;
}
function fullHtmlReportCheckpointCard(sec, cp, extraMeta){
  let html = `<div class="card"><h2>${escapeHtml(sec?sec.name:cp.section)}</h2><div class="meta">${extraMeta||''}PO ${escapeHtml(cp.po||'—')} · QC: ${escapeHtml(cp.technician||'—')}${cp.recipe?' · Recipe '+escapeHtml(cp.recipe):''}${cp.client?' · Client '+escapeHtml(cp.client):''}</div>`;
  html += `<div class="rows">`;
  let any=false;
  (sec?sec.fields:[]).forEach(f=>{
    const v = cp.fields[f.id];
    if(v===undefined||v===null||v==='') return;
    any=true;
    html += fullHtmlReportRow(f, v);
  });
  html += `</div>`;
  if(!any) html += `<div class="empty">Chưa có dữ liệu chỉ tiêu.</div>`;
  const imgs = cp.images || [];
  if(imgs.length){
    html += `<div class="gallery">`;
    imgs.forEach(im=>{ const src = imgSrc(im); html += `<a href="${src}" target="_blank" rel="noopener"><img src="${src}" alt="Ảnh đính kèm"></a>`; });
    html += `</div>`;
  }
  html += `</div>`;
  return html;
}
function buildFullHtmlReport(dateVal, shiftVal){
  const cps = checkpointsFor(dateVal, shiftVal);

  let html = fullHtmlReportHead(`Shiftly Report — ${fmtDateVN(dateVal)} Ca ${shiftVal}`);

      html += `<div class="handover"><h3>⚠️ Bàn giao ca</h3>`;
      if(info) html += `<div class="row"><span class="k">Tình hình/Sự cố</span><span class="v">${escapeHtml(info)}</span></div>`;
      if(ho) html += `<div class="row"><span class="k">Bàn giao</span><span class="v">${escapeHtml(ho)}</span></div>`;
      html += `</div>`;

  SCHEMA.filter(s=>s.id!=='META').forEach(sec=>{

  if(cps.length===0) html += `<div class="card"><div class="empty">Chưa có dữ liệu nào cho ca này.</div></div>`;

function buildFullHtmlPOReport(poQuery, matches){
  const stats = computeReportStats(matches);
  let html = fullHtmlReportHead(`Shiftly Report — Truy xuất PO ${poQuery}`);
  html += `<div class="hdr"><h1>ILD COFFEE VIETNAM — TRUY XUẤT THEO PO</h1><div class="sub">Mã PO: ${escapeHtml(poQuery)} · ${matches.length} điểm kiểm tra liên quan</div></div>`;
  html += fullHtmlReportStatRow(stats);
  matches.forEach(cp=>{
    const sec = sectionById(cp.section);
    html += fullHtmlReportCheckpointCard(sec, cp, `Ca ${escapeHtml(cp.shift)} ${fmtDateVN(cp.date)} · `);
  });
  if(matches.length===0) html += `<div class="card"><div class="empty">Không có dữ liệu.</div></div>`;
  html += `<div class="footer">Xuất lúc: ${fmtDateTimeVN(Date.now())}</div>`;
  html += `</div></body></html>`;
  return html;
}
function printReport(html, suggestedName){
  const area = qs('#printArea');
  area.innerHTML = html;
  const prevTitle = document.title;
  if(suggestedName) document.title = suggestedName;
  const restore = ()=>{ document.title = prevTitle; window.removeEventListener('afterprint', restore); };
  window.addEventListener('afterprint', restore);
  setTimeout(()=>{ window.print(); setTimeout(restore, 1000); }, 50);
}
// One separate, focused image PER checkpoint (instead of one long combined
// image) — easier to view/zoom on a phone, and more useful when inserting
// individual sections into a document or chat.
function buildCheckpointImageSVGs(cpsList, headerTitle){
  return cpsList.map(cp=>{
    const sec = sectionById(cp.section);
    const lines = [];
    lines.push({t:'title', text: headerTitle});
    lines.push({t:'sub', text: `${sec?sec.name:cp.section} — PO ${cp.po||'—'}  ·  Ca ${cp.shift} ${fmtDateVN(cp.date)}  ·  QC: ${cp.technician||'—'}`});
    lines.push({t:'gap'});
    const rows = [];
    (sec?sec.fields:[]).forEach(f=>{
      const v = cp.fields[f.id];
      if(v===undefined||v===null||v==='') return;
      let disp, color='#0F172A';
      if(f.type==='boolean'){ disp = boolDisp(f, v); color = v?'#15803D':'#B91C1C'; }
      else if(f.type==='number'){ const ok=inSpec(f,v); disp=String(v); color= ok===false?'#B91C1C':ok===true?'#15803D':'#0F172A'; }
      else disp = String(v).replace(/\n/g,' / ');
      rows.push({label: f.label.split('\n')[0], disp, color});
    });
    if(rows.length===0) lines.push({t:'empty', text:'— Không có dữ liệu —'});
    else rows.forEach(r=>lines.push({t:'row', label:r.label, disp:r.disp, color:r.color}));
    lines.push({t:'footer', text:`Xuất lúc: ${fmtDateTimeVN(Date.now())}`});
    const {svg,width,height} = renderLinesToSVG(lines, 760);
    const safePo = (cp.po||'x').replace(/[^A-Za-z0-9_-]/g,'');
    return {svg, width, height, filename:`Shiftly_${cp.date}_Ca${cp.shift}_${cp.section}_PO${safePo}.png`};
  });
}
function computeReportStats(cps){
  let pass=0,cond=0,fail=0;
  cps.filter(cp=>cp.section!=='META').forEach(cp=>{
    const sec = sectionById(cp.section);
    if(!sec) return;
    sec.fields.forEach(f=>{
      const v = cp.fields[f.id];
      if(f.type==='boolean'){
        if(v===true) pass++; else if(v===false) fail++;
      } else if(f.type==='number'){
        const st = evalStatus(f, v);
        if(st==='pass') pass++; else if(st==='cond') cond++; else if(st==='fail') fail++;
      }
    });
  });
  return {pass,cond,fail,total:pass+cond+fail};
}
// Loads a data-URL/URL into an Image element (promise-wrapped) — used to
// downscale attached photos before embedding into the compact SVG report,
// so a checkpoint with several full-size photos doesn't bloat the exported
// PNG's render time / memory.
function loadImageEl(src){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = ()=>resolve(img);
    img.onerror = ()=>reject(new Error('image load failed'));
    img.src = src;
  });
}
async function thumbDataUrl(dataUrl, maxDim){
  try{
    const img = await loadImageEl(dataUrl);
    let w=img.width, h=img.height;
    if(w>h){ if(w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; } }
    else { if(h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; } }
    const canvas = document.createElement('canvas');
    canvas.width=w; canvas.height=h;
    canvas.getContext('2d').drawImage(img,0,0,w,h);
    return canvas.toDataURL('image/jpeg', 0.6);
  }catch(e){ console.error(e); return null; }
}
const REPORT_IMG_MAX = 6; // thumbnails shown per checkpoint in the compact SVG/PNG report
async function buildImagesLineForCheckpoint(cp){
  const imgs = cp.images || [];
  if(imgs.length===0) return null;
  const shown = imgs.slice(0, REPORT_IMG_MAX);
  const thumbs = [];
  for(const im of shown){
    const src = imgSrc(im);
    if(!src) continue;
    const t = await thumbDataUrl(src, 220);
    if(t) thumbs.push(t);
  }
  if(thumbs.length===0) return null;
  return { t:'images', total: imgs.length, thumbs };
}
async function buildReportSVG(dateVal, shiftVal){

      const rows = [];

        if(v===undefined||v===null||v==='') return;
        let disp, color='#0F172A';
        if(f.type==='boolean'){ disp = boolDisp(f, v); color = v?'#15803D':'#B91C1C'; }
        else if(f.type==='number'){ const ok=inSpec(f,v); disp=String(v); color= ok===false?'#B91C1C':ok===true?'#15803D':'#0F172A'; }
        else disp = String(v).replace(/\n/g,' / ');
        rows.push({label: f.label.split('\n')[0], disp, color});
      });
      if(rows.length===0) lines.push({t:'empty', text:'— Không có dữ liệu —'});
      else rows.forEach(r=>lines.push({t:'row', label:r.label, disp:r.disp, color:r.color}));
      const imgLine = await buildImagesLineForCheckpoint(cp);

  lines.push({t:'footer', text:`Xuất lúc: ${fmtDateTimeVN(Date.now())}`});
  return renderLinesToSVG(lines, W);
}
async function buildPOReportSVG(poQuery, matches){

  if(stats.total>0) lines.push({t:'bar', stats});
  lines.push({t:'gap'});
  for(const cp of matches){

    lines.push({t:'section', text:`${sec?sec.name:cp.section} — Ca ${cp.shift} ${fmtDateVN(cp.date)} (QC: ${cp.technician||'—'})`});
    const rows = [];
    (sec?sec.fields:[]).forEach(f=>{
      const v = cp.fields[f.id];
      if(v===undefined||v===null||v==='') return;
      let disp, color='#0F172A';
      if(f.type==='boolean'){ disp = boolDisp(f, v); color = v?'#15803D':'#B91C1C'; }
      else if(f.type==='number'){ const ok=inSpec(f,v); disp=String(v); color= ok===false?'#B91C1C':ok===true?'#15803D':'#0F172A'; }
      else disp = String(v).replace(/\n/g,' / ');
      rows.push({label:f.label.split('\n')[0], disp, color});
    });
    if(rows.length===0) lines.push({t:'empty', text:'— Không có dữ liệu —'});

function escapeXml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function svgToPngBlob(svgString, width, height, scale){
  scale = scale || 2.5; // higher-resolution export so images stay sharp when
                        // viewed/zoomed on high-density tablet/phone screens
  return new Promise((resolve,reject)=>{
    const svgBlob = new Blob([svgString], {type:'image/svg+xml;charset=utf-8'});
    const url = URL.createObjectURL(svgBlob);
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(width*scale); canvas.height = Math.round(height*scale);
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      URL.revokeObjectURL(url);
      canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('toBlob failed')), 'image/png');
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('SVG image load failed')); };
    img.src = url;
  });
}

function numericFieldsList(){

function boolFieldsList(){

  return out;
}
function overallCheckStats(){
  let pass=0,cond=0,fail=0;
  allCheckpoints.forEach(r=>{
    const sec = sectionById(r.section);
    if(!sec) return;
    sec.fields.forEach(f=>{
      const v = r.fields[f.id];
      if(f.type==='boolean'){
        if(v===true) pass++; else if(v===false) fail++;
      } else if(f.type==='number'){
        const st = evalStatus(f, v);
        if(st==='pass') pass++; else if(st==='cond') cond++; else if(st==='fail') fail++;
      }
    });
  });
  return {pass,cond,fail,total:pass+cond+fail};
}

function drawBoolSummary(container, field){
  const fo = fieldById(field.id);
  const secTotal = fo ? allCheckpoints.filter(r=>r.section===fo.section.id).length : allCheckpoints.length;
  const vals = allCheckpoints.map(r=>r.fields[field.id]).filter(v=>v!==undefined && v!==null);
  const pass = vals.filter(v=>v===true).length;
  const fail = vals.filter(v=>v===false).length;
  const total = vals.length;
  if(total===0){ container.appendChild(el('div',{class:'sub'},['Chưa có dữ liệu cho chỉ tiêu này.'])); return; }
  const lb = boolLabels(field);
  const pct = Math.round(pass/total*100);
  const W=680,H=90;
  const wPass = (W-40)*pass/total, wFail=(W-40)*fail/total;
  let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  svg += `<rect x="20" y="30" width="${W-40}" height="30" fill="#E2E8F0" rx="8"/>`;
  svg += `<rect x="20" y="30" width="${wPass}" height="30" fill="#15803D" rx="8"/>`;
  svg += `<rect x="${20+wPass}" y="30" width="${wFail}" height="30" fill="#B91C1C"/>`;
  svg += `<text x="20" y="20" font-size="13" fill="#0F172A" font-weight="700">${pct}% ${escapeXml(lb.t)} (${pass}/${total})</text>`;
  svg += `</svg>`;
  container.innerHTML = svg;
  container.appendChild(el('div',{class:'legend'},[
    el('span',{},[el('i',{style:'background:#15803D'}), `${lb.t}: ${pass}`]),
    el('span',{},[el('i',{style:'background:#B91C1C'}), `${lb.f}: ${fail}`]),
    el('span',{},[`Chưa kiểm: ${Math.max(0,secTotal-total)}`]),
  ]));
}

function drawSPC(container, field){
  const sorted = [...allCheckpoints].sort((a,b)=>(a.date+a.shift).localeCompare(b.date+b.shift));
  const pts = sorted.map(r=>({label:`${fmtDateVN(r.date)} C${r.shift}${r.po?' PO'+r.po:''}`, v: r.fields[field.id]}))
                     .filter(p=>p.v!==undefined && p.v!==null);
  if(pts.length < 2){ container.appendChild(el('div',{class:'sub'},['Cần tối thiểu 2 giá trị để vẽ biểu đồ SPC.'])); return; }
  const vals = pts.map(p=>p.v);
  const n = vals.length;
  const mean = vals.reduce((a,b)=>a+b,0)/n;
  const mrs = [];
  for(let i=1;i<n;i++) mrs.push(Math.abs(vals[i]-vals[i-1]));
  const mrBar = mrs.reduce((a,b)=>a+b,0)/mrs.length;
  const sigmaW = mrBar/1.128; // within-process sigma (moving range based) -> Cp/Cpk
  const sigmaO = n>1 ? Math.sqrt(vals.reduce((a,b)=>a+(b-mean)*(b-mean),0)/(n-1)) : 0; // overall sigma -> Pp/Ppk
  const UCL = mean + 2.66*mrBar;
  const LCL = mean - 2.66*mrBar;
  const LSL = field.hardMin, USL = field.hardMax;

  const W=680,H=280,padL=48,padR=14,padT=16,padB=34;
  let lo = Math.min(...vals, LCL, LSL!=null?LSL:Infinity), hi = Math.max(...vals, UCL, USL!=null?USL:-Infinity);
  const pad = (hi-lo)*0.1 || 1; lo-=pad; hi+=pad;
  const x = i => padL + (n<=1? 0 : i*(W-padL-padR)/(n-1));
  const y = v => H-padB - (v-lo)*(H-padT-padB)/(hi-lo);
  let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  svg += `<line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#CBD5E1" stroke-width="1"/>`;
  svg += `<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="#CBD5E1" stroke-width="1"/>`;
  const lines = [[mean,'#0F172A','','CL'],[UCL,'#B45309','4,3','UCL'],[LCL,'#B45309','4,3','LCL']];
  if(LSL!=null) lines.push([LSL,'#B91C1C','2,2','LSL']);
  if(USL!=null) lines.push([USL,'#B91C1C','2,2','USL']);
  lines.forEach(([v,c,dash,lab])=>{
    svg += `<line x1="${padL}" y1="${y(v)}" x2="${W-padR}" y2="${y(v)}" stroke="${c}" stroke-width="1.4" ${dash?`stroke-dasharray="${dash}"`:''}/>`;
    svg += `<text x="${W-padR}" y="${y(v)-3}" font-size="9.5" fill="${c}" text-anchor="end">${lab} ${v.toFixed(2)}</text>`;
  });
  const linePts = pts.map((p,i)=>`${x(i)},${y(p.v)}`).join(' ');
  svg += `<polyline points="${linePts}" fill="none" stroke="#0D9488" stroke-width="1.6"/>`;
  pts.forEach((p,i)=>{
    const st = evalStatus(field, p.v);
    const outOfControl = p.v>UCL || p.v<LCL;
    let color = '#0D9488';
    if(st==='fail') color='#B91C1C'; else if(outOfControl) color='#B45309';
    svg += `<circle cx="${x(i)}" cy="${y(p.v)}" r="4" fill="${color}"/>`;
  });
  svg += `</svg>`;
  container.innerHTML = svg;

  const oosCount = LSL!=null||USL!=null ? pts.filter(p=>(LSL!=null&&p.v<LSL)||(USL!=null&&p.v>USL)).length : 0;
  const oocCount = pts.filter(p=>p.v>UCL||p.v<LCL).length;
  container.appendChild(el('div',{class:'legend'},[
    `n=${n}`, ` · CL=${mean.toFixed(2)}`, ` · σ trong nhóm=${sigmaW.toFixed(3)}`, ` · σ tổng thể=${sigmaO.toFixed(3)}`,
    oocCount>0?` · ⚠️ Ngoài kiểm soát: ${oocCount}`:' · ✅ Trong tầm kiểm soát',
    oosCount>0?` · 🛑 Ngoài spec: ${oosCount}`:''
  ]));

  if(LSL!=null && USL!=null && sigmaW>0){
    const Cp = (USL-LSL)/(6*sigmaW);
    const Cpk = Math.min((USL-mean)/(3*sigmaW), (mean-LSL)/(3*sigmaW));
    const Pp = sigmaO>0 ? (USL-LSL)/(6*sigmaO) : null;
    const Ppk = sigmaO>0 ? Math.min((USL-mean)/(3*sigmaO), (mean-LSL)/(3*sigmaO)) : null;
    const capGrid = el('div',{class:'grid g4', style:'margin-top:10px;gap:8px;'},[
      kpiCard(Cp.toFixed(2),'Cp','teal'),
      kpiCard(Cpk.toFixed(2),'Cpk', Cpk>=1.33?'pass':Cpk>=1?'coffee':'fail'),
      kpiCard(Pp!=null?Pp.toFixed(2):'—','Pp','teal'),
      kpiCard(Ppk!=null?Ppk.toFixed(2):'—','Ppk', Ppk==null?'muted':Ppk>=1.33?'pass':Ppk>=1?'coffee':'fail'),
    ]);
    container.appendChild(capGrid);
    let verdict = Cpk<1 ? 'Chưa đủ năng lực (Cpk<1.0) — cần cải thiện' : Cpk<1.33 ? 'Đạt mức tối thiểu (1.0–1.33)' : 'Năng lực tốt (Cpk≥1.33)';
    container.appendChild(el('div',{class:'sub', style:'margin:8px 0 0;'},[verdict+'. Cp/Cpk dùng σ trong nhóm (moving range); Pp/Ppk dùng σ tổng thể (độ lệch chuẩn mẫu).']));
  } else {
    container.appendChild(el('div',{class:'sub', style:'margin:8px 0 0;'},['Chưa đủ LSL và USL (Specs tab) để tính Cp/Cpk/Pp/Ppk cho chỉ tiêu này.']));
  }
}

        numBox.style.display = typeSel.value==='number' ? '' : 'none';
        optBox.style.display = typeSel.value==='select' ? '' : 'none';
        boolBox.style.display = typeSel.value==='boolean' ? '' : 'none';

        el('label',{class:'fld', style:'margin-bottom:8px;'},[el('span',{class:'lab'},['Tên chỉ tiêu']), labelInp]),
        el('label',{class:'fld', style:'margin-bottom:8px;'},[el('span',{class:'lab'},['Kiểu dữ liệu']), typeSel]),
        reqRow, noteRow,
        boolBox, numBox, optBox,
        el('div',{class:'row', style:'margin-top:10px;'},[
          el('button',{class:'btn teal sm'},[isEdit?'💾 Lưu thay đổi':'➕ Thêm']),
          el('button',{class:'btn ghost sm'},['Huỷ']),
        ])
      ]);
      targetContainer.appendChild(form);
      syncVisibility();
      const [saveB, cancelB] = qsa('button', form).slice(-2);
      cancelB.addEventListener('click', onClose);
      saveB.addEventListener('click', async ()=>{
        const label = labelInp.value.trim();
        if(!label){ toast('Cần nhập tên chỉ tiêu'); return; }
        const type = typeSel.value;
        const obj = existing || {id: newFieldId(sec.id)};
        obj.label = label; obj.type = type;
        obj.required = reqChk.checked;
        obj.allowNote = noteChk.checked;
        obj.allowNegative = negChk.checked;
        delete obj.hardMin; delete obj.tMin; delete obj.tMax; delete obj.hardMax; delete obj.options; delete obj.recipeOverrides; delete obj.trueLabel; delete obj.falseLabel;
        if(type==='boolean'){
          const tl = trueLabelInp.value.trim(), fl = falseLabelInp.value.trim();
          if(tl) obj.trueLabel = tl;
          if(fl) obj.falseLabel = fl;
        }
        if(type==='number'){
          const lsl=toNum(lslInp.value), lcl=toNum(lclInp.value), ucl=toNum(uclInp.value), usl=toNum(uslInp.value);
          if(lsl!=null) obj.hardMin=lsl; if(lcl!=null) obj.tMin=lcl; if(ucl!=null) obj.tMax=ucl; if(usl!=null) obj.hardMax=usl;
          const validOverrides = overrideRows.filter(r=>r.recipe);
          if(validOverrides.length){
            obj.recipeOverrides = {};
            validOverrides.forEach(r=>{
              const o = {};
              if(r.hardMin!=null) o.hardMin=r.hardMin; if(r.tMin!=null) o.tMin=r.tMin; if(r.tMax!=null) o.tMax=r.tMax; if(r.hardMax!=null) o.hardMax=r.hardMax;
              obj.recipeOverrides[r.recipe] = o;
            });
          }
        }
        if(type==='select'){
          obj.options = optsInp.value.split('\n').map(s=>s.trim()).filter(Boolean);
        }
        if(!existing) sec.fields.push(obj);
        await saveSchema();
        onClose();
        renderSpecs();
      });
    }
    addBtn.addEventListener('click', ()=>openForm(null));
    renderList();
    root.appendChild(card);
  });
}

function weekRangeOf(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const day = d.getDay();
  const diffToMonday = (day===0 ? -6 : 1-day);
  const monday = new Date(d); monday.setDate(d.getDate()+diffToMonday);
  const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
  const fmt = x=>{ const p=n=>String(n).padStart(2,'0'); return `${x.getFullYear()}-${p(x.getMonth()+1)}-${p(x.getDate())}`; };
  return [fmt(monday), fmt(sunday)];
}

  const backupCard = el('div',{class:'card'},[
    el('div',{class:'card-h'},['Sao lưu / Phục hồi', el('div',{class:'rule'})]),
    el('p',{class:'sub', style:'margin:0 0 12px;'},[`Tổng cộng ${allCheckpoints.length} điểm kiểm tra đã lưu trong máy.`]),
    el('div',{class:'row'},[
      el('button',{class:'btn ghost sm'},['⬇️ Tải JSON sao lưu']),
      el('label',{class:'btn ghost sm', style:'position:relative;'},['⬆️ Phục hồi từ JSON',
        el('input',{type:'file', accept:'.json', style:'position:absolute;inset:0;opacity:0;cursor:pointer;'})
      ]),
    ])
  ]);
  qsa('button', backupCard)[0].addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(allCheckpoints,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `shiftly_backup_${todayStr()}.json`;
    a.click();
  });
  qs('input[type=file]', backupCard).addEventListener('change', async (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const text = await file.text();
    try{
      const parsed = JSON.parse(text);
      const records = [];
      parsed.forEach(r=>{
        if(r.section !== undefined) records.push(r);
        else records.push(...splitLegacyIntoCheckpoints(r));
      });
      for(const r of records) await idbPut('shifts', r);
      await refreshCache();
      await persistAll();
      toast(`Đã phục hồi ${records.length} điểm kiểm tra`);
      renderAll();
    }catch(err){ toast('File JSON không hợp lệ'); }
  });
  root.appendChild(backupCard);

  const catCard = el('div',{class:'card'},[
    el('div',{class:'card-h'},['Danh mục Tên QC', el('div',{class:'rule'})]),
    el('p',{class:'sub', style:'margin:0 0 10px;'},['Mỗi tên 1 dòng. Danh sách này sẽ hiện ra dạng chọn ở tab Nhập liệu.']),
  ]);
  const techArea = el('textarea',{class:'inp', rows:'5'},[]);
  techArea.value = TECHNICIANS.join('\n');
  catCard.appendChild(techArea);
  const techSaveBtn = el('button',{class:'btn teal sm', style:'margin-top:10px;'},['💾 Lưu danh sách QC']);
  techSaveBtn.addEventListener('click', async ()=>{
    TECHNICIANS = techArea.value.split('\n').map(s=>s.trim()).filter(Boolean);
    await idbPut('meta', {k:'technicians', value: TECHNICIANS});
    await queueMetaSync('technicians', TECHNICIANS);
    toast('Đã lưu danh sách QC');
  });
  catCard.appendChild(techSaveBtn);
  root.appendChild(catCard);

  const dangerCard = el('div',{class:'card'},[
    el('div',{class:'card-h'},['Xoá dữ liệu', el('div',{class:'rule'})]),
    el('button',{class:'btn danger sm'},['🗑️ Xoá toàn bộ dữ liệu trong máy']),
  ]);
  qs('button', dangerCard).addEventListener('click', async ()=>{
    const msg = cloudCfg.url
      ? 'Xoá TOÀN BỘ dữ liệu ca đã lưu trong MÁY NÀY? Đây chỉ xoá bản sao cục bộ — dữ liệu trên Supabase (và các thiết bị khác) KHÔNG bị xoá, và lần đồng bộ tiếp theo sẽ tự tải lại về máy này. Muốn xoá vĩnh viễn trên cả server, cần thao tác trực tiếp trong Supabase SQL Editor.'
      : 'Xoá TOÀN BỘ dữ liệu ca đã lưu trong máy này? Hành động không thể hoàn tác.';
    if(confirm(msg)){
      for(const r of allCheckpoints) await idbDelete('shifts', r.key);
      await refreshCache();
      await persistAll();
      toast('Đã xoá toàn bộ dữ liệu');
      renderAll();
    }
  });
  root.appendChild(dangerCard);
}

/* ===================== GUIDE TAB ===================== */
function renderGuide(){
  const root = qs('#view-guide');
  if(root.dataset.rendered) return;
  root.dataset.rendered='1';
  root.innerHTML = `
  <div class="section-title">Hướng dẫn sử dụng</div>
  <div class="card markd">
    <h4>0. Mô hình dữ liệu: Điểm kiểm tra (Checkpoint)</h4>
    <p>App không còn coi "1 ca = 1 PO cho tất cả công đoạn". Thực tế dây chuyền chạy liên tục nên <b>1 ca có thể có nhiều PO chạy song song</b>, mỗi PO chỉ ứng với 1 vài công đoạn cụ thể (VD: PO 65 chỉ có ở Rang, PO 89 và 90 cùng chạy ở Trích ly). Vì vậy đơn vị nhập liệu nhỏ nhất giờ là <b>Điểm kiểm tra</b> = 1 lần nhập cho đúng 1 Công đoạn + 1 PO cụ thể, trong 1 Ngày + Ca. 1 ca có thể có nhiều điểm kiểm tra.</p>
    <h4>1. Đồng bộ Supabase (tuỳ chọn, khuyên bật để dùng nhiều thiết bị)</h4>
    <p>Đây là bản Online của Shiftly Report — dữ liệu luôn được lưu trước trong chính máy đang dùng (IndexedDB), giống hệt bản offline gốc, nên mất mạng vẫn nhập liệu bình thường. Muốn nhiều tablet/máy tính cùng thấy chung 1 bộ dữ liệu, vào tab <b>Cài đặt</b> → mục "☁️ Đồng bộ Supabase" → nhập <b>Supabase URL</b>, <b>Anon public key</b> và <b>mật khẩu đồng bộ</b> (do người triển khai app cung cấp — xem <code>supabase/README.md</code> trong mã nguồn) → "💾 Lưu &amp; Kết nối". Từ đó mỗi lần lưu dữ liệu, app tự đẩy lên Supabase và tự kéo dữ liệu từ các máy khác về, không cần thao tác thêm.</p>
    <h4>2. Nhập liệu theo Điểm kiểm tra</h4>
    <p>Ở tab <b>Nhập liệu</b>: chọn Ngày + Ca → phần "Bàn giao ca" (Tình hình/Sự cố, Bàn giao) không cần PO, điền được ngay. Bên dưới là danh sách các điểm kiểm tra đã có trong ca này. Bấm <b>"➕ Thêm điểm kiểm tra"</b> → chọn Công đoạn + nhập/chọn mã PO → chọn QC → nhập chỉ tiêu → <b>"Lưu điểm kiểm tra"</b>. Muốn nhập PO khác cho cùng công đoạn (VD: PO 89 rồi PO 90 đều ở Trích ly), bấm "➕ Thêm điểm kiểm tra" lần nữa với PO mới — không bị ghi đè lên nhau.</p>
    <h4>3. Ô Đạt / Lỗi</h4>
    <p>Với các chỉ tiêu kiểm tra ngoại quan (không có số liệu), chạm nút để chuyển trạng thái: — — (chưa kiểm) → ✅ Đạt → ❌ Lỗi → quay lại — —.</p>
    <h4>4. Xem lại & sửa</h4>
    <p>Tab <b>Dữ liệu</b> liệt kê tất cả các điểm kiểm tra đã nhập (chế độ 📋 Danh sách ca), mỗi dòng có Công đoạn + PO riêng, chạm 👁 để xem chi tiết, ✎ sửa, hoặc 🗑 xoá. Chế độ 📅 Xem theo ngày hiển thị Ca 1/2/3 cạnh nhau — mỗi cột liệt kê tất cả điểm kiểm tra (mọi công đoạn, mọi PO) của ca đó, giống bố cục file Excel gốc.</p>
    <h4>5. Thống kê xu hướng</h4>
    <p>Tab <b>Thống kê</b> cho phép xem biểu đồ xu hướng của từng chỉ tiêu số theo thời gian (có dải chuẩn tham chiếu), hoặc tỉ lệ Đạt/Lỗi của các chỉ tiêu ngoại quan.</p>
    <h4>6. An toàn dữ liệu</h4>
    <p>Toàn bộ dữ liệu được lưu ngay trong máy đang dùng (IndexedDB) trước tiên — luôn vào được, kể cả mất mạng. Nếu có cấu hình đồng bộ Supabase, mỗi lần lưu app sẽ tự đẩy dữ liệu lên; nếu đang offline hoặc đồng bộ lỗi, các thay đổi được xếp vào 1 "hàng đợi" lưu ngay trong máy và app tự thử lại khi có mạng trở lại — không mất dữ liệu. Vẫn nên thỉnh thoảng tải file JSON sao lưu ở tab Cài đặt như 1 lớp an toàn bổ sung.</p>
    <h4>6b. Đồng bộ Supabase — cách hoạt động</h4>
    <p>Sau khi cấu hình ở tab Cài đặt, mỗi lần lưu 1 điểm kiểm tra/Specs/Danh sách PO-Recipe-Client-QC, app đẩy ngay thay đổi đó lên Supabase, đồng thời phát 1 tín hiệu Realtime "vừa có thay đổi" — các máy khác đang mở app nhận tín hiệu này gần như ngay lập tức và tự kéo dữ liệu mới về, không cần chờ. Nếu Realtime không kết nối được (mạng công ty chặn WebSocket, trình duyệt cũ...), app tự rơi về kiểm tra định kỳ mỗi ~15-20 giây (và mỗi khi mở lại app / có mạng trở lại) — vẫn tự động, không cần biết Realtime có đang hoạt động hay không. Nếu 2 người cùng sửa <b>đúng 1 điểm kiểm tra</b> (trùng Ngày+Ca+Công đoạn+PO) gần như cùng lúc, bản lưu <b>sau cùng sẽ thắng</b> (theo thời gian lưu) — vì mỗi điểm kiểm tra đã tách rất nhỏ theo Công đoạn+PO nên tình huống này hiếm khi xảy ra. Ảnh đính kèm đi kèm luôn trong dữ liệu của điểm kiểm tra (không tách riêng), nên máy nào nhận được điểm kiểm tra là có luôn ảnh, không cần chờ tải thêm. Có thể bấm "🔄 Đồng bộ ngay" ở tab Cài đặt để đồng bộ thủ công bất cứ lúc nào — app sẽ báo rõ vừa nhận thêm bao nhiêu thay đổi mới, hoặc lý do cụ thể nếu đồng bộ thất bại (sai Supabase URL/Anon Key/mật khẩu, mất mạng...) thay vì chỉ báo chung chung. Con trỏ đồng bộ dùng số thứ tự do server tự sinh (không dùng đồng hồ của máy) nên đồng hồ điện thoại/máy tính lệch nhau không làm mất hoặc trễ dữ liệu. Nếu nghi ngờ 1 thiết bị bị "kẹt" (báo đã đồng bộ nhưng thiếu dữ liệu), bấm "🔁 Đồng bộ lại từ đầu" để buộc tải lại toàn bộ từ server — an toàn, không mất dữ liệu.</p>
    <h4>7. Đưa dữ liệu sang máy tính (Tablet Android ↔ PC Windows)</h4>
    <p>Nếu đã bật Đồng bộ Supabase, việc này giờ <b>tự động</b> — bất kỳ máy nào (tablet ở xưởng, PC văn phòng, laptop quản lý) mở cùng 1 địa chỉ app và cấu hình cùng Supabase URL + Anon key + mật khẩu sẽ tự thấy dữ liệu của nhau, không cần chép file qua lại nữa. Chỉ cần cả 2 máy có mạng tại một thời điểm nào đó (không cần đồng thời) để đồng bộ diễn ra.</p>
    <p>Vẫn nên duy trì thói quen sao lưu thủ công định kỳ để phòng rủi ro (mất tài khoản Supabase, xoá nhầm, sự cố ngoài dự kiến):</p>
    <ul>
      <li><b>Định kỳ (hàng tuần):</b> tải JSON sao lưu (tab Cài đặt) gửi email cho chính mình hoặc copy qua USB.</li>
      <li><b>Không có mạng dài ngày ở xưởng:</b> vẫn nhập liệu bình thường — dữ liệu nằm an toàn trong máy (hàng đợi đồng bộ), tự đẩy lên hết khi có mạng trở lại, không cần thao tác gì thêm.</li>
      <li><b>Chưa/không muốn bật Supabase:</b> vẫn dùng tab <b>Xuất nhập dữ liệu</b> để xuất CSV/Excel/JSON thủ công và chia sẻ qua OneDrive/SharePoint/USB như cách làm truyền thống.</li>
    </ul>
    <h4>8. Xuất / nhập nhanh một phần dữ liệu (Short CSV)</h4>
    <p>Khi chỉ cần gửi vài ca (không phải toàn bộ lịch sử) cho người khác — ví dụ đưa số liệu hôm nay cho quản lý xem trên máy khác:</p>
    <ul>
      <li><b>Xuất theo lựa chọn tay:</b> ở tab <b>Dữ liệu</b> (chế độ Danh sách ca), tick chọn các ca cần gửi (có "chọn tất cả" ở đầu bảng) → bấm <b>"Xuất ca đã chọn (Short CSV)"</b>.</li>
      <li><b>Xuất theo khoảng thời gian tự động:</b> ở tab <b>Xuất nhập dữ liệu</b>, chọn phạm vi "Theo ca cụ thể / Theo ngày / Theo tuần / Theo tháng" → app tự lọc đúng các ca trong khoảng đó → "Xuất & Chia sẻ".</li>
      <li>Cả 2 cách đều tạo 1 file CSV nhỏ, tên bắt đầu bằng <b>"Short_"</b>, cùng định dạng cột với file CSV tổng nên mở được ở cả 2 nơi.</li>
      <li><b>Nhập:</b> ở máy nhận, vào tab <b>Xuất nhập dữ liệu</b> → "Chọn file CSV để nhập" → chọn file "Short_..." (hoặc cả file CSV tổng) vừa nhận. App tự so sánh với dữ liệu đang có và <b>báo động nếu phát hiện ca trùng</b> (cùng Ngày+Ca đã tồn tại) — chọn "Chỉ thêm ca mới" (an toàn, bỏ qua trùng) hoặc "Ghi đè cả ca trùng" (nếu chắc chắn muốn thay bằng bản mới). Dữ liệu nhập vào được lưu vào máy này và tự đồng bộ lên Supabase (nếu đã cấu hình) như mọi thay đổi khác.</li>
    </ul>
    <h4>9. Đính kèm ảnh bất thường</h4>
    <p>Ngay dưới ô "Ghi chú bất thường" của mỗi công đoạn có 2 nút: <b>📎 Đính kèm ảnh</b> (chọn ảnh có sẵn trong máy) và <b>📷 Chụp ảnh</b> (mở camera chụp trực tiếp). Ảnh được nén gọn và lưu ngay trong máy (IndexedDB) — không cần bấm "Lưu công đoạn" mới lưu ảnh. Chạm ✕ trên ảnh nhỏ để xoá. <b>Lưu ý:</b> ảnh không đi kèm trong file CSV (CSV chỉ chứa số liệu để tương thích Excel) — ảnh chỉ xem được trong app trên chính máy đã chụp/đính kèm, hoặc trong bản backup JSON đầy đủ (tab Cài đặt).</p>
    <h4>10. Banner bàn giao ca</h4>
    <p>Khi mở 1 ca mới, nếu ca liền trước đó có ghi "Tình hình/Sự cố" hoặc "Bàn giao" (ở công đoạn Tổng kết ca), app sẽ tự hiện 1 banner màu vàng nổi bật ngay đầu tab Nhập liệu — không cần vào từng công đoạn mới thấy. Đây là thông tin quan trọng nhất khi giao ca nên được đưa lên đầu.</p>
    <h4>11. Đánh Đạt tất cả (nhập nhanh)</h4>
    <p>Với các nhóm chỉ tiêu kiểm tra ngoại quan (Đạt/Lỗi), mỗi nhóm có nút <b>"✅ Đạt tất cả"</b> ở đầu — bấm 1 lần để đánh Đạt hết cả nhóm, sau đó chỉ cần sửa lại những mục thực sự phát hiện lỗi. Tiết kiệm thời gian cho các công đoạn có nhiều mục kiểm tra (F&amp;P).</p>
    <h4>12. Nhắc khi lưu còn thiếu dữ liệu</h4>
    <p>Khi bấm "Lưu công đoạn" mà còn chỉ tiêu chưa nhập, app sẽ hỏi xác nhận trước ("Còn X/Y chỉ tiêu chưa nhập, vẫn lưu?") — không chặn, chỉ nhắc để tránh bỏ sót ngoài ý muốn.</p>
    <h4>13. Đồng bộ cấu hình Specs giữa nhiều tablet</h4>
    <p>Nếu công ty dùng nhiều tablet, chỉnh Specs xong ở 1 máy → vào tab <b>Specs</b> → "Xuất cấu hình Specs (JSON)" → chia sẻ file này sang các máy khác → ở máy nhận, vào tab Specs → "Nhập cấu hình Specs (JSON)" → chọn file. File này chỉ chứa danh sách chỉ tiêu &amp; giới hạn, không chứa dữ liệu ca nên an toàn khi đồng bộ.</p>
    <h4>14. Tab Truy xuất — tìm theo PO / theo Ca / theo ngày</h4>
    <p>Nhập mã PO (chọn từ gợi ý hoặc gõ tay), chọn Ca, và/hoặc khoảng ngày rồi bấm Tìm kiếm. Mỗi PO giờ gắn thẳng với 1 điểm kiểm tra (1 Công đoạn cụ thể) nên kết quả cho biết ngay PO đó ở công đoạn nào, ca nào — bấm 👁 Xem để mở chi tiết, ✎ Sửa để chỉnh sửa (nếu PO đã đóng sẽ hỏi mật khẩu Force), hoặc "📊 Xuất Excel kết quả" để tải về.</p>
    <h4>15. Sắp xếp lại thứ tự chỉ tiêu (Specs)</h4>
    <p>Mỗi chỉ tiêu trong tab Specs có 2 nút ▲ ▼ để di chuyển lên/xuống trong danh sách của công đoạn đó — thứ tự này cũng là thứ tự hiển thị ở tab Nhập liệu.</p>
    <h4>16. Báo cáo theo PO (tab Báo cáo)</h4>
    <p>Ngoài xem theo ca (gộp mọi điểm kiểm tra + Bàn giao ca của ca đó), tab Báo cáo có chế độ <b>"Theo PO"</b>: nhập mã PO → app gom tất cả các điểm kiểm tra liên quan đến PO đó (có thể ở nhiều ca, nhiều công đoạn khác nhau) thành 1 ảnh báo cáo truy xuất duy nhất. Báo cáo giờ có thêm thanh <b>Tổng quan Đạt/Cảnh báo/Lỗi</b> ở đầu, dải màu xen kẽ theo từng công đoạn cho dễ đọc, tự xuống dòng đúng cách khi ghi chú dài (không còn bị đè chữ), và ảnh PNG xuất ra <b>nét hơn hẳn</b> (độ phân giải cao gấp 2.5 lần trước đây — không còn bị mờ khi zoom). Cạnh 2 nút "Tải ảnh PNG" / "Chia sẻ ảnh" có ô chọn <b>"Định dạng khác..."</b> với 2 lựa chọn: <b>"📄 Xuất PDF (in trang)"</b> (mở hộp thoại In của trình duyệt, chọn "Lưu dưới dạng PDF") hoặc <b>"🖼️ Xuất nhiều ảnh (mỗi công đoạn)"</b> — thay vì 1 ảnh dài gộp hết, tạo riêng 1 ảnh nét cho từng công đoạn/điểm kiểm tra rồi chia sẻ/tải về cùng lúc, tiện xem hoặc gửi từng phần.</p>
    <h4>17. Định dạng ngày DD/MM/YYYY</h4>
    <p>Toàn bộ ngày hiển thị trong app (và cột Date khi xuất CSV/Excel) đều theo định dạng <b>DD/MM/YYYY</b> (VD: 17/07/2026). Khi nhập lại file CSV cũ có định dạng khác, app vẫn tự nhận diện được.</p>
    <h4>18. Xuất dữ liệu nhiều định dạng (CSV / Excel / JSON)</h4>
    <p>Tab Xuất nhập dữ liệu giờ cho chọn phạm vi (Toàn bộ / Theo ca / Ngày / Tuần / Tháng / Theo PO) và định dạng file (CSV, Excel .xls, hoặc JSON) trước khi xuất. Giờ cũng <b>nhập lại được</b> file Excel .xls — nhưng chỉ với file do chính app này xuất ra (app đọc lại đúng định dạng của mình, không đọc được file .xlsx bất kỳ từ nơi khác).</p>
    <h4>19. Nhập ảnh đính kèm từ xa</h4>
    <p>Tab Xuất nhập dữ liệu có mục "Nhập ảnh đính kèm": chọn đúng Ngày + Ca + Công đoạn + PO của điểm kiểm tra rồi chọn ảnh — dùng khi nhận được ảnh bằng chứng qua Zalo/email từ người khác thay vì tự chụp trực tiếp trong ca.</p>
    <h4>20. Dán ảnh trực tiếp (Copy/Paste)</h4>
    <p>Ô "📋 Dán ảnh vào đây (Ctrl+V)" dưới mỗi Ghi chú bất thường — chạm vào ô rồi dán (paste) ảnh đã copy sẵn, không cần lưu file trước.</p>
    <h4>21. Chỉ tiêu Bắt buộc & ghi đè theo Recipe (tab Specs)</h4>
    <p>Khi thêm/sửa chỉ tiêu, tick "Bắt buộc nhập" để đánh dấu Mandatory (hiện dấu * và cảnh báo mạnh hơn khi lưu thiếu). Với chỉ tiêu số, có thể thêm "Ghi đè theo Recipe" — cùng 1 chỉ tiêu nhưng LSL/LCL/UCL/USL khác nhau tuỳ Recipe đang chọn ở công đoạn đó.</p>
    <h4>22. Mỗi điểm kiểm tra = 1 Công đoạn + 1 PO riêng</h4>
    <p>Khác với trước đây (1 ca chỉ có 1 PO chung), giờ mỗi điểm kiểm tra tự chọn PO riêng của nó. Nhờ vậy 1 ca có thể có nhiều PO chạy song song ở các công đoạn khác nhau, hoặc thậm chí nhiều PO khác nhau cùng 1 công đoạn (VD: 2 mẻ Trích ly liên tiếp) — mỗi cái là 1 điểm kiểm tra riêng biệt, không đè lên nhau. Khi bắt đầu nhập, app tự gợi ý copy số liệu từ <b>lần kiểm tra gần nhất của đúng PO + Công đoạn đó</b> (không phải "ca trước" nói chung).</p>
    <h4>23. Tab Danh sách PO</h4>
    <p>Nhập trước các mã PO sẽ dùng (mỗi mã 1 dòng) — các PO này (trừ PO đã đóng) sẽ hiện thành gợi ý chọn nhanh ở tab Nhập liệu và tab Truy xuất. Không bắt buộc phải khai báo trước — vẫn gõ tay được mã PO mới bất kỳ lúc nào. Tab này cũng cho xuất/nhập danh sách bằng Excel, kèm file template mẫu để điền sẵn. Phía dưới là mục <b>"Tiến độ &amp; Xác thực đóng PO"</b>: gộp tất cả điểm kiểm tra đã dùng cùng 1 PO để xem số điểm kiểm tra, mức điền dữ liệu trung bình, <b>danh sách công đoạn thực tế đã có dữ liệu</b> (không phải tỉ lệ x/8 cố định), QC tham gia. Bấm <b>"✅ Verify — Xác thực đóng PO"</b> khi hoàn thành — PO đã đóng sẽ không còn hiện trong danh sách chọn ở Nhập liệu (vẫn xem lại được, và có thể "🔓 Mở lại").</p>
    <h4>24. Tab Danh sách Recipe</h4>
    <p>Quản lý danh sách Recipe — mỗi mã 1 dòng, chọn khi nhập điểm kiểm tra. Tab này còn hiện tổng quan Recipe nào đang ghi đè Specs của chỉ tiêu nào (chỉnh giá trị cụ thể ở tab Specs, trong từng chỉ tiêu → "Ghi đè theo Recipe").</p>
    <h4>25. Tab Danh sách Client</h4>
    <p>Quản lý danh sách khách hàng/Client — tên, ghi chú riêng, và highlight màu (🔴 quan trọng/rủi ro, 🟠 cần chú ý, 🟢 VIP/ưu tiên). Khi chọn Client cho 1 điểm kiểm tra ở tab Nhập liệu, nếu Client đó có ghi chú, app tự hiện banner nổi bật ngay trong form để QC không bỏ sót.</p>
    <h4>26. Recipe & Client là thuộc tính của từng điểm kiểm tra</h4>
    <p>Recipe và Client giờ chọn trực tiếp khi tạo/sửa điểm kiểm tra (cùng chỗ với PO, QC) — không còn là 1 chỉ tiêu riêng trong danh sách Specs của từng công đoạn.</p>
    <h4>27. Sửa dữ liệu: cho phép đổi mã PO</h4>
    <p>Khi bấm "✎ Sửa" 1 điểm kiểm tra đã có (từ tab Dữ liệu hoặc Truy xuất), ô Mã PO giờ sửa được trực tiếp (Công đoạn vẫn giữ nguyên, không đổi được). Nếu đổi sang mã PO đã có sẵn 1 điểm kiểm tra khác trùng Công đoạn/Ca/Ngày, app sẽ hỏi xác nhận trước khi ghi đè.</p>
    <h4>28. Tab Data Log</h4>
    <p>Ghi lại toàn bộ lịch sử thay đổi dữ liệu: mỗi lần bấm "Lưu điểm kiểm tra", app tự so sánh giá trị cũ và mới của từng chỉ tiêu, chỉ ghi log những gì thực sự thay đổi — kèm thời gian, Ca, PO, công đoạn, QC. Lọc theo ngày hoặc theo PO để tra cứu nhanh.</p>
    <h4>29. Ảnh đính kèm hiển thị ngay trong Báo cáo</h4>
    <p>Ảnh bất thường đính kèm cho từng công đoạn giờ hiện luôn trong báo cáo (cả chế độ Theo ca và Theo PO) — 1 dải ảnh nhỏ ngay dưới các chỉ tiêu của công đoạn đó, tối đa 6 ảnh/công đoạn trong bản ảnh PNG (nếu nhiều hơn sẽ ghi "+N"). Áp dụng cho cả 3 định dạng xuất: ảnh PNG, PDF (in trang), và HTML đầy đủ.</p>
    <h4>30. Xuất báo cáo HTML đầy đủ (đẹp, có ảnh)</h4>
    <p>Ở tab Báo cáo, chọn "Định dạng khác..." → <b>"🌐 Xuất báo cáo HTML đầy đủ (đẹp, có ảnh)"</b> — tạo 1 file .html độc lập, mở được bằng bất kỳ trình duyệt nào, không cần app. Bố cục dạng thẻ (card) rõ ràng theo từng công đoạn, có ô thống kê tổng quan, và <b>toàn bộ ảnh đính kèm hiển thị đầy đủ độ phân giải gốc</b> dạng lưới ảnh — chạm vào ảnh để xem full-size ở tab mới. Phù hợp khi cần gửi báo cáo đẹp, đầy đủ hình ảnh cho khách hàng hoặc lưu hồ sơ.</p>
    <h4>31. Kiến trúc bản Online (GitHub + Supabase)</h4>
    <p>Bản này (<code>index.html</code>) khác với bản offline gốc (<code>Shiftly_Report_App.html</code>) ở 1 điểm duy nhất: có thêm khả năng đồng bộ dữ liệu qua mạng. Mã nguồn giao diện (chính file <code>index.html</code> này) được lưu trên GitHub và publish bằng GitHub Pages; dữ liệu thật (điểm kiểm tra kèm ảnh, cấu hình) lưu trong 1 project Supabase (Postgres) — không có server trung gian riêng, app gọi thẳng vào các SQL function (RPC) của Supabase bằng "anon public key", còn quyền ghi/đọc thật sự do chính các function đó tự kiểm tra 1 mật khẩu chung (không lưu trong mã nguồn public). Xem thư mục <code>supabase/</code> trong mã nguồn (file <code>schema.sql</code> + <code>README.md</code>) để biết chi tiết triển khai và các bước thiết lập.</p>
    <h4>32. Ảnh chụp từ nhiều máy hiển thị lẫn nhau</h4>
    <p>Ảnh đính kèm chụp trên 1 máy đi kèm luôn trong dữ liệu của điểm kiểm tra đó (không tách riêng) — nên ngay khi 1 máy khác đồng bộ nhận được điểm kiểm tra, ảnh cũng đã có sẵn, xem được ngay kể cả trong Báo cáo (PNG/PDF/HTML đầy đủ) mà không cần tải thêm bước nào. Ảnh vừa chụp nhưng máy chưa kịp đồng bộ (đang chờ mạng) sẽ chỉ hiện được trên đúng máy đã chụp cho tới khi đồng bộ xong.</p>
  </div>`;
}

/* ===================== EXPORT HELPERS ===================== */
function downloadBlob(blob, filename){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}
// Tries the Web Share API for a file; on ANY failure, unsupported API,
// or unavailable secure-context (e.g. file:// on some browsers), it
// silently falls back to a direct download instead of surfacing an error.
async function robustShareOrDownload(file, opts){
  opts = opts || {};
  try{
    if(typeof navigator.share === 'function' && navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title: opts.title || 'Shiftly Report'});
      return true;
    }
  }catch(e){
    if(e && e.name === 'AbortError') return false; // user cancelled the share sheet
    console.error(e);
  }
  try{
    downloadBlob(file, file.name);
    toast(opts.fallbackMsg || 'Đã tải file về máy (chia sẻ trực tiếp không khả dụng trên trình duyệt này)');
  }catch(e2){
    console.error(e2);
    toast('Không thể xuất file — vui lòng thử lại');
  }
  return false;
}
// Shares a whole batch of files in ONE action via the OS share sheet
// (Android handles multiple files natively there). Falling back to
// individual downloads is done with a short delay between each, since
// Chrome on Android blocks/queues rapid-fire multi-downloads otherwise.
async function robustShareMultipleOrDownload(files, opts){
  opts = opts || {};
  try{
    if(typeof navigator.share === 'function' && navigator.canShare && navigator.canShare({files})){
      await navigator.share({files, title: opts.title || 'Shiftly Report'});
      return true;
    }
  }catch(e){
    if(e && e.name === 'AbortError') return false;
    console.error(e);
  }
  for(let i=0;i<files.length;i++){
    downloadBlob(files[i], files[i].name);
    if(i < files.length-1) await new Promise(r=>setTimeout(r, 400));
  }
  toast(opts.fallbackMsg || `Đã tải ${files.length} file về máy (chia sẻ hàng loạt không khả dụng trên trình duyệt này)`);
  return false;
}

/* ===================== BOOT ===================== */
function renderAll(){
  renderInputGate();
  const active = qs('.tab[aria-selected="true"]');
  if(active && active.dataset.tab!=='input') showTab(active.dataset.tab);
}
(async function init(){
  DB = await idbOpen();
  await loadCloudState();
  const metaTech = await idbGet('meta','technicians');
  if(metaTech && Array.isArray(metaTech.value) && metaTech.value.length) TECHNICIANS = metaTech.value;
  const metaRecipes = await idbGet('meta','recipes');
  if(metaRecipes && Array.isArray(metaRecipes.value) && metaRecipes.value.length) RECIPES = metaRecipes.value;
  const metaSchema = await idbGet('meta','schema');
  if(metaSchema && Array.isArray(metaSchema.value) && metaSchema.value.length) SCHEMA = metaSchema.value;
  else await idbPut('meta', {k:'schema', value: SCHEMA});
  // Defensive migration: older saved schemas may still use the 2-band
  // min/max keys — fold them into hardMin/hardMax (LSL/USL) on load.
  let migrated = false;
  SCHEMA.forEach(s=>s.fields.forEach(f=>{
    if(f.type==='number' && (f.min!==undefined || f.max!==undefined)){
      if(f.hardMin===undefined && f.min!==undefined) f.hardMin = f.min;
      if(f.hardMax===undefined && f.max!==undefined) f.hardMax = f.max;
      delete f.min; delete f.max;
      migrated = true;
    }
  }));
  if(migrated) await saveSchema();
  if(!stageIds().includes(currentStage)) currentStage = stageIds()[0];
  const metaPoClosures = await idbGet('meta','poClosures');
  if(metaPoClosures && metaPoClosures.value) poClosures = metaPoClosures.value;
  const metaPoList = await idbGet('meta','poList');
  if(metaPoList && Array.isArray(metaPoList.value)) PO_LIST = metaPoList.value;
  const metaClientList = await idbGet('meta','clientList');
  if(metaClientList && Array.isArray(metaClientList.value)) CLIENT_LIST = metaClientList.value;
  await refreshCache();
  if(allCheckpoints.length===0){
    const backup = localStorage.getItem('shiftly_backup');
    if(backup){
      try{
        const records = JSON.parse(backup);
        for(const r of records) await idbPut('shifts', r);
        await refreshCache();
      }catch(e){}
    }
  }
  // One-time migration: records from before the checkpoint model have a
  // `.stages` object and no `.section` — split each into the new
  // per-section-per-PO checkpoint shape, then remove the old record.
  const legacyRecords = allCheckpoints.filter(r=>r.section===undefined);
  if(legacyRecords.length>0){
    let createdCount = 0;
    for(const old of legacyRecords){
      const newCps = splitLegacyIntoCheckpoints(old);
      for(const cp of newCps){ await idbPut('shifts', cp); createdCount++; }
      await idbDelete('shifts', old.key);
    }
    await refreshCache();
    await persistAll();
    toast(`Đã tự động chuyển đổi ${legacyRecords.length} ca cũ sang ${createdCount} điểm kiểm tra`);
  }
  updateCloudPill();
  renderAll();
  if(cloudConfigured()){ startRealtime(); flushOutbox(); }
})();

</script>
